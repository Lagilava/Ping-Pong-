<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Ping Pong - Neon Edition</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/fonts.css">
    <style>
        :root {
            --bg: #021019;
            --text: #e8f4ff;
            --app-width: 100vw;
            --app-height: 100dvh;
            --accent-cold: #00d9ff;
            --accent-hot: #009dff;
            --accent-purple: #00d0ff;
            --accent-green: #00ff88;
            --scan-speed: 3.2s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: var(--app-height);
            background: var(--bg); color: var(--text);
            overflow: hidden;
            font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        }

        body { display: block; user-select: none; }

        .intro {
            position: fixed; inset: 0;
            width: var(--app-width); height: var(--app-height);
            overflow: hidden; opacity: 0;
            will-change: opacity, transform;
            background: linear-gradient(180deg, #04080f 0%, #060c18 100%);
        }

        .intro.active {
            animation: introFadeIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards,
                       introFadeOut 0.5s ease-in var(--fade-delay, 7s) forwards;
        }

        #introCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

        .black-levels {
            position: absolute; inset: 0; pointer-events: none;
            mix-blend-mode: multiply; opacity: 0.82;
            background: radial-gradient(circle at 50% 25%, rgba(255,255,255,0), rgba(0,0,0,0.72) 55%, rgba(0,0,0,0.92) 92%);
            filter: brightness(0.92) contrast(1.89);
        }

        .title {
            position: absolute; inset: auto 0 11% 0;
            text-transform: uppercase; letter-spacing: 0.30em;
            font-size: clamp(20px, 4vw, 48px); text-align: center;
            opacity: 0; display: none; pointer-events: none; font-weight: 400;
            font-family: 'Orbitron', sans-serif;
            color: rgba(220,240,255,0.96);
            text-shadow: 0 0 10px rgba(120,200,255,0.6), 0 0 30px rgba(90,150,220,0.3), 0 0 60px rgba(70,120,170,0.14);
            will-change: opacity, transform;
        }
        .title.active {
            display: block;
            animation: titleSlideIn 1.65s cubic-bezier(0.16, 1, 0.3, 1) both,
                       titleFlicker 2.6s ease-in-out 1.65s infinite;
        }
        .title span { color: rgba(220,120,80,0.9); text-shadow: 0 0 8px rgba(200,100,60,0.6), 0 0 25px rgba(180,80,40,0.25); }

        @keyframes introFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes titleSlideIn { 0% { opacity: 0; transform: translateY(20px); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes titleFlicker {
            0%,100% { text-shadow: 0 0 8px rgba(140,180,220,0.5), 0 0 25px rgba(100,150,200,0.2); color: rgba(200,220,240,0.92); }
            50% { text-shadow: 0 0 12px rgba(160,200,240,0.65), 0 0 35px rgba(120,170,220,0.28); color: rgba(215,230,248,1); }
        }
        @keyframes introFadeOut { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

        /* ─── ENHANCED UNLOCK OVERLAY ─────────────────────────────────── */
        #audioUnlockOverlay {
            position: fixed; inset: 0; z-index: 9999;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #071534 0%, #030b1d 100%);
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Animated grid background */
        #overlayGrid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(88,216,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88,216,255,0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPulse 4s ease-in-out infinite;
        }
        #overlayGrid::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 30%, #04080f 80%);
        }

        /* Horizontal scan line */
        #scanLine {
            position: absolute; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(88,216,255,0.0) 10%, rgba(88,216,255,0.8) 50%, rgba(88,216,255,0.0) 90%, transparent 100%);
            box-shadow: 0 0 14px rgba(88,216,255,0.75), 0 0 36px rgba(60,170,230,0.26);
            animation: scanDown var(--scan-speed) linear infinite;
        }

        /* Corner brackets */
        .corner {
            position: absolute; width: 32px; height: 32px;
            border-color: rgba(100,160,220,0.5); border-style: solid;
            opacity: 0;
            animation: cornerFadeIn 0.8s ease forwards;
        }
        .corner-tl { top: clamp(20px,5vh,50px); left: clamp(20px,5vw,60px); border-width: 1.5px 0 0 1.5px; animation-delay: 0.1s; }
        .corner-tr { top: clamp(20px,5vh,50px); right: clamp(20px,5vw,60px); border-width: 1.5px 1.5px 0 0; animation-delay: 0.2s; }
        .corner-bl { bottom: clamp(20px,5vh,50px); left: clamp(20px,5vw,60px); border-width: 0 0 1.5px 1.5px; animation-delay: 0.3s; }
        .corner-br { bottom: clamp(20px,5vh,50px); right: clamp(20px,5vw,60px); border-width: 0 1.5px 1.5px 0; animation-delay: 0.4s; }

        /* Side rule lines */
        .side-rule {
            position: absolute; background: rgba(100,160,220,0.18);
            opacity: 0; animation: cornerFadeIn 1.2s ease forwards;
        }
        .side-rule-l { left: clamp(20px,5vw,60px); top: clamp(52px,7vh,82px); width: 1px; height: 40%; animation-delay: 0.5s; }
        .side-rule-r { right: clamp(20px,5vw,60px); top: clamp(52px,7vh,82px); width: 1px; height: 40%; animation-delay: 0.5s; }

        /* Logo / title group */
        #overlayLogo {
            position: relative; z-index: 2; text-align: center;
            opacity: 0; animation: overlayLogoIn 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
        }
        #overlayLogoSmall {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(9px, 1.2vw, 11px); letter-spacing: 0.35em; color: rgba(100,160,220,0.45);
            text-transform: uppercase; margin-bottom: 18px;
            display: flex; align-items: center; gap: 12px; justify-content: center;
        }
        #overlayLogoSmall::before, #overlayLogoSmall::after {
            content: ''; flex: 0 0 clamp(20px,4vw,50px); height: 1px; background: rgba(100,160,220,0.25);
        }

        #overlayMainText {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(14px, 3.2vw, 36px);
            font-weight: 700; letter-spacing: 0.18em;
            text-transform: uppercase; color: rgba(235,255,255,0.97);
            text-shadow: 0 0 18px rgba(100,200,255,0.7), 0 0 50px rgba(70,170,235,0.25);
            margin-bottom: 28px; line-height: 1.2;
        }

        /* Status bars / boot sequence */
        #bootSequence {
            margin-top: 32px; width: clamp(240px, 50vw, 420px);
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(9px,1.3vw,11px);
            letter-spacing: 0.12em; color: rgba(100,160,220,0.6);
        }
        .boot-line {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 6px; opacity: 0;
            animation: bootLineIn 0.25s ease forwards;
        }
        .boot-line .status {
            flex: 0 0 auto; color: rgba(60,200,120,0.8); font-size: 10px;
        }
        .boot-line .status.warn { color: rgba(200,160,60,0.8); }
        .boot-line .bar {
            flex: 1; height: 2px; background: rgba(100,160,220,0.12);
            position: relative; overflow: hidden;
        }
        .boot-line .bar::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(100,180,240,0.7), rgba(80,150,210,0.4));
            transform: scaleX(0); transform-origin: left;
            animation: barFill 0.6s ease forwards;
            animation-delay: inherit;
        }
        .boot-line .label { flex: 0 0 auto; min-width: 140px; color: rgba(140,180,220,0.5); }

        /* TAP prompt */
        #tapPrompt {
            margin-top: 48px; position: relative; z-index: 2;
            opacity: 0; animation: tapPulse 2.2s ease-in-out 1.8s infinite;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(10px, 1.5vw, 13px);
            letter-spacing: 0.45em; text-transform: uppercase;
            color: rgba(140,180,220,0.55);
            display: flex; align-items: center; gap: 14px;
        }
        #tapPrompt::before, #tapPrompt::after {
            content: ''; width: 24px; height: 1px; background: rgba(100,160,220,0.3);
        }

        /* Decorative radial pulse behind main text */
        #overlayPulse {
            position: absolute; pointer-events: none; z-index: 1;
            width: clamp(300px,60vw,600px); height: clamp(300px,60vw,600px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(60,100,180,0.08) 0%, rgba(40,70,140,0.04) 40%, transparent 70%);
            animation: pulseBreathe 5s ease-in-out infinite;
        }

        /* Glitch text effect on main title */
        #overlayMainText.glitch {
            animation: glitchFlash 0.12s steps(2) forwards;
        }

        /* Row of telemetry digits */
        #telemetry {
            position: absolute; bottom: clamp(18px,4vh,40px); left: 0; right: 0;
            display: flex; justify-content: center; gap: clamp(20px,4vw,48px);
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(8px,1vw,10px); letter-spacing: 0.2em;
            color: rgba(100,160,220,0.22); z-index: 2;
            opacity: 0; animation: cornerFadeIn 1s ease 1s forwards;
        }
        .telem-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .telem-val { color: rgba(120,180,240,0.45); font-size: clamp(9px,1.2vw,11px); }

        /* Top bar */
        #overlayTopBar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2;
            padding: clamp(12px,2.5vh,22px) clamp(20px,5vw,60px);
            display: flex; justify-content: space-between; align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(8px,1vw,10px); letter-spacing: 0.25em; color: rgba(100,160,220,0.3);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(100,160,220,0.06);
            opacity: 0; animation: cornerFadeIn 0.8s ease 0.2s forwards;
        }
        #overlayTopBarRight { text-align: right; }

        /* Keyframes */
        @keyframes gridPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes scanDown {
            0% { top: -2px; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes cornerFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes overlayLogoIn {
            from { opacity: 0; transform: translateY(24px) scale(0.95); filter: blur(6px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes bootLineIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
        @keyframes barFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @keyframes tapPulse {
            0%,100% { opacity: 0; }
            40%,60% { opacity: 1; }
        }
        @keyframes pulseBreathe {
            0%,100% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes glitchFlash {
            0% { clip-path: inset(20% 0 60% 0); transform: translate(-4px); color: rgba(120,200,255,0.9); }
            50% { clip-path: inset(60% 0 10% 0); transform: translate(4px); color: rgba(255,120,80,0.9); }
            100% { clip-path: none; transform: none; color: rgba(200,225,248,0.96); }
        }

        /* Collapsing transition when authorizing into the intro - enhanced flow */
        #audioUnlockOverlay.collapsing { pointer-events: none; overflow: hidden; }
        
        #audioUnlockOverlay.collapsing #overlayLogo {
            transform-origin: center center;
            animation: flowExpand 0.9s cubic-bezier(0.16,1,0.3,1) forwards,
                       flowFade 0.9s ease forwards;
        }
        
        #audioUnlockOverlay.collapsing #overlayPulse {
            animation: pulseExpand 0.9s cubic-bezier(0.16,1,0.3,1) forwards,
                       pulseFade 0.9s ease forwards;
        }
        
        #audioUnlockOverlay.collapsing #scanLine {
            animation: scanDissolve 0.8s ease forwards;
        }
        
        #audioUnlockOverlay.collapsing #overlayTopBar,
        #audioUnlockOverlay.collapsing #telemetry {
            animation: elementFlow 0.85s cubic-bezier(0.2,0.9,0.3,1) forwards;
        }
        
        #audioUnlockOverlay.collapsing .corner {
            animation: cornerFlow 0.85s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        
        #audioUnlockOverlay.collapsing .side-rule {
            animation: ruleFlow 0.8s ease forwards;
        }
        
        #audioUnlockOverlay.collapsing #overlayGrid {
            animation: gridFlow 0.9s ease forwards;
        }
        
        #audioUnlockOverlay.collapsing::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(100,220,255,0.2) 0%, transparent 50%);
            animation: flowWave 0.9s ease forwards;
            z-index: 10;
            pointer-events: none;
        }
        
        @keyframes flowExpand {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-120px) scale(1.15); }
        }
        
        @keyframes flowFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        @keyframes pulseExpand {
            0% { transform: scale(1); }
            100% { transform: scale(1.5); }
        }
        
        @keyframes pulseFade {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        
        @keyframes scanDissolve {
            0% { transform: translateY(0); opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-80px); opacity: 0; }
        }
        
        @keyframes elementFlow {
            0% { transform: translateY(0); opacity: 1; }
            70% { opacity: 0.3; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        
        @keyframes cornerFlow {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            50% { opacity: 0.6; }
            100% { 
                transform: translate(var(--corner-flow-x, 0), var(--corner-flow-y, -80px)) scale(0.7);
                opacity: 0;
            }
        }
        
        @keyframes ruleFlow {
            0% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0) translateY(-50px); opacity: 0; }
        }
        
        @keyframes gridFlow {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1) translateY(-40px); }
        }
        
        @keyframes flowWave {
            0% { 
                opacity: 0;
                clip-path: inset(100% 0 0 0);
            }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { 
                opacity: 0;
                clip-path: inset(0 0 100% 0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .intro, .intro.active, .title.active { animation: none !important; }
            .intro, .intro.active { opacity: 1; transform: none; }
            .title { transform: none; opacity: 1; }
            #scanLine, #overlayPulse { animation: none !important; }
            #audioUnlockOverlay.collapsing #overlayLogo,
            #audioUnlockOverlay.collapsing #overlayPulse,
            #audioUnlockOverlay.collapsing #scanLine { transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="intro" aria-label="Ping Pong Neon Edition intro" style="display: none; visibility: hidden;">
        <canvas id="introCanvas"></canvas>
        <div class="black-levels"></div>
        <div class="title">Ping Pong &nbsp;<span>Neon Edition</span></div>
        <video id="autoplayTrap" playsinline muted style="position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0;pointer-events:none;"></video>
    </main>

    <script>
    (function () {
        /* ─── Viewport ──────────────────────────────────────────────────── */
        const getViewportSize = () => {
            const vp = window.visualViewport;
            return {
                width: Math.max(320, Math.round(vp?.width || window.innerWidth || 1280)),
                height: Math.max(240, Math.round(vp?.height || window.innerHeight || 720))
            };
        };
        const syncViewportMetrics = () => {
            const { width, height } = getViewportSize();
            document.documentElement.style.setProperty('--app-width', `${width}px`);
            document.documentElement.style.setProperty('--app-height', `${height}px`);
            return { width, height };
        };

        // Phones get a shorter boot cinematic (it's a heavy full-screen canvas scene).
        const IS_MOBILE_DEVICE = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);
        const INTRO_DURATION_MS = IS_MOBILE_DEVICE ? 4000 : 9000;
        const INTRO_KEY = 'pp_neon_intro_seen';
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const lowPowerDevice = prefersReducedMotion ||
            (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
            (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
        const maxDpr = lowPowerDevice ? 1.5 : 2;
        const postFXEnabled = !lowPowerDevice;
        const fogDensity = lowPowerDevice ? 0.6 : 1;

        const clamp = (v,mn,mx)=>Math.max(mn,Math.min(mx,v));
        const lerp = (a,b,n)=>a+(b-a)*n;
        const easeInOutCubic = n=>n<0.5?4*n*n*n:1-Math.pow(-2*n+2,3)/2;
        const easeOutCubic = n=>1-Math.pow(1-n,3);
        const easeInOutSine = n=>-(Math.cos(Math.PI*n)-1)/2;
        const smoothstep = n=>n*n*(3-2*n);
        const smootherstep = n=>n*n*n*(n*(n*6-15)+10);

        /* ─── Audio Engine ──────────────────────────────────────────────── */
        class CinematicAudioEngine {
            constructor() {
                this.ctx=null; this.masterGain=null; this.compressor=null;
                this.initialized=false; this.startTime=0;
                document.addEventListener('visibilitychange',()=>{
                    if(this.ctx&&!document.hidden&&this.ctx.state==='suspended') this.ctx.resume();
                });
            }
            async init() {
                if(this.initialized) return;
                try {
                    const AC=window.AudioContext||window.webkitAudioContext;
                    if(!AC) return;
                    this.ctx=new AC();
                    this.compressor=this.ctx.createDynamicsCompressor();
                    this.compressor.threshold.setValueAtTime(-24,this.ctx.currentTime);
                    this.compressor.knee.setValueAtTime(40,this.ctx.currentTime);
                    this.compressor.ratio.setValueAtTime(12,this.ctx.currentTime);
                    this.compressor.attack.setValueAtTime(0,this.ctx.currentTime);
                    this.compressor.release.setValueAtTime(0.25,this.ctx.currentTime);
                    this.masterGain=this.ctx.createGain();
                    this.compressor.connect(this.ctx.destination);
                    this.masterGain.connect(this.compressor);
                    this.initialized=true;
                    this.startTime=this.ctx.currentTime;
                    if(this.ctx.state==='suspended') await this.ctx.resume();
                    this.scheduleEntireTrack();
                } catch(e){ console.error('Audio init failed:',e); }
            }
            scheduleEntireTrack() {
                const now=this.ctx.currentTime;
                this._scheduleRumble(now);
                this._scheduleSwell(now);
                this._scheduleImpact(now+0.15,120,1.2,0);
                this._scheduleSpark(now+1.20,-0.7);
                this._scheduleWhip(now+1.20,1.0);
                this._scheduleSpark(now+2.40,0.7);
                this._scheduleImpact(now+4.00,45,2.5,0);
                this._scheduleImpact(now+6.15,80,1.5,0);
            }
            _scheduleRumble(time){
                const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();
                osc.type='sine'; osc.frequency.setValueAtTime(32,time);
                gain.gain.setValueAtTime(0,time);
                gain.gain.linearRampToValueAtTime(0.15,time+2);
                gain.gain.linearRampToValueAtTime(0,time+7);
                osc.connect(gain); gain.connect(this.masterGain);
                osc.start(time); osc.stop(time+7);
            }
            _scheduleSwell(time){
                const filter=this.ctx.createBiquadFilter();
                filter.type='lowpass';
                filter.frequency.setValueAtTime(100,time);
                filter.frequency.exponentialRampToValueAtTime(4000,time+4);
                for(let i=0;i<12;i++){
                    const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();
                    osc.type=i%2===0?'sawtooth':'square';
                    osc.frequency.setValueAtTime(55*(i+1),time);
                    osc.detune.setValueAtTime((Math.random()-0.5)*20,time);
                    gain.gain.setValueAtTime(0,time);
                    gain.gain.linearRampToValueAtTime(0.1/12,time+3.8);
                    gain.gain.exponentialRampToValueAtTime(0.001,time+4.2);
                    osc.connect(gain); gain.connect(filter);
                    osc.start(time); osc.stop(time+5);
                }
                filter.connect(this.masterGain);
            }
            _scheduleWhip(time,panDir){
                const dur=1.0,p=this.ctx.createStereoPanner(),
                    noise=this.ctx.createBufferSource(),gain=this.ctx.createGain(),
                    filter=this.ctx.createBiquadFilter(),subOsc=this.ctx.createOscillator(),
                    subGain=this.ctx.createGain();
                const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
                const d=buf.getChannelData(0);
                for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
                noise.buffer=buf;
                filter.type='lowpass';
                filter.frequency.setValueAtTime(50,time);
                filter.frequency.exponentialRampToValueAtTime(3000,time+dur*0.4);
                filter.frequency.exponentialRampToValueAtTime(100,time+dur);
                filter.Q.setValueAtTime(8,time);
                gain.gain.setValueAtTime(0,time);
                gain.gain.linearRampToValueAtTime(0.7,time+dur*0.4);
                gain.gain.exponentialRampToValueAtTime(0.001,time+dur);
                subOsc.type='sine';
                subOsc.frequency.setValueAtTime(40,time);
                subOsc.frequency.exponentialRampToValueAtTime(150,time+dur*0.4);
                subOsc.frequency.exponentialRampToValueAtTime(40,time+dur);
                subGain.gain.setValueAtTime(0,time);
                subGain.gain.linearRampToValueAtTime(0.5,time+dur*0.4);
                subGain.gain.exponentialRampToValueAtTime(0.001,time+dur);
                p.pan.setValueAtTime(-panDir,time);

            }
            update(){
                this.life++;
                this.x+=this.vx+Math.sin(this.life*0.01)*0.08;
                this.y+=this.vy+Math.cos(this.life*0.015)*0.03;
                const t=this.life/this.maxLife;
                if(t<0.3) this.opacity=this.targetOpacity*Math.pow(t/0.3,1.8);
                else if(t>0.7) this.opacity=this.targetOpacity*Math.pow(1-(t-0.7)/0.3,1.8);
                else this.opacity=this.targetOpacity;
                if(this.life>=this.maxLife) this.reset();
            }
            draw(ctx,lightX,lightY,lightColor,lightColor2){
                const dx=this.x-lightX,dy=this.y-lightY;
                const dist=Math.sqrt(dx*dx+dy*dy);
                const influence=Math.pow(Math.max(0,1-dist/900),2.8);
                if((this.life+Math.floor(this.x))%3===0){
                    const shadowOffset=influence>0?(dist/1400)*40:10;
                    ctx.fillStyle=`rgba(0,0,0,${(0.06*(1-influence)).toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(this.x,this.y+shadowOffset,this.radius*1.5*this.stretchX,this.radius*0.4*this.stretchY,this.rotation,0,Math.PI*2);
                    ctx.fill();
                }
                if(this.opacity<0.005) return;
                const gradient=ctx.createRadialGradient(
                    this.x+(dx/dist)*-30*influence,this.y+(dy/dist)*-30*influence,this.radius*0.05,
                    this.x,this.y,this.radius
                );
                const tintedColor=influence>0.15?lightColor:lightColor2;
                const baseAlpha=this.opacity*(0.35+influence*4.0);
                const rimAlpha=(baseAlpha*(1.1+this.rimLight*influence)).toFixed(3);
                gradient.addColorStop(0,tintedColor.replace('ALPHA',rimAlpha));
                gradient.addColorStop(0.4,tintedColor.replace('ALPHA',(rimAlpha*0.45).toFixed(3)));
                gradient.addColorStop(1,'transparent');
                ctx.fillStyle=gradient;
                ctx.beginPath();
                ctx.ellipse(this.x,this.y,this.radius*this.stretchX,this.radius*this.stretchY,this.rotation,0,Math.PI*2);
                ctx.fill();
            }
        }

                    const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);

                const lightColor=lightingTone>0.5?'rgba(220,100,255,':'rgba(100,220,255,';

                ctx.lineWidth=1.6;
                const circuitAlpha=0.45+Math.sin(time*6)*0.25;
                ctx.strokeStyle=`rgba(0,255,120,${circuitAlpha.toFixed(2)})`;
                const numBranches=Math.max(3,Math.floor(this.h/24));
                for(let i=0;i<numBranches;i++){
                    const t=i/(numBranches-1);
                    const y=-this.h/2+12+t*(this.h-24);
                    const xOuter=this.w/2-Math.max(3,shoulder*0.9);
                    ctx.beginPath(); ctx.moveTo(xOuter,y);
                    ctx.quadraticCurveTo(xOuter-this.w*0.35,y+Math.sin(time*2+i)*6,Math.cos(i+time)*4,Math.sin(i*1.2+time)*3);
                    ctx.stroke();
                    ctx.fillStyle=`rgba(255,255,120,${(0.35+Math.abs(Math.sin(time*6+i))*0.6).toFixed(2)})`;
                    ctx.beginPath(); ctx.arc(xOuter-6,y+Math.sin(time*3+i)*2,2.2,0,Math.PI*2); ctx.fill();
                }
                ctx.lineWidth=2;
                for(let a=0;a<3;a++){
                    const phase=time*(3+a)+a*1.37;
                    const ax=Math.cos(phase)*(this.w*0.55),ay=Math.sin(phase*0.9)*(this.h*0.35);
                    const bx=Math.cos(phase+1.2)*(this.w*0.2),by=Math.sin(phase+0.8)*(this.h*0.15);
                    ctx.beginPath();
                    ctx.strokeStyle=`rgba(255,220,90,${(0.6+Math.sin(phase*4)*0.2).toFixed(2)})`;
                    ctx.moveTo(ax,ay); ctx.bezierCurveTo(ax*0.6,ay*0.4,bx*1.2,by*1.4,bx,by); ctx.stroke();
                }
                ctx.save(); ctx.globalCompositeOperation='lighter';
                traceHullPath(this.w+14+transformPulse*10,this.h+18+transformPulse*16,0.85);
                const auraGradient=ctx.createRadialGradient(0,0,coreR*0.1,0,0,Math.max(this.w,this.h)*0.7);
                auraGradient.addColorStop(0,`rgba(255,60,40,${(0.22+transformPulse*0.18).toFixed(2)})`);
                auraGradient.addColorStop(0.5,`rgba(255,40,20,${(0.12+transformPulse*0.08).toFixed(2)})`);
                auraGradient.addColorStop(1,'transparent');
                ctx.fillStyle=auraGradient; ctx.fill(); ctx.restore();
                ctx.save(); ctx.globalCompositeOperation='lighter';
                ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,0.3)';
                traceHullPath(); ctx.stroke(); ctx.restore();
            }
            renderPlayer(ctx,time,hitGlow,pulse,pulseIntensity,transformPulse){
                ctx.fillStyle='#0D0D14';
                this._roundRect(ctx,-this.w/2,-this.h/2,this.w,this.h,3); ctx.fill();
                ctx.fillStyle='#1C1C26';
                ctx.beginPath();
                ctx.moveTo(-this.w/2,-this.h/2); ctx.lineTo(this.w/2*0.9,-this.h/2+this.h*0.25);
                ctx.lineTo(this.w/2*0.9,this.h/2-this.h*0.25); ctx.lineTo(-this.w/2,this.h/2);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.w/2,-this.h/2); ctx.lineTo(-this.w/2*0.9,-this.h/2+this.h*0.25);
                ctx.lineTo(-this.w/2*0.9,this.h/2-this.h*0.25); ctx.lineTo(this.w/2,this.h/2);
                ctx.closePath(); ctx.fill();
                const hexAlpha=Math.floor(pulse*128+64).toString(16).padStart(2,'0');
                ctx.strokeStyle=this.primaryColor+hexAlpha; ctx.lineWidth=1.5;
                const hexSize=16+Math.sin(time*3)*2;
                for(let y=-this.h/2+hexSize;y<this.h/2;y+=hexSize*1.5){
                    for(let x=-this.w/2+hexSize;x<this.w/2;x+=hexSize*2){
                        const offset=(Math.floor((y+hexSize)/(hexSize*1.5))%2)*hexSize;
                        this._drawHex(ctx,x+offset,y,hexSize*0.85);
                    }
                }
                const coreScale=1+transformPulse*0.6+Math.sin(time*8)*0.1;
                const core=ctx.createRadialGradient(0,0,0,0,0,this.w*0.4*coreScale);
                core.addColorStop(0,'#FFFFFF'); core.addColorStop(0.15,this.secondaryColor);
                core.addColorStop(0.4,this.primaryColor); core.addColorStop(0.8,this.primaryColor+'44');
                core.addColorStop(1,'#00000000');
                ctx.fillStyle=core; this._drawAllSpark(ctx,0,0,this.w*0.35*coreScale);
                ctx.strokeStyle=this.secondaryColor; ctx.lineWidth=3+transformPulse*12;
                ctx.globalAlpha=0.7+pulse*0.3;
                ctx.strokeRect(-this.w/2+6,-this.h/2+6,this.w-12,this.h-12);
                ctx.globalAlpha=1;
                const withAlpha=(color,alpha)=>{
                    const rgb=color.replace(/[^\d,]/g,'').split(',').map(Number);
                    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
                };
                const topLight=ctx.createLinearGradient(0,-this.h/2,0,-this.h/2+30);
                topLight.addColorStop(0,withAlpha(this.secondaryColor,1));
                topLight.addColorStop(1,withAlpha(this.secondaryColor,0));
                ctx.fillStyle=topLight; ctx.fillRect(-this.w/2,-this.h/2,this.w,30);
                const bottomLight=ctx.createLinearGradient(0,this.h/2,0,this.h/2-30);
                bottomLight.addColorStop(0,withAlpha(this.secondaryColor,1));
                bottomLight.addColorStop(1,withAlpha(this.secondaryColor,0));
                ctx.fillStyle=bottomLight; ctx.fillRect(-this.w/2,this.h/2-30,this.w,30);
                ctx.save(); ctx.globalCompositeOperation='lighter';
                ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.25)';
                this._roundRect(ctx,-this.w/2,-this.h/2,this.w,this.h,3);
                ctx.stroke(); ctx.restore();
            }
            _drawHex(ctx,x,y,size){
                ctx.beginPath();
                for(let i=0;i<6;i++){
                    const angle=Math.PI/3*i+0.1;
                    const hx=x+Math.cos(angle)*size, hy=y+Math.sin(angle)*size*0.9;
                    if(i===0) ctx.moveTo(hx,hy); else ctx.lineTo(hx,hy);
                }
                ctx.closePath(); ctx.stroke();
            }
            _drawAllSpark(ctx,x,y,size){
                const time=Date.now()*0.001;
                const pulsate=Math.sin(time*6)*0.5+0.5;
                const animatedSize=size*(0.9+pulsate*0.1);
                ctx.save(); ctx.translate(x,y); ctx.rotate(time);
                ctx.beginPath();
                for(let i=0;i<8;i++){
                    const a1=(i*2)*Math.PI/8, a2=(i*2+1)*Math.PI/8;
                    const x1=Math.cos(a1)*animatedSize, y1=Math.sin(a1)*animatedSize*1.2;
                    const x2=Math.cos(a2)*animatedSize*0.6, y2=Math.sin(a2)*animatedSize*0.6*1.2;
                    ctx.lineTo(x1,y1);
                    ctx.quadraticCurveTo(Math.cos((a1+Math.PI/8))*animatedSize*0.8,Math.sin((a1+Math.PI/8))*animatedSize*0.8*1.2,x2,y2);
                }
                ctx.closePath();
                const gradient=ctx.createRadialGradient(0,0,0,0,0,animatedSize);
                gradient.addColorStop(0,'#FFFFFF'); gradient.addColorStop(0.1,'#FFD700');
                gradient.addColorStop(0.3,this.secondaryColor); gradient.addColorStop(0.6,this.primaryColor+'AA');
                gradient.addColorStop(1,this.primaryColor+'00');
                ctx.fillStyle=gradient; ctx.fill();
                ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2; ctx.globalAlpha=0.6;
                for(let i=0;i<4;i++){
                    const sa=time*2+i*Math.PI/2;
                    const sl=animatedSize*(0.3+Math.random()*0.2);
                    ctx.beginPath(); ctx.moveTo(0,0);
                    ctx.lineTo(Math.cos(sa)*sl,Math.sin(sa)*sl); ctx.stroke();
                }
                ctx.restore();
            }
        }

        /* ─── Scene globals ─────────────────────────────────────────────── */
        const intro=document.querySelector('.intro');
        const canvas=document.getElementById('introCanvas');
        const ctx=canvas.getContext('2d');
        let width=0,height=0;
        let player=null,ai=null;
        let lastTime=performance.now(), introStartTime=0;
        let camStateX=0,camStateY=0,camStateScale=1,camStateInit=false;
        let whipPanState=0, playerBaseY=0, aiBaseY=0;
        let fogParticles=[], rainParticles=[], islandProfiles=[];
        const lightningState={nextStrikeAt:1.4,flash:0,boltFade:0,bolts:[],strikeX:0,tone:0.5,chainWindowUntil:0};

        /* Fake ball for AO pass */
        const ball = { x: 0, y: 0 };

        const resize=()=>{
            const viewport=syncViewportMetrics();
            const rect=intro.getBoundingClientRect();
            const dpr=Math.min(window.devicePixelRatio||1,maxDpr);
            width=Math.max(1,Math.round(rect.width||viewport.width));
            height=Math.max(1,Math.round(rect.height||viewport.height));
            canvas.width=Math.max(1,Math.floor(width*dpr));
            canvas.height=Math.max(1,Math.floor(height*dpr));
            ctx.setTransform(dpr,0,0,dpr,0,0);
            if('imageSmoothingEnabled' in ctx){ ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; }
            buffer.width=canvas.width; buffer.height=canvas.height;

            const ar=width/height;
            let ph=ar>2.5?0.14:ar<0.5?0.20:ar<=0.67?0.22:0.18;
            const paddleH=Math.max(50,Math.min(160,Math.floor(height*ph)));
            const paddleW=Math.max(10,Math.min(35,Math.floor(width*(width<400?0.018:width>1400?0.014:0.015))));
            const hm=Math.max(56,Math.min(220,width*0.16));

            player=new Paddle(hm,height/2-paddleH/2,paddleW,paddleH,'#00e8ff',false);
            ai=new Paddle(width-hm-paddleW,height/2-paddleH/2,paddleW,paddleH,'#ff5500',true);
            player.energyPulse=0.35; ai.energyPulse=0.50;
            playerBaseY=player.pos.y; aiBaseY=ai.pos.y;
            camStateX=width*0.5; camStateY=height*0.5; camStateScale=1;
            camStateInit=false; whipPanState=0;

            ball.x=width*0.5; ball.y=height*0.5;

            fogParticles=[];
            const fc=Math.max(24,Math.floor((width*height)/(14000/fogDensity)));
            for(let i=0;i<fc;i++) fogParticles.push(new FogParticle(width,height));

            rainParticles=[];
            const rc=Math.max(100,Math.floor((width*height)/4000));
            for(let i=0;i<rc;i++){
                rainParticles.push({
                    x:(Math.random()*3-1)*width,y:(Math.random()*3-1)*height,
                    z:0.3+Math.random()*0.7,vx:1.5+Math.random()*3,vy:20+Math.random()*15,
                    length:15+Math.random()*20
                });
            }

            islandProfiles=[
                {anchor:0.13,width:0.23,height:0.17,driftAmp:width*0.008,driftSpeed:0.07,phase:0.5,haze:0.11,noise:[]},
                {anchor:0.31,width:0.16,height:0.11,driftAmp:width*0.006,driftSpeed:0.09,phase:1.8,haze:0.09,noise:[]},
                {anchor:0.50,width:0.29,height:0.19,driftAmp:width*0.01,driftSpeed:0.06,phase:2.2,haze:0.14,noise:[]},
                {anchor:0.73,width:0.18,height:0.12,driftAmp:width*0.007,driftSpeed:0.085,phase:4.1,haze:0.1,noise:[]},
                {anchor:0.89,width:0.24,height:0.16,driftAmp:width*0.009,driftSpeed:0.08,phase:5.4,haze:0.12,noise:[]}
            ];
            islandProfiles.forEach(isp=>{
                for(let n=0;n<60;n++) isp.noise.push({
                    p:Math.random(),h:0.1+Math.pow(Math.random(),2)*0.9,
                    s:0.05+Math.random()*0.15,
                    t:Math.random()>0.8?'tower':(Math.random()>0.4?'crag':'plateau'),
                    slope:Math.random()*0.5+0.5
                });
            });
            lightningState.strikeX=width*0.5;
            lightningState.nextStrikeAt=1.2+Math.random()*1.8;
            lightningState.flash=0; lightningState.boltFade=0; lightningState.bolts=[];
            lightningState.pregeneratedBolts=[]; lightningState.tone=0.5; lightningState.chainWindowUntil=0;
        };

        const generateBoltPath=(sx,sy,ex,ey)=>{
            const points=[{x:sx,y:sy}];
            const gen=(x1,y1,x2,y2,depth)=>{
                if(depth<=0) return;
                const mx=(x1+x2)/2,my=(y1+y2)/2;
                const jitter=(Math.random()-0.5)*(width*0.08/(7-depth));
                const nx=mx+jitter,ny=my;
                if(depth===1) points.push({x:nx,y:ny});
                gen(x1,y1,nx,ny,depth-1); gen(nx,ny,x2,y2,depth-1);
            };
            gen(sx,sy,ex,ey,6);
            points.sort((a,b)=>a.y-b.y);
            return points;
        };

        const triggerLightning=(t)=>{
            const horizonY=height*0.73;
            if(lightningState.pregeneratedBolts.length<5){
                const isp=islandProfiles[Math.floor(Math.random()*islandProfiles.length)]||{anchor:0.5};
                const fx=width*isp.anchor;
                const sx=fx+(Math.random()-0.5)*width*0.3, ex=sx+(Math.random()-0.5)*width*0.4;
                const pts=generateBoltPath(sx,-height*0.2,ex,horizonY);
                lightningState.pregeneratedBolts.push({points:pts,thickness:1.5+Math.random()*2.5});
            }
            const sel=lightningState.pregeneratedBolts[Math.floor(Math.random()*lightningState.pregeneratedBolts.length)];
            const flip=Math.random()>0.5?-1:1, xOff=(Math.random()-0.5)*width*0.2;
            const pp=sel.points.map(p=>({x:((p.x-sel.points[0].x)*flip)+sel.points[0].x+xOff,y:p.y}));
            lightningState.bolts=[{points:pp,thickness:sel.thickness}];
            lightningState.boltFade=1; lightningState.flash=0.8; lightningState.tone = 0.25 + Math.random()*0.15;
            lightningState.strikeX=pp[pp.length-1].x;
            lightningState.nextStrikeAt=t+1.2+Math.random()*2.5;
        };

        const buffer=document.createElement('canvas');
        const bctx=buffer.getContext('2d');
        const grain=document.createElement('canvas');
        const grainSize=128; grain.width=grainSize; grain.height=grainSize;
        const gctx=grain.getContext('2d');
        const grainData=gctx.createImageData(grainSize,grainSize);

        const drawScene=(t,dt)=>{
            ctx.clearRect(0,0,width,height);
            let whipPanStrengthTarget=0;
            let targetFocusX=width*0.5,targetFocusY=height*0.5,targetScale=1;

            if(player&&ai){
                const pcx=player.pos.x+player.w/2,pcy=player.pos.y+player.h/2;
                const acx=ai.pos.x+ai.w/2,acy=ai.pos.y+ai.h/2;
                const initialJumpEnd=0.15,closePlayerEnd=1.20,whipToAiEnd=1.68,aiHoldEnd=2.40,zoomOutEnd=4.00;
                if(t<initialJumpEnd){
                    const k=smoothstep(clamp(t/initialJumpEnd,0,1));
                    targetScale=lerp(3.0,2.7,k); targetFocusX=pcx; targetFocusY=pcy;
                } else if(t<closePlayerEnd){
                    const k=smootherstep(clamp((t-initialJumpEnd)/(closePlayerEnd-initialJumpEnd),0,1));
                    targetScale=lerp(2.7,2.0,k);
                    targetFocusX=lerp(pcx-18,pcx+10,k); targetFocusY=lerp(pcy+2,pcy-6,k);
                } else if(t<whipToAiEnd){
                    const kRaw=clamp((t-closePlayerEnd)/(whipToAiEnd-closePlayerEnd),0,1);
                    const k=easeInOutSine(kRaw);
                    targetScale=lerp(2.0,1.9,k);
                    targetFocusX=lerp(pcx+10,acx-8,k); targetFocusY=lerp(pcy-6,acy,k);
                    whipPanStrengthTarget=Math.sin(kRaw*Math.PI);
                } else if(t<aiHoldEnd){
                    const k=smootherstep(clamp((t-whipToAiEnd)/(aiHoldEnd-whipToAiEnd),0,1));
                    targetScale=lerp(1.9,1.65,k);
                    targetFocusX=lerp(acx-8,acx+4,k); targetFocusY=lerp(acy,acy-6,k);
                } else if(t<zoomOutEnd){
                    const k=smootherstep(clamp((t-aiHoldEnd)/(zoomOutEnd-aiHoldEnd),0,1));
                    targetScale=lerp(1.65,1.0,k);
                    targetFocusX=lerp(acx+4,width*0.5,k); targetFocusY=lerp(acy-6,height*0.5,k);
                } else if(t<zoomOutEnd+2.15){
                    const k2=clamp((t-(zoomOutEnd+2.0))/0.15,0,1);
                    targetScale=1.0+Math.sin(k2*Math.PI)*0.12;
                    targetFocusX=width*0.5; targetFocusY=height*0.5;
                }
            }

            targetFocusX+=Math.sin(t*2.5)*1.0;
            targetFocusY+=Math.sin(t*2.1+0.7)*0.6;

            if(!camStateInit){
                camStateX=targetFocusX; camStateY=targetFocusY; camStateScale=targetScale; camStateInit=true;
            }
            const follow=1-Math.exp(-dt*12);
            const zoomFollow=1-Math.exp(-dt*10);
            const whipFollow=1-Math.exp(-dt*18);
            camStateX+=(targetFocusX-camStateX)*follow;
            camStateY+=(targetFocusY-camStateY)*follow;
            camStateScale+=(targetScale-camStateScale)*zoomFollow;
            whipPanState+=(whipPanStrengthTarget-whipPanState)*whipFollow;

            ctx.save();
            ctx.translate(width*0.5,height*0.5);
            ctx.scale(camStateScale,camStateScale);
            ctx.translate(-camStateX,-camStateY);

            const bgParallax=0.85;
            const scenePadX=width*0.7,scenePadY=height*0.4;
            const sceneLeft=-scenePadX,sceneTop=-scenePadY;
            const sceneW=width+scenePadX*2,sceneH=height+scenePadY*2;

            if(t>=lightningState.nextStrikeAt) triggerLightning(t);
            lightningState.flash=Math.max(0,lightningState.flash-dt*1.95);
            lightningState.boltFade=Math.max(0,lightningState.boltFade-dt*2.6);
            if(lightningState.chainWindowUntil>0&&t>lightningState.chainWindowUntil&&lightningState.boltFade<0.1){
                lightningState.nextStrikeAt=t+0.8+Math.random()*2.0;
                lightningState.chainWindowUntil=0;
            }
            const lightningStrength=lightningState.flash;
            const skyCoreRGB='100,220,255';
            const skyEdgeRGB='20,160,255';
            const unifiedAlpha=(lightningStrength*1.0).toFixed(3);

            ctx.fillStyle='#04080f';
            ctx.fillRect(sceneLeft,sceneTop,sceneW,sceneH);

            ctx.save();
            ctx.translate(camStateX*(1-bgParallax),camStateY*(1-bgParallax*0.5));
            ctx.globalAlpha=0.08+lightningStrength*0.25;
            ctx.fillStyle='#c8d8e8';
            for(let i=0;i<80;i++){
                const sx=(Math.sin(i*234.56)*0.5+0.5)*sceneW+sceneLeft;
                const sy=(Math.cos(i*567.89)*0.5+0.5)*(height*0.28)+sceneTop;
                const r=(Math.sin(i)*0.5+0.5)*1.2;
                ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(camStateX*(1-bgParallax*0.7),camStateY*(1-bgParallax*0.3));
            const cloudLayers=[
                {y:0.08,thick:0.22,speed:0.018,alpha:0.55,color:'18,24,36'},
                {y:0.14,thick:0.28,speed:0.025,alpha:0.65,color:'12,18,28'},
                {y:0.22,thick:0.32,speed:0.015,alpha:0.50,color:'22,30,44'},
                {y:0.05,thick:0.18,speed:0.030,alpha:0.40,color:'30,40,55'}
            ];
            for(const cl of cloudLayers){
                const cloudY=height*cl.y;
                for(let ci=0;ci<8;ci++){
                    const cx2=(Math.sin(ci*137.5+cl.speed*1000)*0.5+0.5)*(sceneW*1.3)+sceneLeft-sceneW*0.15;
                    const cOff=t*cl.speed*width*0.12+ci*width*0.22;
                    const cloudX=((cx2+cOff)%(sceneW*1.4))+sceneLeft-sceneW*0.1;
                    const cw=width*(0.28+(ci%3)*0.12);
                    const ch=height*cl.thick*(0.6+Math.sin(ci*2.3)*0.4);
                    const cloudGrad=ctx.createRadialGradient(cloudX,cloudY,0,cloudX,cloudY+ch*0.3,Math.max(cw,ch));
                    const litAlpha=cl.alpha+lightningStrength*0.3;
                    cloudGrad.addColorStop(0,`rgba(${cl.color},${litAlpha.toFixed(2)})`);
                    cloudGrad.addColorStop(0.5,`rgba(${cl.color},${(litAlpha*0.55).toFixed(2)})`);
                    cloudGrad.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle=cloudGrad;
                    ctx.beginPath(); ctx.ellipse(cloudX,cloudY,cw,ch,0,0,Math.PI*2); ctx.fill();
                }
                if(lightningStrength>0.05){
                    ctx.save(); ctx.globalCompositeOperation='screen';
                    const cUY=height*(cl.y+cl.thick*0.5);
                    const cUSG=ctx.createRadialGradient(lightningState.strikeX,cUY,0,lightningState.strikeX,cUY,width*0.7);
                    cUSG.addColorStop(0,`rgba(${skyCoreRGB},${(lightningStrength*0.15).toFixed(3)})`);
                    cUSG.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle=cUSG;
                    ctx.fillRect(sceneLeft,cUY-height*0.05,sceneW,height*cl.thick*0.6);
                    ctx.restore();
                }
            }
            ctx.restore();

            const keyLightX=width*0.5,keyLightY=-height*0.12;
            const ambientR=Math.max(width,height)*1.1;
            const ambientGrad=ctx.createRadialGradient(keyLightX,keyLightY,0,keyLightX,keyLightY,ambientR);
            const ambientAlpha=0.05+lightningStrength*0.20;
            ambientGrad.addColorStop(0,`rgba(${skyCoreRGB},${ambientAlpha.toFixed(3)})`);
            ambientGrad.addColorStop(0.2,`rgba(${skyEdgeRGB},${(ambientAlpha*0.6).toFixed(3)})`);
            ambientGrad.addColorStop(0.5,`rgba(${skyEdgeRGB},${(ambientAlpha*0.25).toFixed(3)})`);
            ambientGrad.addColorStop(0.85,'rgba(4,8,18,0.02)');
            ambientGrad.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=ambientGrad; ctx.fillRect(sceneLeft,sceneTop,sceneW,sceneH);

            if(lightningStrength>0.01){
                ctx.save(); ctx.globalCompositeOperation='screen';
                const skyFlash=ctx.createRadialGradient(lightningState.strikeX,height*0.16,0,lightningState.strikeX,height*0.16,width*1.5);
                skyFlash.addColorStop(0,`rgba(${skyCoreRGB},${unifiedAlpha})`);
                skyFlash.addColorStop(0.35,`rgba(${skyEdgeRGB},${(lightningStrength*0.55).toFixed(3)})`);
                skyFlash.addColorStop(0.75,`rgba(50,20,100,${(lightningStrength*0.25).toFixed(3)})`);
                skyFlash.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle=skyFlash; ctx.fillRect(sceneLeft,sceneTop,sceneW,sceneH*1.2);
                ctx.restore();
            }

            const horizonY=height*0.73;
            ctx.save();
            for(let i=0;i<islandProfiles.length;i++){
                const island=islandProfiles[i];
                const centerX=width*island.anchor+Math.sin(t*island.driftSpeed+island.phase)*island.driftAmp;
                const islandW=width*island.width, islandH=height*island.height;
                const leftX=centerX-islandW*0.5;

                const drawIslandPath=(ctx,startX,endX,groundY,peakH)=>{
                    ctx.beginPath(); ctx.moveTo(startX,groundY);
                    const steps=15;
                    for(let s=1;s<steps;s++){
                        const prog=s/steps, x=startX+(endX-startX)*prog;
                        const n1=Math.sin(prog*Math.PI)*0.8, n2=Math.cos(prog*12+i)*0.2, n3=Math.sin(prog*25+t)*0.05;
                        ctx.lineTo(x,groundY-peakH*(n1+n2+n3));
                    }
                    ctx.lineTo(endX,groundY); ctx.closePath();
                };

                ctx.save(); drawIslandPath(ctx,leftX,leftX+islandW,horizonY,islandH);
                const shadowGrad=ctx.createLinearGradient(0,horizonY-islandH,0,horizonY);
                shadowGrad.addColorStop(0,`rgba(5,7,20,${(0.75-island.haze).toFixed(3)})`);
                shadowGrad.addColorStop(1,'#000000');
                ctx.fillStyle=shadowGrad; ctx.fill(); ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='screen';
                drawIslandPath(ctx,leftX,leftX+islandW,horizonY,islandH);
                const rimGrad=ctx.createLinearGradient(leftX,horizonY-islandH,leftX+islandW,horizonY);
                rimGrad.addColorStop(0,'rgba(0,255,136,0.35)');
                rimGrad.addColorStop(0.5,`rgba(100,200,255,${(0.25+lightningStrength*0.4).toFixed(3)})`);
                rimGrad.addColorStop(1,'rgba(184,78,255,0.28)');
                ctx.strokeStyle=rimGrad; ctx.lineWidth=2.5+lightningStrength*3; ctx.stroke(); ctx.restore();

                ctx.save(); ctx.translate(centerX,horizonY);
                // Terrain details removed: islands rendered as simple silhouettes per request.
                // Kept empty intentionally to remove towers/crags/plateaus.
                ctx.restore();
            }
            ctx.restore();

            if(lightningState.boltFade>0.01&&lightningState.bolts.length){
                ctx.save(); ctx.globalCompositeOperation='screen';
                for(const bolt of lightningState.bolts){
                    ctx.beginPath(); ctx.moveTo(bolt.points[0].x,bolt.points[0].y);
                    for(let i=1;i<bolt.points.length;i++) ctx.lineTo(bolt.points[i].x,bolt.points[i].y);
                    ctx.strokeStyle=`rgba(${skyEdgeRGB},${(lightningState.boltFade*0.4).toFixed(3)})`;
                    ctx.lineWidth=bolt.thickness*4.5; ctx.shadowBlur=15; ctx.shadowColor=`rgba(${skyEdgeRGB},0.5)`;
                    ctx.stroke();
                    ctx.strokeStyle=`rgba(${skyCoreRGB},${(lightningState.boltFade*0.9).toFixed(3)})`;
                    ctx.lineWidth=bolt.thickness; ctx.shadowBlur=0; ctx.stroke();
                    ctx.strokeStyle=`rgba(255,255,255,${(lightningState.boltFade*0.8).toFixed(3)})`;
                    ctx.lineWidth=bolt.thickness*0.4; ctx.stroke();
                }
                ctx.restore();
            }

            ctx.save(); ctx.globalCompositeOperation='screen';
            const flareRad=width*0.10+Math.sin(t*3.5)*width*0.008;
            const flare=ctx.createRadialGradient(keyLightX,keyLightY,0,keyLightX,keyLightY,flareRad);
            flare.addColorStop(0,`rgba(${skyCoreRGB},${(0.05+lightningStrength*0.04).toFixed(3)})`);
            flare.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=flare; ctx.beginPath(); ctx.arc(keyLightX,keyLightY,flareRad,0,Math.PI*2); ctx.fill();
            ctx.lineWidth=1.8;
            for(let i=0;i<10;i++){
                const angle=i*(Math.PI*2/20)+t*0.05+Math.sin(t*0.4+i)*0.015;
                const lenFactor=1.0+0.12*Math.sin(t*1.8+i*0.3);
                const dx=Math.cos(angle)*width*1.4*lenFactor, dy=Math.sin(angle)*height*1.4*lenFactor;
                const alpha=0.012+0.008*Math.sin(t*2.5+i*0.5);
                const rg=ctx.createLinearGradient(keyLightX,keyLightY,keyLightX+dx,keyLightY+dy);
                rg.addColorStop(0,`rgba(${skyCoreRGB},${(alpha*0.9).toFixed(3)})`);
                rg.addColorStop(0.3,`rgba(${skyEdgeRGB},${(alpha*0.7).toFixed(3)})`);
                rg.addColorStop(0.7,`rgba(${skyEdgeRGB},${(alpha*0.2).toFixed(3)})`);
                rg.addColorStop(1,'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.moveTo(keyLightX,keyLightY); ctx.lineTo(keyLightX+dx,keyLightY+dy);
                ctx.strokeStyle=rg; ctx.stroke();
            }
            ctx.restore();

            const floorY = height*0.73;

            // --- Mirrored island reflections (soft, blurred) ---
            if (typeof ctx.filter !== 'undefined') ctx.save();
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.translate(0, floorY*2);
            ctx.scale(1, -1);
            ctx.globalAlpha = 0.28;
            // softened fill for reflected silhouettes
            for (let i=0;i<islandProfiles.length;i++){
                const island = islandProfiles[i];
                const centerX = width*island.anchor + Math.sin(t*island.driftSpeed + island.phase)*island.driftAmp;
                const islandW = width*island.width, islandH = height*island.height;
                const leftX = centerX - islandW*0.5;
                ctx.beginPath(); ctx.moveTo(leftX, floorY);
                const steps = 12;
                for (let s=1;s<steps;s++){
                    const prog = s/steps; const x = leftX + islandW*prog;
                    const n = Math.sin(prog*Math.PI)*0.7 + Math.cos(prog*9 + i)*0.18 + Math.sin(prog*20 + t)*0.04;
                    ctx.lineTo(x, floorY - islandH*(n*0.9));
                }
                ctx.lineTo(leftX+islandW, floorY); ctx.closePath();
                ctx.fillStyle = 'rgba(6,8,16,0.9)'; ctx.fill();
            }
            // apply blur to reflections where available
            if (ctx.filter !== undefined){ ctx.filter = 'blur(6px)'; ctx.globalCompositeOperation='destination-over';
                ctx.drawImage(canvas,0,0); ctx.filter = 'none'; }
            ctx.restore();
            if (typeof ctx.filter !== 'undefined') ctx.restore();

            // --- Base sea gradient ---
            const seaGradient = ctx.createLinearGradient(0, floorY, 0, height);
            seaGradient.addColorStop(0, '#0a1a2e');
            seaGradient.addColorStop(0.2, '#113250'); // darker near horizon
            seaGradient.addColorStop(0.45, '#1a3a4a');
            seaGradient.addColorStop(0.7, '#0f2742');
            seaGradient.addColorStop(1, '#050810');
            ctx.fillStyle = seaGradient;
            ctx.fillRect(sceneLeft, floorY, sceneW, height - floorY + scenePadY);

            // Add layered sine waves for dynamic surface motion
            const waveCount = 4;
            for (let i = 0; i < waveCount; i++) {
                const amplitude = 1.5 + i * 1.2;
                const wavelength = 70 + i * 24;
                const speed = 0.45 + i * 0.25;
                ctx.beginPath();
                ctx.lineWidth = 0.6 + i * 0.35;
                ctx.strokeStyle = `rgba(20, 90, 140, ${(0.025 + i * 0.018).toFixed(3)})`;
                let first = true;
                for (let x = sceneLeft; x <= sceneLeft + sceneW + 20; x += 10) {
                    const dx = x - sceneLeft;
                    const yOffset = Math.sin(dx / wavelength + t * speed) * amplitude;
                    const y = floorY + yOffset;
                    if (first) { ctx.moveTo(x, y); first = false; }
                    else { ctx.bezierCurveTo(x - 5, y - 1, x - 5, y + 1, x, y); }
                }
                ctx.stroke();
            }

            // Add small surface glints
            ctx.save(); ctx.globalCompositeOperation='screen';
            for (let j=0; j<10; j++) {
                const fX = ((Math.sin(t*0.6 + j*1.3)*0.5+0.5)*sceneW + sceneLeft) % (sceneLeft + sceneW);
                const fY = floorY + (j%6)/6*(height-floorY)*0.6 + Math.sin(t*1.1 + j)*6;
                const fA = 0.02 + Math.sin(t*2.2 + j)*0.05;
                ctx.strokeStyle = `rgba(255,255,255,${fA.toFixed(3)})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath(); ctx.moveTo(fX, fY); ctx.lineTo(fX + 8, fY + 0.5); ctx.stroke();
            }
            ctx.restore();

            // --- Lightning reflections (kept) ---
            if (lightningStrength>0.01){
                ctx.save(); ctx.globalCompositeOperation='screen';
                const sG = ctx.createRadialGradient(lightningState.strikeX, floorY, 0, lightningState.strikeX, floorY, width*0.45);
                sG.addColorStop(0,`rgba(${skyCoreRGB},${(lightningStrength*0.5).toFixed(3)})`);
                sG.addColorStop(0.4,`rgba(${skyEdgeRGB},${(lightningStrength*0.25).toFixed(3)})`);
                sG.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle = sG; ctx.fillRect(sceneLeft, floorY-10, sceneW, 400);
                const rP = ctx.createLinearGradient(lightningState.strikeX-width*0.2, floorY, lightningState.strikeX+width*0.2, floorY);
                rP.addColorStop(0,'rgba(0,0,0,0)');
                rP.addColorStop(0.48,`rgba(${skyCoreRGB},${(lightningStrength*0.45).toFixed(3)})`);
                rP.addColorStop(0.52,`rgba(${skyCoreRGB},${(lightningStrength*0.45).toFixed(3)})`);
                rP.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle = rP; ctx.fillRect(lightningState.strikeX-width*0.25, floorY, width*0.5, height-floorY+scenePadY);
                ctx.restore();
            }

            // --- Layered wave strokes (fewer, smoother) ---
            ctx.save(); ctx.lineCap='round';
            const layers = 16;
            for(let i=0;i<layers;i++){
                const rT = i/(layers-1);
                const rY = floorY + rT*(height-floorY+scenePadY);
                const amp = 6 + rT*36;
                const speed = 0.5 + rT*1.6;
                const alpha = (0.012 + rT*0.045 + lightningStrength*0.09);
                ctx.beginPath(); ctx.lineWidth = 0.6 + rT*2.6; ctx.strokeStyle = `rgba(80,110,140,${alpha.toFixed(3)})`;
                let first = true;
                for(let x=sceneLeft; x<=sceneLeft+sceneW+120; x+=28){
                    const nx = x/width;
                    const wob = Math.sin((x*0.0022) + t*speed + i*0.6)*amp;
                    const shimmer = Math.cos((x*0.008) - t*1.4 + i)*2.2;
                    const y = rY + wob + shimmer * (1.0 - rT);
                    if(first){ ctx.moveTo(x,y); first=false; } else ctx.bezierCurveTo(x-22,y+4,x-10,y-4,x,y);
                }
                ctx.stroke();
            }
            ctx.restore();

            // --- Small surface glints ---
            ctx.save(); ctx.globalCompositeOperation='screen';
            for(let j=0;j<14;j++){
                const fX = ((Math.sin(t*0.6 + j*1.3)*0.5+0.5)*sceneW + sceneLeft + t*12*(j%2===0?1:-1)) % sceneW + sceneLeft;
                const fY = floorY + (j%6)/6*(height-floorY)*0.6 + Math.sin(t*1.1 + j)*6;
                const fA = 0.03 + (Math.sin(t*2.2 + j)*0.5+0.5)*0.10 + lightningStrength*0.06;
                const fl = 12 + (j%3)*10;
                ctx.strokeStyle = `rgba(200,220,240,${fA.toFixed(3)})`; ctx.lineWidth = 0.7;
                ctx.beginPath(); ctx.moveTo(fX, fY); ctx.lineTo(fX + fl, fY + 0.8); ctx.stroke();
            }
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            const lP=ctx.createRadialGradient(keyLightX,floorY,0,keyLightX,floorY,width*0.38);
            lP.addColorStop(0,`rgba(${skyCoreRGB},${(0.10+lightningStrength*0.30).toFixed(3)})`);
            lP.addColorStop(0.35,`rgba(${skyEdgeRGB},${(0.04+lightningStrength*0.12).toFixed(3)})`);
            lP.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=lP;
            ctx.beginPath(); ctx.ellipse(keyLightX,floorY+(height-floorY)*0.28,width*0.22,(height-floorY)*0.85,0,0,Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            const hP=ctx.createLinearGradient(keyLightX-60,floorY,keyLightX+60,floorY);
            hP.addColorStop(0,'rgba(255,255,255,0)');
            hP.addColorStop(0.5,`rgba(180,210,240,${(0.06+lightningStrength*0.18).toFixed(3)})`);
            hP.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle=hP; ctx.fillRect(keyLightX-120,floorY,240,height-floorY); ctx.restore();

            ctx.save();
            const fR=ctx.createLinearGradient(0,floorY,0,floorY+(height-floorY)*0.35);
            fR.addColorStop(0,`rgba(${skyCoreRGB},${(0.06+lightningStrength*0.12).toFixed(3)})`);
            fR.addColorStop(0.5,`rgba(${skyEdgeRGB},${(0.02+lightningStrength*0.04).toFixed(3)})`);
            fR.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=fR; ctx.beginPath(); ctx.rect(sceneLeft,floorY,sceneW,height-floorY+scenePadY); ctx.fill(); ctx.restore();

            // --- Enhanced directional light cones with better gradients ---
            ctx.save(); ctx.globalCompositeOperation='screen';
            const wobble=Math.sin(t*2.3)*0.03*width+Math.sin(t*1.7+0.5)*0.02*width;
            
            // Outer diffuse cone - wider spread
            const coneGrad=ctx.createLinearGradient(keyLightX,keyLightY*0.3,keyLightX,floorY+60);
            coneGrad.addColorStop(0,`rgba(${skyCoreRGB},${(0.10+Math.sin(t*3.1)*0.02).toFixed(3)})`);
            coneGrad.addColorStop(0.25,`rgba(${skyEdgeRGB},${(0.08+Math.sin(t*2.9)*0.015).toFixed(3)})`);
            coneGrad.addColorStop(0.5,`rgba(${skyEdgeRGB},0.04)`);
            coneGrad.addColorStop(0.8,`rgba(${skyEdgeRGB},0.015)`);
            coneGrad.addColorStop(1,'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.moveTo(keyLightX,keyLightY*0.3);
            ctx.lineTo(width*0.02+wobble-width*0.15,floorY+40); 
            ctx.lineTo(width*0.98-wobble+width*0.15,floorY+40);
            ctx.closePath(); ctx.fillStyle=coneGrad; ctx.fill();
            
            // Mid-range cone with subtle shimmer
            const midCone=ctx.createLinearGradient(keyLightX,keyLightY*0.65,keyLightX,floorY+20);
            midCone.addColorStop(0,`rgba(${skyCoreRGB},${(0.06+Math.sin(t*3.5)*0.02).toFixed(3)})`);
            midCone.addColorStop(0.3,`rgba(${skyEdgeRGB},${(0.05+Math.sin(t*2.7)*0.015).toFixed(3)})`);
            midCone.addColorStop(0.7,`rgba(${skyEdgeRGB},0.02)`);
            midCone.addColorStop(1,'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.moveTo(keyLightX,keyLightY*0.65);
            ctx.lineTo(width*0.15+wobble*0.5,floorY+15);
            ctx.lineTo(width*0.85-wobble*0.5,floorY+15);
            ctx.closePath(); ctx.fillStyle=midCone; ctx.fill();
            
            // Bright inner cone - main light beam
            const innerCone=ctx.createLinearGradient(keyLightX,keyLightY*0.8,keyLightX,floorY-10);
            innerCone.addColorStop(0,`rgba(${skyCoreRGB},${(0.18+Math.sin(t*2.2)*0.04).toFixed(3)})`);
            innerCone.addColorStop(0.15,`rgba(${skyCoreRGB},${(0.14+Math.sin(t*2.8)*0.03).toFixed(3)})`);
            innerCone.addColorStop(0.35,`rgba(${skyEdgeRGB},0.08)`);
            innerCone.addColorStop(0.65,`rgba(${skyEdgeRGB},0.04)`);
            innerCone.addColorStop(1,'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.moveTo(keyLightX,keyLightY*0.8);
            ctx.lineTo(width*0.32+wobble*0.3,floorY); 
            ctx.lineTo(width*0.68-wobble*0.3,floorY);
            ctx.closePath(); ctx.fillStyle=innerCone; ctx.fill();
            
            // Volumetric god rays through the scene
            ctx.save();
            for (let rayIdx=0; rayIdx<6; rayIdx++) {
                const rayAngle = (rayIdx/6)*Math.PI*1.2 - Math.PI*0.6 + Math.sin(t*1.5+rayIdx)*0.08;
                const rayDist = Math.max(width,height)*1.3;
                const rayEndX = keyLightX + Math.cos(rayAngle)*rayDist;
                const rayEndY = keyLightY + Math.sin(rayAngle)*rayDist;
                
                ctx.beginPath();
                ctx.moveTo(keyLightX, keyLightY);
                ctx.lineTo(rayEndX-Math.sin(rayAngle)*40, rayEndY+Math.cos(rayAngle)*40);
                ctx.lineTo(rayEndX+Math.sin(rayAngle)*40, rayEndY-Math.cos(rayAngle)*40);
                ctx.closePath();
                
                const rayGrad = ctx.createLinearGradient(keyLightX, keyLightY, rayEndX, rayEndY);
                const rayAlpha = (0.02 + Math.sin(t*2.2+rayIdx)*0.01 + lightningStrength*0.08).toFixed(3);
                rayGrad.addColorStop(0, `rgba(${skyCoreRGB},${rayAlpha})`);
                rayGrad.addColorStop(0.4, `rgba(${skyEdgeRGB},${(rayAlpha*0.4).toFixed(3)})`);
                rayGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = rayGrad;
                ctx.fill();
            }
            ctx.restore(); 
            
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            const hSR=width*0.28;
            const floorSpot=ctx.createRadialGradient(keyLightX,floorY,0,keyLightX,floorY,hSR);
            floorSpot.addColorStop(0,`rgba(${skyCoreRGB},${(0.08+lightningStrength*0.15).toFixed(3)})`);
            floorSpot.addColorStop(0.5,`rgba(${skyEdgeRGB},${(0.03+lightningStrength*0.06).toFixed(3)})`);
            floorSpot.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=floorSpot; ctx.beginPath(); ctx.ellipse(keyLightX,floorY,hSR,45,0,0,Math.PI*2); ctx.fill(); ctx.restore();

            ctx.save(); ctx.lineCap='round';
            const windDrift=350*dt;
            for(let i=0;i<rainParticles.length;i++){
                const rp=rainParticles[i];
                rp.x+=(rp.vx*60)*dt+windDrift*rp.z;
                rp.y+=(rp.vy*60)*dt;
                const bL=camStateX-width*1.5, bR=camStateX+width*1.5, bB=camStateY+height*1.5;
                if(rp.y>bB||rp.x>bR){ rp.y=camStateY-height; rp.x=bL+Math.random()*(width*2.5); }
                if(rp.x<bL-100) continue;
                const spd=rp.length/Math.sqrt(rp.vx*rp.vx+rp.vy*rp.vy);
                const sX=rp.vx*spd*1.5+(windDrift/60)*10, sY=rp.vy*spd*1.5;
                ctx.beginPath(); ctx.moveTo(rp.x,rp.y); ctx.lineTo(rp.x-sX,rp.y-sY);
                const alpha=lightningStrength>0.05?Math.min(1,0.12+lightningStrength*0.55):0.06+rp.z*0.10;
                ctx.lineWidth=(0.4+rp.z*0.7)*(lightningStrength>0.1?1.8:1);
                ctx.strokeStyle=`rgba(190,210,230,${alpha.toFixed(3)})`; ctx.stroke();
            }
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            const pcx=player.pos.x+player.w/2, pcy=player.pos.y+player.h/2;
            const acx=ai.pos.x+ai.w/2, acy=ai.pos.y+ai.h/2;
            const pFR=Math.max(width,height)*0.8;
            const pFill=ctx.createRadialGradient(pcx,pcy,0,pcx,pcy,pFR);
            pFill.addColorStop(0,'rgba(40,120,200,0.07)'); pFill.addColorStop(0.5,'rgba(20,70,130,0.03)'); pFill.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=pFill; ctx.beginPath(); ctx.arc(pcx,pcy,pFR,0,Math.PI*2); ctx.fill();
            const aFR=Math.max(width,height)*0.8;
            const aFill=ctx.createRadialGradient(acx,acy,0,acx,acy,aFR);
            aFill.addColorStop(0,'rgba(180,60,30,0.07)'); aFill.addColorStop(0.5,'rgba(120,30,10,0.03)'); aFill.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=aFill; ctx.beginPath(); ctx.arc(acx,acy,aFR,0,Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            for(const fp of fogParticles){
                fp.update();
                if(fp.x<camStateX-width/camStateScale-400||fp.x>camStateX+width/camStateScale+400) continue;
                const xN=fp.x/width;
                const fc=xN<0.35?'rgba(140,160,180,ALPHA)':xN>0.65?'rgba(130,150,170,ALPHA)':'rgba(160,175,190,ALPHA)';
                fp.draw(ctx,keyLightX,keyLightY,fc,'rgba(180,210,255,ALPHA)');
            }
            ctx.restore();

            ctx.save(); ctx.globalCompositeOperation='screen';
            const bFT=Math.sin(t*0.3)*0.5+0.5;
            const bFX=width*0.5+Math.sin(t*0.2)*width*0.04, bFY=height*0.42+Math.sin(t*0.15)*height*0.06;
            const bFR=width*0.35;
            const beamFog=ctx.createRadialGradient(bFX,bFY,0,bFX,bFY,bFR);
            beamFog.addColorStop(0,`rgba(220,240,255,${(0.06+bFT*0.03).toFixed(3)})`);
            beamFog.addColorStop(0.5,`rgba(180,210,255,${(0.025+bFT*0.015).toFixed(3)})`);
            beamFog.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=beamFog; ctx.beginPath(); ctx.arc(bFX,bFY,bFR,0,Math.PI*2); ctx.fill();
            ctx.restore();

            const drift=Math.sin(t*0.72)*2.8;
            player.pos.y=playerBaseY+drift; ai.pos.y=aiBaseY-drift*0.75;
            ai.alivePhase+=dt;
            player.render(ctx); ai.render(ctx);

            ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.24;
            [player,ai].forEach(pad=>{
                const cx=pad.pos.x+pad.w/2, cy=pad.pos.y+pad.h/2;
                const r=Math.max(pad.w,pad.h)*0.8;
                const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
                g.addColorStop(0,'rgba(255,255,255,0.4)'); g.addColorStop(1,'rgba(255,255,255,0)');
                ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
            });
            ctx.restore();

            ctx.restore(); // end camera transform

            if(whipPanState>0.02){
                ctx.save(); ctx.globalCompositeOperation='screen';
                ctx.globalAlpha=0.05+whipPanState*0.16;
                for(let i=1;i<=4;i++) ctx.drawImage(canvas,i*(4+whipPanState*8),0);
                const streak=ctx.createLinearGradient(0,0,width,0);
                streak.addColorStop(0,'rgba(200,220,255,0)');
                streak.addColorStop(0.45,`rgba(200,220,255,${(0.04+whipPanState*0.05).toFixed(3)})`);
                streak.addColorStop(1,'rgba(200,220,255,0)');
                ctx.fillStyle=streak; ctx.fillRect(0,0,width,height); ctx.restore();
            }

            if(postFXEnabled){
                const img=grainData.data;
                for(let i=0,l=img.length;i<l;i+=4){
                    const v=128+Math.floor((Math.random()-0.5)*60);
                    img[i]=v; img[i+1]=v; img[i+2]=v; img[i+3]=18;
                }
                gctx.putImageData(grainData,0,0);

                ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.14;
                ctx.filter='contrast(1.8) brightness(0.75) saturate(0.7)'; ctx.drawImage(canvas,0,0); ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='multiply';
                const aoE=ctx.createRadialGradient(width*0.5,height*0.52,width*0.16,width*0.5,height*0.52,width*0.9);
                aoE.addColorStop(0,'rgba(0,0,0,0)'); aoE.addColorStop(0.62,'rgba(0,0,0,0.14)'); aoE.addColorStop(1,'rgba(0,0,0,0.42)');
                ctx.fillStyle=aoE; ctx.fillRect(0,0,width,height);
                const aoG=ctx.createLinearGradient(0,height*0.56,0,height);
                aoG.addColorStop(0,'rgba(0,0,0,0)'); aoG.addColorStop(0.58,'rgba(0,0,0,0.10)'); aoG.addColorStop(1,'rgba(0,0,0,0.28)');
                ctx.fillStyle=aoG; ctx.fillRect(0,0,width,height);
                const addAO=(x,y,r,s=0.24)=>{
                    const ao=ctx.createRadialGradient(x,y,0,x,y,r);
                    ao.addColorStop(0,`rgba(0,0,0,${s.toFixed(3)})`);
                    ao.addColorStop(0.6,`rgba(0,0,0,${(s*0.55).toFixed(3)})`);
                    ao.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle=ao; ctx.fillRect(x-r,y-r,r*2,r*2);
                };
                addAO(player.pos.x+player.w*0.5,player.pos.y+player.h*0.74,Math.max(player.h*0.8,90),0.26);
                addAO(ai.pos.x+ai.w*0.5,ai.pos.y+ai.h*0.74,Math.max(ai.h*0.8,90),0.28);
                addAO(ball.x,ball.y+14,56,0.18);
                ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.18;
                ctx.filter=`blur(0.3px)`; ctx.drawImage(canvas,0.8+whipPanState*3.5,0);
                ctx.filter=`blur(0.8px)`; ctx.drawImage(canvas,-0.8-whipPanState*3.5,0);
                ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.06;
                ctx.filter='contrast(1.4) grayscale(1)'; ctx.drawImage(canvas,-1,-1); ctx.restore();
                ctx.filter='none';

                bctx.clearRect(0,0,buffer.width,buffer.height); bctx.drawImage(canvas,0,0);
                ctx.save(); ctx.globalCompositeOperation='screen';
                ctx.globalAlpha=0.17; ctx.filter='brightness(1.2) contrast(1.1) blur(2px) saturate(0.9)'; ctx.drawImage(buffer,0,0);
                ctx.globalAlpha=0.11; ctx.filter='blur(22px) brightness(1.2) saturate(0.7)'; ctx.drawImage(buffer,0,0);
                ctx.globalAlpha=0.05; ctx.filter='blur(34px) brightness(1.08) saturate(0.62)'; ctx.drawImage(buffer,0,0);
                ctx.globalAlpha=0.2; ctx.globalCompositeOperation='lighter'; ctx.filter='blur(1px) brightness(1.4) saturate(0.8)'; ctx.drawImage(buffer,0,0);
                ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.12;
                ctx.filter='brightness(1.3) contrast(1.5) saturate(0.8)'; ctx.drawImage(buffer,0,0); ctx.restore();

                ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.09;
                ctx.filter='blur(0.4px)'; ctx.drawImage(grain,0,0,width,height); ctx.restore();
            } else { ctx.filter='none'; }

            const vignette=ctx.createRadialGradient(width/2,height/2,0,width/2,height/2,width*0.75);
            vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(0.6,'rgba(0,0,0,0.2)'); vignette.addColorStop(1,'rgba(0,0,0,0.72)');
            ctx.fillStyle=vignette; ctx.fillRect(0,0,width,height);
        };

        const animate=(now)=>{
            if(!introActive){ ctx.clearRect(0,0,width,height); requestAnimationFrame(animate); return; }
            const dt=Math.min(0.05,(now-lastTime)/1000);
            lastTime=now;
            const elapsed=(now-introStartTime)/1000;
            if(audio.initialized&&audio.ctx&&audio.ctx.state==='suspended') audio.ctx.resume().catch(()=>{});
            drawScene(elapsed,dt);
            requestAnimationFrame(animate);
        };

        syncViewportMetrics(); resize();
        if(typeof ResizeObserver!=='undefined'){ const obs=new ResizeObserver(resize); obs.observe(intro); }
        window.addEventListener('resize',resize,{passive:true});
        window.addEventListener('orientationchange',resize,{passive:true});
        if(window.visualViewport){
            window.visualViewport.addEventListener('resize',resize,{passive:true});
            window.visualViewport.addEventListener('scroll',syncViewportMetrics,{passive:true});
        }
        requestAnimationFrame(animate);
    })();
    </script>
</body>
</html>
