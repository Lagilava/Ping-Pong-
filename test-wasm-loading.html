<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Loading Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .status { margin: 10px 0; padding: 10px; background: #222; border: 1px solid #0f0; }
        .ok { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <h1>WASM Physics Loading Test</h1>
    <div id="log"></div>

    <script>
        const log = (msg, isError = false) => {
            const div = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'status ' + (isError ? 'error' : 'ok');
            entry.textContent = msg;
            div.appendChild(entry);
            console.log(msg);
        };

        log('Starting WASM test on: ' + window.location.href);
        log('Protocol: ' + window.location.protocol);

        // Test 1: Can we load physics.js?
        window.__wasmTest = {};
        const script1 = document.createElement('script');
        script1.src = 'physics/physics.js';
        script1.async = true;
        script1.onload = () => {
            log('✓ physics.js loaded', false);
            if (typeof window.PhysicsModule === 'function') {
                log('✓ PhysicsModule factory found', false);
                // Try to instantiate
                (async () => {
                    try {
                        const module = await window.PhysicsModule();
                        log('✓ PhysicsModule instantiated successfully', false);
                        log('  HEAPF32 length: ' + module.HEAPF32.length, false);
                    } catch (err) {
                        log('✗ PhysicsModule instantiation failed: ' + err.message, true);
                    }
                })();
            } else {
                log('✗ PhysicsModule factory NOT found', true);
            }
        };
        script1.onerror = () => {
            log('✗ Failed to load physics.js', true);
        };
        document.head.appendChild(script1);

        // Test 2: Check if physics.wasm exists
        setTimeout(async () => {
            try {
                const wasmRes = await fetch('physics/physics.wasm');
                if (wasmRes.ok) {
                    const size = await wasmRes.blob().then(b => b.size);
                    log('✓ physics.wasm found (' + (size / 1024).toFixed(1) + ' KB)', false);
                } else {
                    log('✗ physics.wasm returned ' + wasmRes.status, true);
                }
            } catch (err) {
                log('✗ Could not fetch physics.wasm: ' + err.message, true);
            }
        }, 100);

        // Test 3: Check WasmPhysics status after a delay
        setTimeout(() => {
            if (window.WasmPhysics) {
                log('WasmPhysics.ready: ' + window.WasmPhysics.ready, false);
                if (window.WasmPhysics.reason) {
                    log('WasmPhysics.reason: ' + window.WasmPhysics.reason, window.WasmPhysics.ready === false);
                }
            } else {
                log('WasmPhysics not found (physics-wasm.js may not have loaded)', true);
            }
        }, 500);
    </script>
    <script src="physics/physics-wasm.js" defer></script>
</body>
</html>
