<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ring of Fire — Midnight Altar | Cinematic Visual Composition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 10px 22px;
            border-radius: 40px;
            color: #ffcc88;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 20;
            font-family: monospace;
            border-left: 4px solid #ff5533;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            z-index: 20;
        }
        #badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffaa77;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
            font-weight: 500;
        }
        #instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 20px;
            color: #aaaacc;
            font-size: 10px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
        }
        @media (max-width: 700px) {
            #info { font-size: 9px; bottom: 12px; left: 12px; padding: 6px 14px; }
            #badge { font-size: 8px; top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div id="info">🔥 RING OF FIRE • SACRED MIDNIGHT ALTAR 🌊 | Cinematic Composition | Volumetric Fire | Reflective Waters</div>
    <div id="badge">✨ PBR | Dynamic Fire Light | Fresnel Water | Ember Physics</div>
    <div id="instruction">🎬 Cinematic Camera Drift — Focus: The Eternal Flame</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --------------------------------------------------------------
        // 1. SCENE — Deep Midnight Composition with Clear Focal Point
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        scene.fog = new THREE.FogExp2(0x030318, 0.007); // subtle atmospheric depth
        
        // Camera: centered on the ring of fire, balanced framing
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 5.8);
        camera.lookAt(0, 0.8, 0);
        
        // Physically based renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.28;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Post-processing: subtle bloom for fire glow
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.25, 0.45, 0.75);
        bloomPass.threshold = 0.12;
        bloomPass.strength = 0.88;
        bloomPass.radius = 0.68;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --------------------------------------------------------------
        // 2. ENVIRONMENT — Starry Night Sky with Distant Horizon
        // --------------------------------------------------------------
        // Create a beautiful starfield background with subtle gradient
        const starCount = 3500;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 150 + 20;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xfff5e0, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // Distant mountain silhouette (simple ring of low mountains for depth)
        const mountainRing = new THREE.Mesh(
            new THREE.RingGeometry(5.5, 8.5, 64),
            new THREE.MeshStandardMaterial({ color: 0x111a2a, roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide, emissive: 0x050810 })
        );
        mountainRing.rotation.x = -Math.PI / 2 + 0.15;
        mountainRing.position.y = -1.2;
        mountainRing.position.z = -2;
        scene.add(mountainRing);
        
        // --------------------------------------------------------------
        // 3. CENTRAL ALTAR — Stone Pedestal that grounds the Ring of Fire
        // --------------------------------------------------------------
        // Main altar base (weathered stone cylinder)
        const altarBaseGeo = new THREE.CylinderGeometry(1.95, 2.2, 0.55, 64);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3a2e2a, roughness: 0.72, metalness: 0.08, emissive: 0x1a120e, emissiveIntensity: 0.12 });
        const altarBase = new THREE.Mesh(altarBaseGeo, stoneMat);
        altarBase.position.y = -0.65;
        altarBase.castShadow = true;
        altarBase.receiveShadow = true;
        scene.add(altarBase);
        
        // Middle tier
        const altarMidGeo = new THREE.CylinderGeometry(1.65, 1.85, 0.38, 64);
        const altarMid = new THREE.Mesh(altarMidGeo, stoneMat);
        altarMid.position.y = -0.28;
        altarMid.castShadow = true;
        altarMid.receiveShadow = true;
        scene.add(altarMid);
        
        // Top platform (where fire ring rests)
        const altarTopGeo = new THREE.CylinderGeometry(1.48, 1.62, 0.28, 64);
        const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x2a221e, roughness: 0.65, metalness: 0.12, emissive: 0x2a1a12, emissiveIntensity: 0.08 });
        const altarTop = new THREE.Mesh(altarTopGeo, darkStoneMat);
        altarTop.position.y = 0.0;
        altarTop.castShadow = true;
        altarTop.receiveShadow = true;
        scene.add(altarTop);
        
        // Decorative rune ring (glowing)
        const runeRingGeo = new THREE.TorusGeometry(1.38, 0.045, 128, 200);
        const runeMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, emissive: 0xff4422, emissiveIntensity: 0.45, metalness: 0.7, roughness: 0.3 });
        const runeRing = new THREE.Mesh(runeRingGeo, runeMat);
        runeRing.position.y = 0.09;
        runeRing.rotation.x = Math.PI / 2;
        scene.add(runeRing);
        
        // --------------------------------------------------------------
        // 4. THE RING OF FIRE — Main Focal Point (Enhanced Volumetric)
        // --------------------------------------------------------------
        const fireUniforms = {
            uTime: { value: 0 },
            uIntensity: { value: 1.35 },
            uColorCore: { value: new THREE.Color(0xff4400) },
            uColorMid: { value: new THREE.Color(0xff7733) },
            uColorTip: { value: new THREE.Color(0xffaa66) }
        };
        
        const fireVertexShader = `
            varying vec3 vPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vPosition = mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fireFragmentShader = `
            uniform float uTime;
            uniform vec3 uColorCore;
            uniform vec3 uColorMid;
            uniform vec3 uColorTip;
            uniform float uIntensity;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }
            
            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float n = mix(
                    mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
                    f.z);
                return n * 2.0 - 1.0;
            }
            
            float fbm(vec3 p, int oct) {
                float val = 0.0;
                float amp = 0.5;
                float freq = 4.2;
                for(int i = 0; i < 4; i++) {
                    if(i >= oct) break;
                    val += amp * (noise3D(p * freq) * 0.5 + 0.5);
                    amp *= 0.5;
                    freq *= 2.0;
                }
                return val;
            }
            
            void main() {
                vec3 pos = vPosition;
                float majorR = 1.02;
                float minorR = 0.172;
                float rho = length(pos.xz);
                float torusDist = abs(rho - majorR) - minorR;
                float distToSurface = abs(torusDist);
                float core = 1.0 - smoothstep(0.0, 0.22, distToSurface);
                
                float angle = atan(pos.z, pos.x);
                float flow = fbm(vec3(angle * 3.5, pos.y * 4.0, uTime * 2.4), 3);
                float flicker = 0.7 + 0.45 * sin(uTime * 14.0) + 0.15 * sin(uTime * 31.0);
                float turbulence = sin(angle * 8.0 + uTime * 10.0) * 0.25;
                
                float density = core * (0.65 + flow * 0.55) * flicker + turbulence;
                float edgeGlow = 1.0 - smoothstep(0.02, 0.28, distToSurface);
                density *= (edgeGlow + 0.3);
                density = clamp(density * uIntensity, 0.0, 1.1);
                
                vec3 col = mix(uColorCore, uColorMid, density * 1.15);
                col = mix(col, uColorTip, pow(density, 1.5));
                float hotness = pow(core, 1.5) * (0.8 + flicker * 0.6);
                col += vec3(1.0, 0.55, 0.2) * hotness * 0.55;
                
                float alpha = density * (0.82 + flicker * 0.25);
                alpha = clamp(alpha, 0.0, 0.95);
                gl_FragColor = vec4(col, alpha);
            }
        `;
        
        const torusGeometry = new THREE.TorusGeometry(1.02, 0.172, 220, 380);
        const fireMaterial = new THREE.ShaderMaterial({
            uniforms: fireUniforms,
            vertexShader: fireVertexShader,
            fragmentShader: fireFragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const fireRing = new THREE.Mesh(torusGeometry, fireMaterial);
        fireRing.position.y = 0.21;
        scene.add(fireRing);
        
        // Inner molten core (glowing solid)
        const coreGlowMat = new THREE.MeshStandardMaterial({
            color: 0xff4411,
            emissive: 0xff3311,
            emissiveIntensity: 1.2,
            metalness: 0.25,
            roughness: 0.3,
            transparent: true
        });
        const innerCoreRing = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.09, 160, 300), coreGlowMat);
        innerCoreRing.position.y = 0.21;
        scene.add(innerCoreRing);
        
        // Floating embers above the ring (small glowing particles)
        const centralEmberCount = 800;
        const centralEmberGeo = new THREE.BufferGeometry();
        const centralEmberPos = new Float32Array(centralEmberCount * 3);
        for (let i = 0; i < centralEmberCount; i++) {
            const rad = 0.7 + Math.random() * 1.1;
            const ang = Math.random() * Math.PI * 2;
            centralEmberPos[i*3] = Math.cos(ang) * rad;
            centralEmberPos[i*3+2] = Math.sin(ang) * rad;
            centralEmberPos[i*3+1] = 0.35 + Math.random() * 1.1;
        }
        centralEmberGeo.setAttribute('position', new THREE.BufferAttribute(centralEmberPos, 3));
        const centralEmberMat = new THREE.PointsMaterial({ color: 0xff8855, size: 0.018, blending: THREE.AdditiveBlending, transparent: true });
        const centralEmbers = new THREE.Points(centralEmberGeo, centralEmberMat);
        scene.add(centralEmbers);
        
        // --------------------------------------------------------------
        // 5. WATER — Calm Reflective Pool Surrounding the Altar
        // --------------------------------------------------------------
        const waterUniforms = {
            uTime: { value: 0 },
            uCameraPosition: { value: camera.position.clone() },
            uReflectivity: { value: 0.68 }
        };
        
        const waterVertexShader = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float waveX = sin(pos.x * 2.2 + uTime * 1.2) * 0.025;
                float waveZ = cos(pos.z * 2.4 + uTime * 1.0) * 0.022;
                float ripple = sin((pos.x * 1.6 + pos.z * 1.6) * 1.2 + uTime * 1.8) * 0.018;
                pos.y += waveX + waveZ + ripple;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const waterFragmentShader = `
            uniform vec3 uCameraPosition;
            uniform float uTime;
            uniform float uReflectivity;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            
            void main() {
                vec3 viewDir = normalize(uCameraPosition - vWorldPosition);
                vec3 normal = vec3(0.0, 1.0, 0.0);
                normal.x += sin(vWorldPosition.x * 3.5 + uTime) * 0.08;
                normal.z += cos(vWorldPosition.z * 3.8 + uTime * 0.9) * 0.07;
                normal = normalize(normal);
                
                float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 3.2);
                
                vec3 deepWater = vec3(0.02, 0.06, 0.12);
                vec3 shallowWater = vec3(0.08, 0.18, 0.32);
                float depthFactor = clamp((vWorldPosition.y + 0.6) * 1.2, 0.0, 1.0);
                vec3 waterColor = mix(deepWater, shallowWater, depthFactor);
                
                // Fire reflection (orange tint)
                vec3 fireReflect = vec3(1.0, 0.45, 0.2) * fresnel * 0.85;
                vec3 finalColor = waterColor + fireReflect;
                
                // Soft ripples highlight
                float highlight = sin(vWorldPosition.x * 12.0 + uTime) * cos(vWorldPosition.z * 10.0 - uTime);
                highlight = max(0.0, highlight * 0.3);
                finalColor += vec3(0.7, 0.6, 0.5) * highlight;
                
                gl_FragColor = vec4(finalColor, 0.95);
            }
        `;
        
        const waterPlaneGeo = new THREE.PlaneGeometry(12, 12, 200, 200);
        const waterMaterialObj = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            vertexShader: waterVertexShader,
            fragmentShader: waterFragmentShader,
            transparent: true,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterPlaneGeo, waterMaterialObj);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.55;
        waterPlane.receiveShadow = true;
        scene.add(waterPlane);
        
        // --------------------------------------------------------------
        // 6. LIGHTING SYSTEM — Focused on the Ring of Fire
        // --------------------------------------------------------------
        // Ambient soft fill
        const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.48);
        scene.add(ambientLight);
        
        // Moonlight from above-back
        const moonLight = new THREE.DirectionalLight(0x7c9cff, 0.52);
        moonLight.position.set(2.2, 3.5, -2.8);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 12;
        scene.add(moonLight);
        
        // 🔥 MAIN FIRE LIGHT — The primary illumination source
        const fireLight = new THREE.PointLight(0xff5522, 4.8, 11, 1.6);
        fireLight.position.set(0, 0.55, 0);
        fireLight.castShadow = true;
        fireLight.shadow.mapSize.width = 1024;
        fireLight.shadow.mapSize.height = 1024;
        fireLight.shadow.bias = -0.0002;
        scene.add(fireLight);
        
        // Secondary flicker (warm fill)
        const flickerLight = new THREE.PointLight(0xff7744, 2.2, 9);
        flickerLight.position.set(0.2, 0.78, 0.25);
        scene.add(flickerLight);
        
        // Rim light to define altar edges
        const rimLight = new THREE.PointLight(0xff8844, 1.2);
        rimLight.position.set(-0.8, 0.95, -1.2);
        scene.add(rimLight);
        
        // Soft fill from below (water bounce)
        const bounceLight = new THREE.PointLight(0x3377aa, 0.45);
        bounceLight.position.set(0, -0.2, 0);
        scene.add(bounceLight);
        
        // --------------------------------------------------------------
        // 7. ATMOSPHERIC PARTICLES — Embers & Floating Ash (Cohesive)
        // --------------------------------------------------------------
        // Rising embers (spiral upward motion)
        const emberCount = 1800;
        const emberGeometry = new THREE.BufferGeometry();
        const emberPositions = new Float32Array(emberCount * 3);
        const emberData = [];
        for (let i = 0; i < emberCount; i++) {
            const radius = 0.6 + Math.random() * 1.4;
            const angle = Math.random() * Math.PI * 2;
            emberPositions[i*3] = Math.cos(angle) * radius;
            emberPositions[i*3+2] = Math.sin(angle) * radius;
            emberPositions[i*3+1] = 0.1 + Math.random() * 1.4;
            emberData.push({ speed: 0.35 + Math.random() * 0.8, radius, angle });
        }
        emberGeometry.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
        const emberPointMat = new THREE.PointsMaterial({ color: 0xff7744, size: 0.016, blending: THREE.AdditiveBlending, transparent: true });
        const emberSystem = new THREE.Points(emberGeometry, emberPointMat);
        scene.add(emberSystem);
        
        // Floating dust motes (subtle atmosphere)
        const dustCount = 1400;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPos[i*3] = (Math.random() - 0.5) * 8;
            dustPos[i*3+1] = Math.random() * 2.2;
            dustPos[i*3+2] = (Math.random() - 0.5) * 7 - 1;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0xaa9977, size: 0.008, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
        const dustSystem = new THREE.Points(dustGeo, dustMat);
        scene.add(dustSystem);
        
        // Volumetric heat haze sphere (subtle)
        const heatHazeMat = new THREE.MeshStandardMaterial({ color: 0xff4411, emissive: 0xff3311, emissiveIntensity: 0.28, transparent: true, opacity: 0.08 });
        const heatSphere = new THREE.Mesh(new THREE.SphereGeometry(1.95, 48, 48), heatHazeMat);
        heatSphere.position.y = 0.45;
        scene.add(heatSphere);
        
        // --------------------------------------------------------------
        // 8. ADDITIONAL DETAILS — Small rocks around altar base
        // --------------------------------------------------------------
        const rockMatSmall = new THREE.MeshStandardMaterial({ color: 0x4a3a32, roughness: 0.8, metalness: 0.05 });
        for (let i = 0; i < 48; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.055 + Math.random() * 0.045), rockMatSmall);
            const angle = Math.random() * Math.PI * 2;
            const rad = 2.1 + Math.random() * 0.6;
            rock.position.x = Math.cos(angle) * rad;
            rock.position.z = Math.sin(angle) * rad;
            rock.position.y = -0.48 + Math.random() * 0.12;
            rock.scale.set(1, Math.random() * 0.6 + 0.4, 1);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        }
        
        // --------------------------------------------------------------
        // 9. ANIMATION — Cohesive Visual Flow
        // --------------------------------------------------------------
        let time = 0;
        
        function animate() {
            time += 0.016;
            const elapsedTime = performance.now() / 1000;
            
            // Fire shader & light intensity
            fireUniforms.uTime.value = elapsedTime;
            fireUniforms.uIntensity.value = 1.3 + Math.sin(elapsedTime * 6.2) * 0.22;
            
            const intensityVar = 4.6 + Math.sin(elapsedTime * 11.5) * 1.5;
            fireLight.intensity = intensityVar;
            flickerLight.intensity = 2.0 + Math.sin(elapsedTime * 13.8) * 0.9;
            rimLight.intensity = 1.1 + Math.sin(elapsedTime * 8.5) * 0.4;
            bounceLight.intensity = 0.48 + Math.sin(elapsedTime * 2.2) * 0.12;
            
            // Inner core pulse
            innerCoreRing.material.emissiveIntensity = 1.1 + Math.sin(elapsedTime * 8.8) * 0.7;
            runeRing.material.emissiveIntensity = 0.45 + Math.sin(elapsedTime * 4.5) * 0.2;
            
            // Rising embers animation
            const emberPosAttr = emberSystem.geometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                let y = emberPosAttr[i*3+1];
                y += 0.009 * emberData[i].speed;
                if (y > 1.65) {
                    y = 0.05;
                    const newRadius = 0.55 + Math.random() * 1.45;
                    const newAngle = Math.random() * Math.PI * 2;
                    emberPosAttr[i*3] = Math.cos(newAngle) * newRadius;
                    emberPosAttr[i*3+2] = Math.sin(newAngle) * newRadius;
                    emberData[i].radius = newRadius;
                    emberData[i].angle = newAngle;
                }
                emberPosAttr[i*3+1] = y;
            }
            emberSystem.geometry.attributes.position.needsUpdate = true;
            
            // Rotate stars slowly
            stars.rotation.y = elapsedTime * 0.008;
            stars.rotation.x = Math.sin(elapsedTime * 0.01) * 0.02;
            
            // Central embers rotate gently
            centralEmbers.rotation.y = elapsedTime * 0.12;
            
            // Dust system gentle drift
            dustSystem.rotation.y = elapsedTime * 0.02;
            
            // Water uniforms update
            waterUniforms.uTime.value = elapsedTime;
            waterUniforms.uCameraPosition.value.copy(camera.position);
            
            // Gentle camera drift (cinematic focus on ring)
            camera.position.x = Math.sin(elapsedTime * 0.08) * 0.06;
            camera.position.y = 1.58 + Math.sin(elapsedTime * 0.12) * 0.02;
            camera.lookAt(0, 0.68, 0);
            
            // Moonlight subtle movement
            moonLight.position.x = 2.1 + Math.sin(elapsedTime * 0.06) * 0.2;
            
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('🔥 Ring of Fire | Cinematic Composition | Balanced Visual Hierarchy');
    </script>
</body>
</html>
