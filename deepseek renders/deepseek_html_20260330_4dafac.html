<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ring of Fire — Eternal Altar | Infinite Horizon | Cinematic Color Palette</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(5, 8, 20, 0.75);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 40px;
            color: #e0c8a0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 20;
            font-family: monospace;
            border-left: 4px solid #e36f2e;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 20;
        }
        #badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(5, 8, 20, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            color: #dbb87c;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        #instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 20px;
            color: #b8a88c;
            font-size: 10px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
        }
        @media (max-width: 700px) {
            #info { font-size: 9px; bottom: 12px; left: 12px; padding: 6px 14px; }
            #badge { font-size: 8px; top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div id="info">⟡ RING OF FIRE • ETERNAL ALTAR ⟡ | Infinite Horizon | Volumetric Embers | Cinematic Palette: Ember & Indigo</div>
    <div id="badge">✨ PBR | Dynamic Fire | Infinite Water Plane | 3D Particle Flow | ACES Tonemapping</div>
    <div id="instruction">🎬 Cinematic Orbit — The Eternal Flame</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --------------------------------------------------------------
        // 1. SCENE — Deep Indigo & Ember Color Palette
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        // Rich midnight gradient via fog and background
        scene.background = new THREE.Color(0x070b1a);
        scene.fog = new THREE.FogExp2(0x070b1a, 0.0035); // subtle depth for infinite feel
        
        // Camera: cinematic framing focused on altar
        const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, 1.75, 6.2);
        camera.lookAt(0, 0.85, 0);
        
        // Physically based renderer with ACES
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.32;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Post-processing: warm bloom for fire
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.48, 0.78);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.92;
        bloomPass.radius = 0.72;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --------------------------------------------------------------
        // 2. INFINITE WATER PLANE — Seamless, extended to horizon
        // --------------------------------------------------------------
        // Large-scale water plane with radial gradient and endless feel
        const waterUniforms = {
            uTime: { value: 0 },
            uCameraPosition: { value: camera.position.clone() },
            uReflectivity: { value: 0.72 },
            uColorDeep: { value: new THREE.Color(0x0a1428) },
            uColorMid: { value: new THREE.Color(0x1a2a3e) },
            uColorHorizon: { value: new THREE.Color(0x2a3850) }
        };
        
        const waterVertexShader = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv;
                vec3 pos = position;
                // Gentle infinite ripples
                float wave1 = sin(pos.x * 1.4 + uTime * 1.1) * 0.022;
                float wave2 = cos(pos.z * 1.6 + uTime * 0.9) * 0.018;
                float wave3 = sin((pos.x * 0.9 + pos.z * 0.9) * 1.3 + uTime * 1.4) * 0.015;
                pos.y += wave1 + wave2 + wave3;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const waterFragmentShader = `
            uniform vec3 uCameraPosition;
            uniform float uTime;
            uniform float uReflectivity;
            uniform vec3 uColorDeep;
            uniform vec3 uColorMid;
            uniform vec3 uColorHorizon;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            
            void main() {
                vec3 viewDir = normalize(uCameraPosition - vWorldPosition);
                vec3 normal = vec3(0.0, 1.0, 0.0);
                normal.x += sin(vWorldPosition.x * 2.8 + uTime) * 0.09;
                normal.z += cos(vWorldPosition.z * 3.0 + uTime * 1.1) * 0.08;
                normal = normalize(normal);
                
                float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 3.4);
                
                // Distance-based horizon blending for infinite feel
                float distFromCenter = length(vWorldPosition.xz);
                float horizonBlend = smoothstep(2.0, 18.0, distFromCenter);
                vec3 waterBase = mix(uColorDeep, uColorMid, min(1.0, distFromCenter * 0.12));
                waterBase = mix(waterBase, uColorHorizon, horizonBlend * 0.7);
                
                // Fire reflection (warm ember glow)
                vec3 fireReflect = vec3(1.0, 0.48, 0.22) * fresnel * 0.88;
                vec3 finalColor = waterBase + fireReflect;
                
                // Soft ripples highlight
                float rippleHighlight = sin(vWorldPosition.x * 14.0 + uTime) * cos(vWorldPosition.z * 12.0 - uTime * 1.3);
                rippleHighlight = max(0.0, rippleHighlight * 0.25);
                finalColor += vec3(0.9, 0.7, 0.5) * rippleHighlight;
                
                // Slight foam near altar
                float altarDist = length(vWorldPosition.xz);
                float foamNear = smoothstep(1.2, 2.4, altarDist) * (1.0 - smoothstep(2.4, 3.8, altarDist));
                finalColor += vec3(0.85, 0.75, 0.65) * foamNear * 0.3;
                
                gl_FragColor = vec4(finalColor, 0.96);
            }
        `;
        
        // Massive water plane — extends far to create infinite horizon
        const waterPlaneGeo = new THREE.PlaneGeometry(58, 58, 320, 320);
        const waterMaterialObj = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            vertexShader: waterVertexShader,
            fragmentShader: waterFragmentShader,
            transparent: true,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterPlaneGeo, waterMaterialObj);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.62;
        waterPlane.receiveShadow = false;
        scene.add(waterPlane);
        
        // Additional distant water ring for horizon blending
        const horizonRingGeo = new THREE.RingGeometry(22, 45, 64);
        const horizonMat = new THREE.MeshStandardMaterial({ color: 0x1a2a44, roughness: 0.6, metalness: 0.3, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
        const horizonRing = new THREE.Mesh(horizonRingGeo, horizonMat);
        horizonRing.rotation.x = -Math.PI / 2;
        horizonRing.position.y = -0.68;
        scene.add(horizonRing);
        
        // --------------------------------------------------------------
        // 3. CENTRAL ALTAR — Weathered Obsidian & Ember Accents
        // --------------------------------------------------------------
        // Base tier (dark volcanic stone)
        const stoneMatDark = new THREE.MeshStandardMaterial({ color: 0x2a2420, roughness: 0.68, metalness: 0.1, emissive: 0x0a0806, emissiveIntensity: 0.08 });
        const baseGeo = new THREE.CylinderGeometry(2.05, 2.32, 0.58, 72);
        const altarBase = new THREE.Mesh(baseGeo, stoneMatDark);
        altarBase.position.y = -0.58;
        altarBase.castShadow = true;
        altarBase.receiveShadow = true;
        scene.add(altarBase);
        
        // Middle tier
        const midGeo = new THREE.CylinderGeometry(1.75, 1.95, 0.42, 72);
        const altarMid = new THREE.Mesh(midGeo, stoneMatDark);
        altarMid.position.y = -0.22;
        altarMid.castShadow = true;
        altarMid.receiveShadow = true;
        scene.add(altarMid);
        
        // Top altar platform (warm stone with subtle glow)
        const topMat = new THREE.MeshStandardMaterial({ color: 0x4a3428, roughness: 0.52, metalness: 0.15, emissive: 0x2a1a10, emissiveIntensity: 0.12 });
        const topGeo = new THREE.CylinderGeometry(1.52, 1.68, 0.32, 72);
        const altarTop = new THREE.Mesh(topGeo, topMat);
        altarTop.position.y = 0.06;
        altarTop.castShadow = true;
        altarTop.receiveShadow = true;
        scene.add(altarTop);
        
        // Decorative bronze ring with ember glow
        const bronzeMat = new THREE.MeshStandardMaterial({ color: 0xc87e4a, metalness: 0.72, roughness: 0.28, emissive: 0xb55a2a, emissiveIntensity: 0.35 });
        const decorRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.055, 128, 220), bronzeMat);
        decorRing.position.y = 0.16;
        decorRing.rotation.x = Math.PI / 2;
        scene.add(decorRing);
        
        // --------------------------------------------------------------
        // 4. THE RING OF FIRE — Central Focal Point (Volumetric, Organic)
        // --------------------------------------------------------------
        const fireUniforms = {
            uTime: { value: 0 },
            uIntensity: { value: 1.4 },
            uColorCore: { value: new THREE.Color(0xe35f2a) },
            uColorMid: { value: new THREE.Color(0xe87a3c) },
            uColorTip: { value: new THREE.Color(0xfcac6a) }
        };
        
        const fireVertexShader = `
            varying vec3 vPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vPosition = mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fireFragmentShader = `
            uniform float uTime;
            uniform vec3 uColorCore;
            uniform vec3 uColorMid;
            uniform vec3 uColorTip;
            uniform float uIntensity;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }
            
            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float n = mix(
                    mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
                    f.z);
                return n * 2.0 - 1.0;
            }
            
            float fbm(vec3 p, int oct) {
                float val = 0.0;
                float amp = 0.5;
                float freq = 4.0;
                for(int i = 0; i < 4; i++) {
                    val += amp * (noise3D(p * freq) * 0.5 + 0.5);
                    amp *= 0.5;
                    freq *= 2.0;
                }
                return val;
            }
            
            void main() {
                vec3 pos = vPosition;
                float majorR = 1.02;
                float minorR = 0.178;
                float rho = length(pos.xz);
                float torusDist = abs(rho - majorR) - minorR;
                float distToSurface = abs(torusDist);
                float core = 1.0 - smoothstep(0.0, 0.23, distToSurface);
                
                float angle = atan(pos.z, pos.x);
                float flow = fbm(vec3(angle * 3.2, pos.y * 4.5, uTime * 2.3), 3);
                float flicker = 0.68 + 0.48 * sin(uTime * 13.0) + 0.18 * sin(uTime * 29.0);
                float turbulence = sin(angle * 9.0 + uTime * 11.0) * 0.22;
                
                float density = core * (0.68 + flow * 0.55) * flicker + turbulence;
                float edgeGlow = 1.0 - smoothstep(0.02, 0.29, distToSurface);
                density *= (edgeGlow + 0.28);
                density = clamp(density * uIntensity, 0.0, 1.12);
                
                vec3 col = mix(uColorCore, uColorMid, density * 1.2);
                col = mix(col, uColorTip, pow(density, 1.45));
                float hotness = pow(core, 1.5) * (0.85 + flicker * 0.55);
                col += vec3(1.0, 0.58, 0.28) * hotness * 0.52;
                
                float alpha = density * (0.85 + flicker * 0.22);
                alpha = clamp(alpha, 0.0, 0.96);
                gl_FragColor = vec4(col, alpha);
            }
        `;
        
        const torusGeometry = new THREE.TorusGeometry(1.02, 0.178, 240, 420);
        const fireMaterial = new THREE.ShaderMaterial({
            uniforms: fireUniforms,
            vertexShader: fireVertexShader,
            fragmentShader: fireFragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const fireRing = new THREE.Mesh(torusGeometry, fireMaterial);
        fireRing.position.y = 0.25;
        scene.add(fireRing);
        
        // Inner molten core (pulsing)
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xe56a2e,
            emissive: 0xd94a1a,
            emissiveIntensity: 1.15,
            metalness: 0.22,
            roughness: 0.28,
            transparent: true
        });
        const innerRing = new THREE.Mesh(new THREE.TorusGeometry(0.93, 0.095, 180, 340), coreMat);
        innerRing.position.y = 0.25;
        scene.add(innerRing);
        
        // --------------------------------------------------------------
        // 5. 3D PARTICLE SYSTEMS — Embers, Sparks, Floating Ash (Full 3D, No Square Cutout)
        // --------------------------------------------------------------
        // Rising embers with full 3D spiral motion
        const emberCount = 2800;
        const emberGeo = new THREE.BufferGeometry();
        const emberPositions = new Float32Array(emberCount * 3);
        const emberVelocities = [];
        for (let i = 0; i < emberCount; i++) {
            const radius = 0.65 + Math.random() * 1.55;
            const angle = Math.random() * Math.PI * 2;
            const yOffset = 0.05 + Math.random() * 1.45;
            emberPositions[i*3] = Math.cos(angle) * radius;
            emberPositions[i*3+2] = Math.sin(angle) * radius;
            emberPositions[i*3+1] = yOffset;
            emberVelocities.push({
                speed: 0.28 + Math.random() * 0.9,
                radius: radius,
                angle: angle,
                driftSpeed: 0.02 + Math.random() * 0.05
            });
        }
        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
        const emberMat = new THREE.PointsMaterial({ color: 0xfc8e4a, size: 0.022, blending: THREE.AdditiveBlending, transparent: true });
        const emberSystem = new THREE.Points(emberGeo, emberMat);
        scene.add(emberSystem);
        
        // Floating sparkles (tiny, fast, full 3D orbit)
        const sparkCount = 4200;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPositions = new Float32Array(sparkCount * 3);
        for (let i = 0; i < sparkCount; i++) {
            const radius = 0.7 + Math.random() * 1.85;
            const angle = Math.random() * Math.PI * 2;
            sparkPositions[i*3] = Math.cos(angle) * radius;
            sparkPositions[i*3+2] = Math.sin(angle) * radius;
            sparkPositions[i*3+1] = 0.18 + Math.random() * 1.65;
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
        const sparkMat = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.009, blending: THREE.AdditiveBlending, transparent: true });
        const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparkSystem);
        
        // Volumetric smoke/ash particles (subtle, drifting outward)
        const smokeCount = 2200;
        const smokeGeo = new THREE.BufferGeometry();
        const smokePositions = new Float32Array(smokeCount * 3);
        const smokeVel = [];
        for (let i = 0; i < smokeCount; i++) {
            const radius = 0.9 + Math.random() * 2.2;
            const angle = Math.random() * Math.PI * 2;
            smokePositions[i*3] = Math.cos(angle) * radius;
            smokePositions[i*3+2] = Math.sin(angle) * radius;
            smokePositions[i*3+1] = 0.3 + Math.random() * 1.4;
            smokeVel.push({
                riseSpeed: 0.12 + Math.random() * 0.45,
                outwardSpeed: 0.03 + Math.random() * 0.07,
                angle: angle,
                radius: radius
            });
        }
        smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
        const smokeMat = new THREE.PointsMaterial({ color: 0xb88a66, size: 0.024, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending });
        const smokeSystem = new THREE.Points(smokeGeo, smokeMat);
        scene.add(smokeSystem);
        
        // Orbiting fiery wisps (full 3D rotation)
        const wispCount = 1600;
        const wispGeo = new THREE.BufferGeometry();
        const wispPositions = new Float32Array(wispCount * 3);
        for (let i = 0; i < wispCount; i++) {
            const radius = 1.15 + Math.random() * 0.85;
            const angle = Math.random() * Math.PI * 2;
            wispPositions[i*3] = Math.cos(angle) * radius;
            wispPositions[i*3+2] = Math.sin(angle) * radius;
            wispPositions[i*3+1] = 0.45 + Math.random() * 1.1;
        }
        wispGeo.setAttribute('position', new THREE.BufferAttribute(wispPositions, 3));
        const wispMat = new THREE.PointsMaterial({ color: 0xff8844, size: 0.014, blending: THREE.AdditiveBlending });
        const wispSystem = new THREE.Points(wispGeo, wispMat);
        scene.add(wispSystem);
        
        // --------------------------------------------------------------
        // 6. LIGHTING — Warm Ember & Cool Moonlight Harmony
        // --------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0x151e2c, 0.52);
        scene.add(ambientLight);
        
        // Cool moonlight from above
        const moonLight = new THREE.DirectionalLight(0x8aaee6, 0.58);
        moonLight.position.set(2.5, 4.2, -2.2);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        scene.add(moonLight);
        
        // 🔥 MAIN FIRE LIGHT — Dynamic, warm, shadows
        const fireLight = new THREE.PointLight(0xe57a3a, 5.2, 12.5, 1.7);
        fireLight.position.set(0, 0.68, 0);
        fireLight.castShadow = true;
        fireLight.shadow.mapSize.width = 1024;
        fireLight.shadow.mapSize.height = 1024;
        fireLight.shadow.bias = -0.00015;
        scene.add(fireLight);
        
        // Secondary flicker light
        const flickerLight = new THREE.PointLight(0xfc8a4a, 2.5, 10);
        flickerLight.position.set(0.22, 0.92, 0.28);
        scene.add(flickerLight);
        
        // Rim light from fire (back)
        const rimFireLight = new THREE.PointLight(0xe56a2a, 1.4);
        rimFireLight.position.set(-0.5, 0.85, -1.1);
        scene.add(rimFireLight);
        
        // Water bounce fill
        const waterBounce = new THREE.PointLight(0x3a6c9e, 0.52);
        waterBounce.position.set(0, -0.3, 0);
        scene.add(waterBounce);
        
        // --------------------------------------------------------------
        // 7. ATMOSPHERIC VOLUMETRIC GLOW (Heat Haze)
        // --------------------------------------------------------------
        const heatHazeMat = new THREE.MeshStandardMaterial({ color: 0xe56a2a, emissive: 0xe55a2a, emissiveIntensity: 0.32, transparent: true, opacity: 0.09 });
        const heatSphere = new THREE.Mesh(new THREE.SphereGeometry(2.05, 56, 56), heatHazeMat);
        heatSphere.position.y = 0.58;
        scene.add(heatSphere);
        
        // Distant mountain silhouettes (for horizon depth)
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x121a2a, roughness: 0.85, metalness: 0.05 });
        for (let i = 0; i < 14; i++) {
            const angle = (i / 14) * Math.PI * 2;
            const dist = 9.5 + Math.random() * 2.5;
            const mountain = new THREE.Mesh(new THREE.ConeGeometry(0.65 + Math.random() * 0.5, 1.2 + Math.random() * 0.8, 12), mountainMat);
            mountain.position.x = Math.cos(angle) * dist;
            mountain.position.z = Math.sin(angle) * dist;
            mountain.position.y = -0.85;
            mountain.castShadow = false;
            scene.add(mountain);
        }
        
        // --------------------------------------------------------------
        // 8. ANIMATION — Organic Motion, Infinite Horizon Feel
        // --------------------------------------------------------------
        let time = 0;
        
        function animate() {
            const elapsedTime = performance.now() / 1000;
            
            // Fire shader
            fireUniforms.uTime.value = elapsedTime;
            fireUniforms.uIntensity.value = 1.35 + Math.sin(elapsedTime * 6.5) * 0.24;
            
            // Dynamic fire light
            const intensityVar = 5.0 + Math.sin(elapsedTime * 12.0) * 1.7;
            fireLight.intensity = intensityVar;
            flickerLight.intensity = 2.3 + Math.sin(elapsedTime * 14.2) * 1.0;
            rimFireLight.intensity = 1.3 + Math.sin(elapsedTime * 8.5) * 0.5;
            waterBounce.intensity = 0.55 + Math.sin(elapsedTime * 1.8) * 0.12;
            
            // Inner core pulse
            innerRing.material.emissiveIntensity = 1.05 + Math.sin(elapsedTime * 9.0) * 0.75;
            decorRing.material.emissiveIntensity = 0.38 + Math.sin(elapsedTime * 4.2) * 0.18;
            
            // --- 3D Particle Animation (Full 3D space, no cutout) ---
            // Embers rising and resetting with new radial position
            const emberPosAttr = emberSystem.geometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                let y = emberPosAttr[i*3+1];
                y += 0.0085 * emberVelocities[i].speed;
                if (y > 1.72) {
                    y = 0.08;
                    const newRadius = 0.65 + Math.random() * 1.55;
                    const newAngle = Math.random() * Math.PI * 2;
                    emberPosAttr[i*3] = Math.cos(newAngle) * newRadius;
                    emberPosAttr[i*3+2] = Math.sin(newAngle) * newRadius;
                    emberVelocities[i].radius = newRadius;
                    emberVelocities[i].angle = newAngle;
                }
                emberPosAttr[i*3+1] = y;
            }
            emberSystem.geometry.attributes.position.needsUpdate = true;
            
            // Smoke particles: rise and drift outward (infinite horizon feel)
            const smokePosAttr = smokeSystem.geometry.attributes.position.array;
            for (let i = 0; i < smokeCount; i++) {
                let y = smokePosAttr[i*3+1];
                let rad = Math.sqrt(smokePosAttr[i*3]*smokePosAttr[i*3] + smokePosAttr[i*3+2]*smokePosAttr[i*3+2]);
                y += 0.006 * smokeVel[i].riseSpeed;
                rad += 0.012 * smokeVel[i].outwardSpeed;
                if (y > 1.85 || rad > 3.2) {
                    y = 0.2;
                    rad = 0.8 + Math.random() * 1.1;
                    const newAngle = Math.random() * Math.PI * 2;
                    smokePosAttr[i*3] = Math.cos(newAngle) * rad;
                    smokePosAttr[i*3+2] = Math.sin(newAngle) * rad;
                    smokeVel[i].angle = newAngle;
                    smokeVel[i].radius = rad;
                } else {
                    const angle = Math.atan2(smokePosAttr[i*3+2], smokePosAttr[i*3]);
                    smokePosAttr[i*3] = Math.cos(angle) * rad;
                    smokePosAttr[i*3+2] = Math.sin(angle) * rad;
                }
                smokePosAttr[i*3+1] = y;
            }
            smokeSystem.geometry.attributes.position.needsUpdate = true;
            
            // Rotating spark and wisp systems
            sparkSystem.rotation.y = elapsedTime * 0.07;
            wispSystem.rotation.y = elapsedTime * 0.11;
            
            // Water uniforms update
            waterUniforms.uTime.value = elapsedTime;
            waterUniforms.uCameraPosition.value.copy(camera.position);
            
            // Gentle camera drift (maintains focus on altar)
            camera.position.x = Math.sin(elapsedTime * 0.07) * 0.045;
            camera.position.y = 1.72 + Math.sin(elapsedTime * 0.11) * 0.018;
            camera.lookAt(0, 0.82, 0);
            
            // Moonlight subtle movement
            moonLight.position.x = 2.4 + Math.sin(elapsedTime * 0.05) * 0.18;
            
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('⟡ Ring of Fire | Eternal Altar | Infinite Water Plane | Full 3D Particle Flow | Ember & Indigo Palette');
    </script>
</body>
