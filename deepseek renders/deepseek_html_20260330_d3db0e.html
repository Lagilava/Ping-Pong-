<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ring of Fire — Cinematic Altar</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        #loading {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            color: #c9a87b;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        
        // --------------------------------------------------------------
        // OPTIMIZED PARAMETERS — Centralized for easy tweaking
        // --------------------------------------------------------------
        const PARAMS = {
            // Performance
            quality: {
                waterSegments: 180,      // 180x180 = 32k vertices (was 480x480)
                fireRingSegments: 180,    // optimized
                particleCounts: {
                    embers: 1400,         // was 4500
                    sparks: 2200,         // was 6800
                    ash: 900,             // was 3800
                    orbs: 500             // was 1200
                }
            },
            // Visual
            fire: {
                intensityBase: 1.05,
                intensitySpeed: 5.5,
                coreColor: new THREE.Color(0xc54a1a),
                midColor: new THREE.Color(0xda6232),
                tipColor: new THREE.Color(0xec824a)
            },
            lighting: {
                fireLightIntensity: 2.4,   // reduced from 3.6
                ambientIntensity: 0.48,
                sunsetIntensity: 0.78,
                bloomStrength: 0.55
            },
            camera: {
                height: 1.72,
                distance: 6.8,
                lookAtY: 0.92
            }
        };
        
        // --------------------------------------------------------------
        // SCENE SETUP
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e0a1a);
        scene.fog = new THREE.FogExp2(0x1a1222, 0.0025);
        
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, PARAMS.camera.height, PARAMS.camera.distance);
        camera.lookAt(0, PARAMS.camera.lookAtY, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.02;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // --------------------------------------------------------------
        // CINEMATIC COLOR GRADE — Refined warmth
        // --------------------------------------------------------------
        const colorGradeShader = {
            uniforms: {
                tDiffuse: { value: null },
                uTime: { value: 0 },
                uContrast: { value: 1.08 },
                uSaturation: { value: 0.85 },
                uWarmth: { value: 0.28 },
                uVignette: { value: 0.52 }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                uniform float uContrast;
                uniform float uSaturation;
                uniform float uWarmth;
                uniform float uVignette;
                varying vec2 vUv;
                void main() {
                    vec4 color = texture2D(tDiffuse, vUv);
                    vec3 c = color.rgb;
                    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
                    vec3 desat = vec3(lum);
                    c = mix(desat, c, uSaturation);
                    c = (c - 0.5) * uContrast + 0.5;
                    vec3 warmTint = vec3(0.38, 0.24, 0.1);
                    c += warmTint * uWarmth * (1.0 - smoothstep(0.2, 0.7, lum));
                    c = max(c, vec3(0.02));
                    float dist = length(vUv - 0.5);
                    float vignette = 1.0 - dist * uVignette;
                    vignette = clamp(vignette, 0.65, 1.0);
                    c *= vignette;
                    float grain = fract(sin(dot(vUv, vec2(12.9898, 78.233))) * 43758.5453 + uTime) * 0.015;
                    c += grain * 0.08;
                    gl_FragColor = vec4(c, color.a);
                }
            `
        };
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), PARAMS.lighting.bloomStrength, 0.35, 0.62);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 0.58;
        
        const colorGradePass = new ShaderPass(colorGradeShader);
        colorGradePass.renderToScreen = true;
        
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        effectComposer.addPass(colorGradePass);
        
        // --------------------------------------------------------------
        // SKY & ATMOSPHERE — Sunset gradient, no performance heavy domes
        // --------------------------------------------------------------
        // Gradient sky using a large sphere with gradient texture (lightweight)
        const canvasGradient = document.createElement('canvas');
        canvasGradient.width = 512;
        canvasGradient.height = 512;
        const ctx = canvasGradient.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, canvasGradient.height);
        grad.addColorStop(0, '#2a1a3a');
        grad.addColorStop(0.4, '#4a2a3a');
        grad.addColorStop(0.7, '#8a4a3a');
        grad.addColorStop(1, '#c46a3a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvasGradient.width, canvasGradient.height);
        const skyTexture = new THREE.CanvasTexture(canvasGradient);
        const skyMat = new THREE.MeshStandardMaterial({ map: skyTexture, side: THREE.BackSide, emissive: 0x441a2a, emissiveIntensity: 0.18 });
        const skyDome = new THREE.Mesh(new THREE.SphereGeometry(48, 32, 32), skyMat);
        scene.add(skyDome);
        
        // Sun disc (optimized geometry)
        const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa77, emissive: 0xff6644, emissiveIntensity: 0.95 });
        const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(0.65, 24, 24), sunMat);
        sunDisc.position.set(13, 5.2, -19);
        scene.add(sunDisc);
        
        // Sun glow sprite (soft additive)
        const sunGlowMat = new THREE.SpriteMaterial({ map: (() => {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ct = c.getContext('2d');
            ct.fillStyle = '#ff8844';
            ct.beginPath();
            ct.arc(32, 32, 28, 0, Math.PI * 2);
            ct.fill();
            ct.globalCompositeOperation = 'source-over';
            ct.fillStyle = '#ffaa66';
            ct.beginPath();
            ct.arc(32, 32, 18, 0, Math.PI * 2);
            ct.fill();
            return new THREE.CanvasTexture(c);
        })(), blending: THREE.AdditiveBlending, transparent: true, opacity: 0.45 });
        const sunSprite = new THREE.Sprite(sunGlowMat);
        sunSprite.position.set(13, 5.2, -19);
        sunSprite.scale.set(2.2, 2.2, 1);
        scene.add(sunSprite);
        
        // Mountain silhouettes (optimized count)
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x121824, roughness: 0.88, metalness: 0.02 });
        for (let i = 0; i < 18; i++) {
            const angle = (i / 18) * Math.PI * 2;
            const dist = 15 + Math.random() * 3.5;
            const mountain = new THREE.Mesh(new THREE.ConeGeometry(0.7 + Math.random() * 0.6, 1.2 + Math.random() * 1.0, 8), mountainMat);
            mountain.position.x = Math.cos(angle) * dist;
            mountain.position.z = Math.sin(angle) * dist;
            mountain.position.y = -0.88;
            mountain.castShadow = false;
            scene.add(mountain);
        }
        
        // --------------------------------------------------------------
        // OPTIMIZED WATER — Lower resolution, improved reflection
        // --------------------------------------------------------------
        const waterUniforms = {
            uTime: { value: 0 },
            uCameraPosition: { value: camera.position.clone() }
        };
        
        const waterVS = `
            varying vec3 vWorldPosition;
            uniform float uTime;
            void main() {
                vec3 pos = position;
                float wave1 = sin(pos.x * 0.85 + uTime * 0.65) * 0.012;
                float wave2 = cos(pos.z * 1.05 + uTime * 0.55) * 0.01;
                pos.y += wave1 + wave2;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const waterFS = `
            uniform vec3 uCameraPosition;
            uniform float uTime;
            varying vec3 vWorldPosition;
            void main() {
                vec3 viewDir = normalize(uCameraPosition - vWorldPosition);
                vec3 normal = vec3(0.0, 1.0, 0.0);
                normal.x += sin(vWorldPosition.x * 1.6 + uTime) * 0.055;
                normal.z += cos(vWorldPosition.z * 1.8 + uTime * 0.55) * 0.05;
                normal = normalize(normal);
                float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 2.9);
                vec3 deepColor = vec3(0.06, 0.04, 0.12);
                vec3 midColor = vec3(0.15, 0.1, 0.2);
                float depth = clamp(length(vWorldPosition.xz) * 0.022, 0.0, 0.65);
                vec3 waterColor = mix(deepColor, midColor, depth);
                vec3 fireReflect = vec3(0.92, 0.42, 0.22) * fresnel * 0.48;
                vec3 sunsetReflect = vec3(0.88, 0.52, 0.28) * fresnel * 0.42;
                vec3 finalColor = waterColor + fireReflect + sunsetReflect;
                float ripple = sin(vWorldPosition.x * 6.5 + uTime) * cos(vWorldPosition.z * 6.0 - uTime);
                finalColor += vec3(0.7, 0.45, 0.28) * max(0.0, ripple * 0.09);
                gl_FragColor = vec4(finalColor, 0.96);
            }
        `;
        
        const waterPlaneGeo = new THREE.PlaneGeometry(88, 88, PARAMS.quality.waterSegments, PARAMS.quality.waterSegments);
        const waterMaterial = new THREE.ShaderMaterial({ uniforms: waterUniforms, vertexShader: waterVS, fragmentShader: waterFS, transparent: true, side: THREE.DoubleSide });
        const waterPlane = new THREE.Mesh(waterPlaneGeo, waterMaterial);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.72;
        scene.add(waterPlane);
        
        // Soft horizon ring (lightweight)
        const horizonRing = new THREE.Mesh(new THREE.RingGeometry(26, 52, 48), new THREE.MeshStandardMaterial({ color: 0x2a1a2a, roughness: 0.95, transparent: true, opacity: 0.18, side: THREE.DoubleSide }));
        horizonRing.rotation.x = -Math.PI / 2;
        horizonRing.position.y = -0.78;
        scene.add(horizonRing);
        
        // --------------------------------------------------------------
        // DETAILED ALTAR — Optimized geometry counts
        // --------------------------------------------------------------
        const darkStone = new THREE.MeshStandardMaterial({ color: 0x2a221c, roughness: 0.6, metalness: 0.05, emissive: 0x080402, emissiveIntensity: 0.02 });
        const darkStoneRough = new THREE.MeshStandardMaterial({ color: 0x362a22, roughness: 0.72, metalness: 0.03 });
        const agedMetal = new THREE.MeshStandardMaterial({ color: 0x7a553a, roughness: 0.44, metalness: 0.55, emissive: 0x2a1a0a, emissiveIntensity: 0.05 });
        
        const baseMain = new THREE.Mesh(new THREE.CylinderGeometry(2.25, 2.55, 0.6, 56), darkStone);
        baseMain.position.y = -0.66;
        baseMain.castShadow = true;
        baseMain.receiveShadow = true;
        scene.add(baseMain);
        
        const middleTier = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 2.15, 0.46, 56), darkStone);
        middleTier.position.y = -0.3;
        middleTier.castShadow = true;
        scene.add(middleTier);
        
        const upperTier = new THREE.Mesh(new THREE.CylinderGeometry(1.68, 1.84, 0.34, 56), darkStoneRough);
        upperTier.position.y = -0.02;
        upperTier.castShadow = true;
        scene.add(upperTier);
        
        const altarCrown = new THREE.Mesh(new THREE.CylinderGeometry(1.54, 1.6, 0.17, 56), new THREE.MeshStandardMaterial({ color: 0x34281e, roughness: 0.46, metalness: 0.08 }));
        altarCrown.position.y = 0.19;
        altarCrown.castShadow = true;
        scene.add(altarCrown);
        
        const bronzeRing = new THREE.Mesh(new THREE.TorusGeometry(1.49, 0.052, 96, 240), agedMetal);
        bronzeRing.position.y = 0.27;
        bronzeRing.rotation.x = Math.PI / 2;
        scene.add(bronzeRing);
        
        const innerDeco = new THREE.Mesh(new THREE.TorusGeometry(1.33, 0.04, 80, 200), new THREE.MeshStandardMaterial({ color: 0xaa6a42, metalness: 0.62, roughness: 0.36 }));
        innerDeco.position.y = 0.25;
        innerDeco.rotation.x = Math.PI / 2;
        scene.add(innerDeco);
        
        // Pillars (8 only)
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x42362a, roughness: 0.68 });
        const pillarOffsets = [[-1.68, -0.54, -1.68], [1.68, -0.54, -1.68], [1.68, -0.54, 1.68], [-1.68, -0.54, 1.68], [-1.54, -0.54, 1.54], [1.54, -0.54, 1.54], [1.54, -0.54, -1.54], [-1.54, -0.54, -1.54]];
        pillarOffsets.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.58, 0.32), pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });
        
        // Scattered stones (reduced count)
        const debrisMat = new THREE.MeshStandardMaterial({ color: 0x524232, roughness: 0.8 });
        for (let i = 0; i < 55; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.038 + Math.random() * 0.058), debrisMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 2.18 + Math.random() * 1.2;
            rock.position.x = Math.cos(angle) * rad;
            rock.position.z = Math.sin(angle) * rad;
            rock.position.y = -0.57 + Math.random() * 0.14;
            rock.scale.set(1, Math.random() * 0.5 + 0.4, 1);
            rock.castShadow = true;
            scene.add(rock);
        }
        
        // --------------------------------------------------------------
        // RING OF FIRE — Optimized with vertical distortion effect
        // --------------------------------------------------------------
        const fireUniforms = {
            uTime: { value: 0 },
            uIntensity: { value: PARAMS.fire.intensityBase }
        };
        
        const fireRingGeo = new THREE.TorusGeometry(1.02, 0.168, PARAMS.quality.fireRingSegments, 320);
        const fireMat = new THREE.ShaderMaterial({
            uniforms: fireUniforms,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                uniform float uTime;
                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float stretch = 1.0 + sin(pos.x * 8.0 + uTime * 12.0) * 0.08;
                    pos.y *= stretch;
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    vPosition = mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uIntensity;
                varying vec3 vPosition;
                varying vec2 vUv;
                float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
                float noise(vec3 p) {
                    vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
                    float n = mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                                 mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
                    return n*2.0-1.0;
                }
                void main() {
                    vec3 pos = vPosition;
                    float majorR = 1.02;
                    float minorR = 0.168;
                    float rho = length(pos.xz);
                    float dist = abs(abs(rho - majorR) - minorR);
                    float core = 1.0 - smoothstep(0.0, 0.27, dist);
                    float angle = atan(pos.z, pos.x);
                    float flicker = 0.62 + 0.4*sin(uTime*9.5) + 0.18*sin(uTime*22.0);
                    float turb = sin(angle*5.5 + uTime*6.5) * 0.22;
                    float flow = noise(vec3(angle*1.8, pos.y*3.2, uTime*1.5)) * 0.55;
                    float density = core * (0.58 + flow*0.52) * flicker + turb;
                    float edgeGlow = 1.0 - smoothstep(0.02, 0.38, dist);
                    density *= (edgeGlow + 0.22);
                    density = clamp(density * uIntensity, 0.0, 1.05);
                    vec3 col = mix(vec3(0.75,0.28,0.12), vec3(0.85,0.42,0.22), density*1.2);
                    col = mix(col, vec3(0.95,0.62,0.42), pow(density,1.35));
                    float hot = pow(core,1.45) * (0.62 + flicker*0.48);
                    col += vec3(0.92,0.42,0.18) * hot * 0.42;
                    gl_FragColor = vec4(col, density * (0.78 + flicker*0.22));
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const fireRing = new THREE.Mesh(fireRingGeo, fireMat);
        fireRing.position.y = 0.285;
        scene.add(fireRing);
        
        // Inner core
        const innerCoreMat = new THREE.MeshStandardMaterial({ color: 0xc9522a, emissive: 0xb5421a, emissiveIntensity: 0.72, metalness: 0.14, roughness: 0.24 });
        const innerCore = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.085, 120, 280), innerCoreMat);
        innerCore.position.y = 0.285;
        scene.add(innerCore);
        
        // --------------------------------------------------------------
        // OPTIMIZED PARTICLES — GPU-friendly, infinite rise, reduced counts
        // --------------------------------------------------------------
        const { embers: eCount, sparks: sCount, ash: aCount, orbs: oCount } = PARAMS.quality.particleCounts;
        
        // Embers
        const emberGeo = new THREE.BufferGeometry();
        const emberPos = new Float32Array(eCount * 3);
        const emberSpeed = [];
        for (let i = 0; i < eCount; i++) {
            const rad = 0.6 + Math.random() * 1.72;
            const ang = Math.random() * Math.PI * 2;
            emberPos[i*3] = Math.cos(ang) * rad;
            emberPos[i*3+2] = Math.sin(ang) * rad;
            emberPos[i*3+1] = 0.1 + Math.random() * 6.5;
            emberSpeed.push(0.24 + Math.random() * 0.85);
        }
        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
        const emberMat = new THREE.PointsMaterial({ color: 0xe87a3a, size: 0.019, blending: THREE.AdditiveBlending, transparent: true });
        const embers = new THREE.Points(emberGeo, emberMat);
        scene.add(embers);
        
        // Sparks
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPos = new Float32Array(sCount * 3);
        const sparkSpeed = [];
        for (let i = 0; i < sCount; i++) {
            const rad = 0.55 + Math.random() * 1.8;
            const ang = Math.random() * Math.PI * 2;
            sparkPos[i*3] = Math.cos(ang) * rad;
            sparkPos[i*3+2] = Math.sin(ang) * rad;
            sparkPos[i*3+1] = 0.12 + Math.random() * 7.2;
            sparkSpeed.push(0.42 + Math.random() * 1.1);
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparkMat = new THREE.PointsMaterial({ color: 0xff8a52, size: 0.0085, blending: THREE.AdditiveBlending });
        const sparks = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparks);
        
        // Ash
        const ashGeo = new THREE.BufferGeometry();
        const ashPos = new Float32Array(aCount * 3);
        const ashSpeed = [];
        for (let i = 0; i < aCount; i++) {
            const rad = 0.7 + Math.random() * 2.1;
            const ang = Math.random() * Math.PI * 2;
            ashPos[i*3] = Math.cos(ang) * rad;
            ashPos[i*3+2] = Math.sin(ang) * rad;
            ashPos[i*3+1] = 0.18 + Math.random() * 6.2;
            ashSpeed.push(0.16 + Math.random() * 0.55);
        }
        ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3));
        const ashMat = new THREE.PointsMaterial({ color: 0x9a785a, size: 0.022, transparent: true, opacity: 0.38 });
        const ashSys = new THREE.Points(ashGeo, ashMat);
        scene.add(ashSys);
        
        // Orbs (glowing)
        const orbGeo = new THREE.BufferGeometry();
        const orbPos = new Float32Array(oCount * 3);
        const orbSpeed = [];
        for (let i = 0; i < oCount; i++) {
            const rad = 0.8 + Math.random() * 1.45;
            const ang = Math.random() * Math.PI * 2;
            orbPos[i*3] = Math.cos(ang) * rad;
            orbPos[i*3+2] = Math.sin(ang) * rad;
            orbPos[i*3+1] = 0.25 + Math.random() * 5.8;
            orbSpeed.push(0.1 + Math.random() * 0.38);
        }
        orbGeo.setAttribute('position', new THREE.BufferAttribute(orbPos, 3));
        const orbMat = new THREE.PointsMaterial({ color: 0xff8855, size: 0.032, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.68 });
        const orbs = new THREE.Points(orbGeo, orbMat);
        scene.add(orbs);
        
        // Star field (static, lightweight)
        const starFieldGeo = new THREE.BufferGeometry();
        const starPosArr = new Float32Array(1500 * 3);
        for (let i = 0; i < 1500; i++) {
            starPosArr[i*3] = (Math.random() - 0.5) * 180;
            starPosArr[i*3+1] = (Math.random() - 0.5) * 65 + 10;
            starPosArr[i*3+2] = (Math.random() - 0.5) * 90 - 55;
        }
        starFieldGeo.setAttribute('position', new THREE.BufferAttribute(starPosArr, 3));
        const starMatLight = new THREE.PointsMaterial({ color: 0xffcc99, size: 0.07, transparent: true, opacity: 0.42 });
        const starField = new THREE.Points(starFieldGeo, starMatLight);
        scene.add(starField);
        
        // --------------------------------------------------------------
        // LIGHTING — Balanced, fire-centric
        // --------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0x241e2a, PARAMS.lighting.ambientIntensity);
        scene.add(ambientLight);
        
        const sunsetLight = new THREE.DirectionalLight(0xffaa77, PARAMS.lighting.sunsetIntensity);
        sunsetLight.position.set(7.5, 4.8, -5.5);
        sunsetLight.castShadow = true;
        sunsetLight.shadow.mapSize.width = 1024;
        sunsetLight.shadow.mapSize.height = 1024;
        scene.add(sunsetLight);
        
        const fireLight = new THREE.PointLight(0xc5522a, PARAMS.lighting.fireLightIntensity, 12, 1.3);
        fireLight.position.set(0, 0.78, 0);
        fireLight.castShadow = true;
        fireLight.shadow.mapSize.width = 512;
        fireLight.shadow.mapSize.height = 512;
        scene.add(fireLight);
        
        const flickerLight = new THREE.PointLight(0xd96a32, 1.45, 9);
        flickerLight.position.set(0.24, 0.96, 0.32);
        scene.add(flickerLight);
        
        const rimLight = new THREE.PointLight(0xaa4a22, 0.78);
        rimLight.position.set(-0.55, 0.85, -1.12);
        scene.add(rimLight);
        
        const fillLight = new THREE.PointLight(0xaa6644, 0.38);
        fillLight.position.set(0, -0.38, 0);
        scene.add(fillLight);
        
        // Heat haze (subtle)
        const hazeSphere = new THREE.Mesh(new THREE.SphereGeometry(2.12, 32, 32), new THREE.MeshStandardMaterial({ color: 0xc5522a, emissive: 0xa53a1a, emissiveIntensity: 0.1, transparent: true, opacity: 0.04 }));
        hazeSphere.position.y = 0.7;
        scene.add(hazeSphere);
        
        // --------------------------------------------------------------
        // ANIMATION LOOP — Optimized particle updates
        // --------------------------------------------------------------
        let clock = new THREE.Clock();
        
        function animate() {
            const elapsed = performance.now() / 1000;
            const delta = Math.min(clock.getDelta(), 0.033);
            
            // Fire shader
            fireUniforms.uTime.value = elapsed;
            fireUniforms.uIntensity.value = PARAMS.fire.intensityBase + Math.sin(elapsed * PARAMS.fire.intensitySpeed) * 0.16;
            
            // Dynamic lights
            fireLight.intensity = PARAMS.lighting.fireLightIntensity + Math.sin(elapsed * 9.5) * 0.85;
            flickerLight.intensity = 1.38 + Math.sin(elapsed * 11.8) * 0.58;
            rimLight.intensity = 0.72 + Math.sin(elapsed * 6.5) * 0.28;
            fillLight.intensity = 0.38 + Math.sin(elapsed * 1.2) * 0.06;
            
            // Inner core pulse
            innerCore.material.emissiveIntensity = 0.68 + Math.sin(elapsed * 7.2) * 0.44;
            
            // Sun pulse
            sunMat.emissiveIntensity = 0.92 + Math.sin(elapsed * 0.45) * 0.1;
            
            // --- PARTICLE UPDATES (infinite rise, no cutoff) ---
            // Embers
            const ePos = embers.geometry.attributes.position.array;
            for (let i = 0; i < eCount; i++) {
                let y = ePos[i*3+1] + 0.0075 * emberSpeed[i];
                if (y > 7.2) {
                    y = 0.08;
                    const newRad = 0.6 + Math.random() * 1.72;
                    const newAng = Math.random() * Math.PI * 2;
                    ePos[i*3] = Math.cos(newAng) * newRad;
                    ePos[i*3+2] = Math.sin(newAng) * newRad;
                }
                ePos[i*3+1] = y;
            }
            embers.geometry.attributes.position.needsUpdate = true;
            
            // Sparks
            const sPos = sparks.geometry.attributes.position.array;
            for (let i = 0; i < sCount; i++) {
                let y = sPos[i*3+1] + 0.012 * sparkSpeed[i];
                if (y > 7.8) {
                    y = 0.1;
                    const newRad = 0.55 + Math.random() * 1.8;
                    const newAng = Math.random() * Math.PI * 2;
                    sPos[i*3] = Math.cos(newAng) * newRad;
                    sPos[i*3+2] = Math.sin(newAng) * newRad;
                }
                sPos[i*3+1] = y;
            }
            sparks.geometry.attributes.position.needsUpdate = true;
            
            // Ash (slow drift)
            const aPos = ashSys.geometry.attributes.position.array;
            for (let i = 0; i < aCount; i++) {
                let y = aPos[i*3+1] + 0.0055 * ashSpeed[i];
                if (y > 6.8) {
                    y = 0.15;
                    const newRad = 0.7 + Math.random() * 2.0;
                    const newAng = Math.random() * Math.PI * 2;
                    aPos[i*3] = Math.cos(newAng) * newRad;
                    aPos[i*3+2] = Math.sin(newAng) * newRad;
                }
                aPos[i*3+1] = y;
            }
            ashSys.geometry.attributes.position.needsUpdate = true;
            
            // Orbs
            const oPos = orbs.geometry.attributes.position.array;
            for (let i = 0; i < oCount; i++) {
                let y = oPos[i*3+1] + 0.0048 * orbSpeed[i];
                if (y > 6.6) {
                    y = 0.2;
                    const newRad = 0.75 + Math.random() * 1.5;
                    const newAng = Math.random() * Math.PI * 2;
                    oPos[i*3] = Math.cos(newAng) * newRad;
                    oPos[i*3+2] = Math.sin(newAng) * newRad;
                }
                oPos[i*3+1] = y;
            }
            orbs.geometry.attributes.position.needsUpdate = true;
            
            // Water uniforms
            waterUniforms.uTime.value = elapsed;
            waterUniforms.uCameraPosition.value.copy(camera.position);
            
            // Color grade time
            colorGradePass.uniforms.uTime.value = elapsed;
            
            // Gentle camera drift
            camera.position.x = Math.sin(elapsed * 0.038) * 0.028;
            camera.position.y = PARAMS.camera.height + Math.sin(elapsed * 0.07) * 0.007;
            camera.lookAt(0, PARAMS.camera.lookAtY, 0);
            
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Show ready indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loading';
        loadingDiv.textContent = '✦ RING OF FIRE • CINEMATIC EDITION ✦';
        loadingDiv.style.opacity = '0.6';
        document.body.appendChild(loadingDiv);
        setTimeout(() => { loadingDiv.style.opacity = '0'; }, 2000);
    </script>
</body>
</html>
