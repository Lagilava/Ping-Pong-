<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ring of Fire — Obsidian Altar | Dusk Horizon | Cinematic Realism</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            padding: 10px 22px;
            border-radius: 40px;
            color: #c9a87b;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 20;
            font-family: monospace;
            border-left: 3px solid #c95a2a;
            z-index: 20;
        }
        #badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #b8926a;
            font-size: 10px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
        }
        @media (max-width: 700px) {
            #info { font-size: 9px; bottom: 12px; left: 12px; padding: 6px 14px; }
            #badge { font-size: 8px; top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div id="info">⛤ RING OF FIRE • OBSIDIAN ALTAR ⛤ | Dusk Horizon | Volumetric Embers | Ancient Stonework</div>
    <div id="badge">🌙 Dusk Lighting | PBR Materials | Realistic Altar | Distant Sun</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --------------------------------------------------------------
        // SCENE — Dark Dusk Atmosphere, No Fake Gradient Rings
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050710);
        scene.fog = new THREE.FogExp2(0x050710, 0.0045); // deep atmospheric haze
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
        camera.position.set(0, 1.65, 6.4);
        camera.lookAt(0, 0.72, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05; // darker, moody exposure
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Post-processing — subtle bloom, not overpowering
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.35, 0.6);
        bloomPass.threshold = 0.18;
        bloomPass.strength = 0.65;
        bloomPass.radius = 0.55;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --------------------------------------------------------------
        // SKY — Realistic Dusk with Distant Sun (No Gradient Circle)
        // --------------------------------------------------------------
        // Starfield (subtle, deep)
        const starCount = 2800;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 400;
            starPos[i*3+1] = (Math.random() - 0.5) * 120 + 25;
            starPos[i*3+2] = (Math.random() - 0.5) * 150 - 70;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xcceeff, size: 0.09, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
        
        // Distant sun glow (small, atmospheric, no fake ring)
        const sunGlowMat = new THREE.MeshStandardMaterial({
            color: 0xffaa66,
            emissive: 0xff8844,
            emissiveIntensity: 0.65,
            transparent: true,
            opacity: 0.7
        });
        const distantSun = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), sunGlowMat);
        distantSun.position.set(18, 12, -22);
        scene.add(distantSun);
        
        // Atmospheric haze particles (very subtle)
        const hazeCount = 800;
        const hazeGeo = new THREE.BufferGeometry();
        const hazePos = new Float32Array(hazeCount * 3);
        for (let i = 0; i < hazeCount; i++) {
            hazePos[i*3] = (Math.random() - 0.5) * 35;
            hazePos[i*3+1] = Math.random() * 8;
            hazePos[i*3+2] = (Math.random() - 0.5) * 25 - 10;
        }
        hazeGeo.setAttribute('position', new THREE.BufferAttribute(hazePos, 3));
        const hazeMat = new THREE.PointsMaterial({ color: 0x6688aa, size: 0.045, transparent: true, opacity: 0.12 });
        const hazeSys = new THREE.Points(hazeGeo, hazeMat);
        scene.add(hazeSys);
        
        // --------------------------------------------------------------
        // INFINITE WATER — Dark, Reflective, No Fake Gradient Ring
        // --------------------------------------------------------------
        const waterUniforms = {
            uTime: { value: 0 },
            uCameraPosition: { value: camera.position.clone() },
            uReflectivity: { value: 0.58 }
        };
        
        const waterVS = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float wave1 = sin(pos.x * 1.2 + uTime * 0.9) * 0.018;
                float wave2 = cos(pos.z * 1.4 + uTime * 0.7) * 0.015;
                pos.y += wave1 + wave2;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const waterFS = `
            uniform vec3 uCameraPosition;
            uniform float uTime;
            uniform float uReflectivity;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            
            void main() {
                vec3 viewDir = normalize(uCameraPosition - vWorldPosition);
                vec3 normal = vec3(0.0, 1.0, 0.0);
                normal.x += sin(vWorldPosition.x * 2.5 + uTime) * 0.07;
                normal.z += cos(vWorldPosition.z * 2.7 + uTime * 0.8) * 0.06;
                normal = normalize(normal);
                
                float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 3.2);
                
                // Deep dark water colors — no bright gradients
                vec3 deepWater = vec3(0.02, 0.03, 0.08);
                vec3 midWater = vec3(0.04, 0.07, 0.14);
                float distFactor = clamp(length(vWorldPosition.xz) * 0.04, 0.0, 0.6);
                vec3 waterColor = mix(deepWater, midWater, distFactor);
                
                // Subtle fire reflection (warm tint, not overpowering)
                vec3 fireReflect = vec3(0.85, 0.35, 0.15) * fresnel * 0.55;
                vec3 finalColor = waterColor + fireReflect;
                
                // Minimal ripple highlights
                float ripple = sin(vWorldPosition.x * 10.0 + uTime) * cos(vWorldPosition.z * 9.0 - uTime);
                ripple = max(0.0, ripple * 0.12);
                finalColor += vec3(0.55, 0.4, 0.3) * ripple;
                
                gl_FragColor = vec4(finalColor, 0.94);
            }
        `;
        
        const waterPlaneGeo = new THREE.PlaneGeometry(48, 48, 280, 280);
        const waterMaterial = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            vertexShader: waterVS,
            fragmentShader: waterFS,
            transparent: true,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterPlaneGeo, waterMaterial);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.68;
        scene.add(waterPlane);
        
        // --------------------------------------------------------------
        // DETAILED ALTAR — Obsidian Stone with Carvings, Cracks, Realism
        // --------------------------------------------------------------
        // Base platform (large, weathered)
        const stoneDark = new THREE.MeshStandardMaterial({ color: 0x2a2420, roughness: 0.72, metalness: 0.08, emissive: 0x080604, emissiveIntensity: 0.04 });
        const stoneGrit = new THREE.MeshStandardMaterial({ color: 0x3a3228, roughness: 0.78, metalness: 0.05 });
        
        // Main altar base (hexagonal feel with cylinder)
        const baseMain = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.45, 0.52, 64), stoneDark);
        baseMain.position.y = -0.62;
        baseMain.castShadow = true;
        baseMain.receiveShadow = true;
        scene.add(baseMain);
        
        // Middle tier
        const middleTier = new THREE.Mesh(new THREE.CylinderGeometry(1.85, 2.05, 0.38, 64), stoneDark);
        middleTier.position.y = -0.28;
        middleTier.castShadow = true;
        middleTier.receiveShadow = true;
        scene.add(middleTier);
        
        // Upper platform (where fire rests)
        const upperPlatform = new THREE.Mesh(new THREE.CylinderGeometry(1.58, 1.75, 0.28, 72), stoneGrit);
        upperPlatform.position.y = 0.02;
        upperPlatform.castShadow = true;
        upperPlatform.receiveShadow = true;
        scene.add(upperPlatform);
        
        // Altar top surface — detailed disc with rune carvings (using small geometry)
        const altarTopSurface = new THREE.Mesh(new THREE.CylinderGeometry(1.48, 1.52, 0.12, 72), new THREE.MeshStandardMaterial({ color: 0x2a201a, roughness: 0.55, metalness: 0.12 }));
        altarTopSurface.position.y = 0.14;
        altarTopSurface.castShadow = true;
        scene.add(altarTopSurface);
        
        // Decorative stone ring (carved)
        const carvedRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.048, 128, 240), new THREE.MeshStandardMaterial({ color: 0x8a6a48, metalness: 0.45, roughness: 0.4, emissive: 0x331a0a, emissiveIntensity: 0.1 }));
        carvedRing.position.y = 0.22;
        carvedRing.rotation.x = Math.PI / 2;
        scene.add(carvedRing);
        
        // Small supporting pillars around altar (4)
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2e, roughness: 0.68 });
        const pillarPositions = [
            [-1.52, -0.45, -1.52], [1.52, -0.45, -1.52], [1.52, -0.45, 1.52], [-1.52, -0.45, 1.52],
            [-1.38, -0.45, 1.38], [1.38, -0.45, 1.38], [1.38, -0.45, -1.38], [-1.38, -0.45, -1.38]
        ];
        pillarPositions.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.48, 0.28), pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });
        
        // Scattered ritual stones / debris around base
        const debrisMat = new THREE.MeshStandardMaterial({ color: 0x4a3a32, roughness: 0.8 });
        for (let i = 0; i < 65; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.045 + Math.random() * 0.055), debrisMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 2.05 + Math.random() * 0.85;
            rock.position.x = Math.cos(angle) * rad;
            rock.position.z = Math.sin(angle) * rad;
            rock.position.y = -0.52 + Math.random() * 0.12;
            rock.scale.set(1, Math.random() * 0.6 + 0.4, 1);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        }
        
        // Crack details on altar surface (small lines using thin cylinders)
        const crackMat = new THREE.MeshStandardMaterial({ color: 0x1a120c });
        for (let i = 0; i < 28; i++) {
            const crack = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.018, 0.08 + Math.random() * 0.12), crackMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 0.65 + Math.random() * 0.85;
            crack.position.x = Math.cos(angle) * rad;
            crack.position.z = Math.sin(angle) * rad;
            crack.position.y = 0.19;
            crack.rotation.z = Math.random() * Math.PI;
            crack.rotation.x = Math.random() * Math.PI;
            scene.add(crack);
        }
        
        // --------------------------------------------------------------
        // RING OF FIRE — Volumetric, Darker Embers
        // --------------------------------------------------------------
        const fireUniforms = {
            uTime: { value: 0 },
            uIntensity: { value: 1.15 },
            uColorCore: { value: new THREE.Color(0xc54a1a) },
            uColorMid: { value: new THREE.Color(0xd96a2a) },
            uColorTip: { value: new THREE.Color(0xe88a4a) }
        };
        
        const fireVS = `
            varying vec3 vPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vPosition = mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fireFS = `
            uniform float uTime;
            uniform vec3 uColorCore;
            uniform vec3 uColorMid;
            uniform vec3 uColorTip;
            uniform float uIntensity;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }
            
            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float n = mix(
                    mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
                    f.z);
                return n * 2.0 - 1.0;
            }
            
            void main() {
                vec3 pos = vPosition;
                float majorR = 1.02;
                float minorR = 0.168;
                float rho = length(pos.xz);
                float torusDist = abs(rho - majorR) - minorR;
                float distToSurface = abs(torusDist);
                float core = 1.0 - smoothstep(0.0, 0.24, distToSurface);
                
                float angle = atan(pos.z, pos.x);
                float flicker = 0.65 + 0.4 * sin(uTime * 11.0) + 0.15 * sin(uTime * 27.0);
                float turbulence = sin(angle * 7.0 + uTime * 9.0) * 0.2;
                float flow = noise3D(vec3(angle * 2.5, pos.y * 4.0, uTime * 2.0)) * 0.55;
                
                float density = core * (0.6 + flow * 0.5) * flicker + turbulence;
                float edgeGlow = 1.0 - smoothstep(0.02, 0.32, distToSurface);
                density *= (edgeGlow + 0.25);
                density = clamp(density * uIntensity, 0.0, 1.05);
                
                vec3 col = mix(uColorCore, uColorMid, density * 1.1);
                col = mix(col, uColorTip, pow(density, 1.4));
                float hotness = pow(core, 1.4) * (0.7 + flicker * 0.5);
                col += vec3(1.0, 0.5, 0.2) * hotness * 0.45;
                
                float alpha = density * (0.8 + flicker * 0.2);
                alpha = clamp(alpha, 0.0, 0.92);
                gl_FragColor = vec4(col, alpha);
            }
        `;
        
        const fireRingGeo = new THREE.TorusGeometry(1.02, 0.168, 220, 400);
        const fireMaterialShader = new THREE.ShaderMaterial({
            uniforms: fireUniforms,
            vertexShader: fireVS,
            fragmentShader: fireFS,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const fireRing = new THREE.Mesh(fireRingGeo, fireMaterialShader);
        fireRing.position.y = 0.24;
        scene.add(fireRing);
        
        // Inner glowing ember core
        const coreGlowMat = new THREE.MeshStandardMaterial({ color: 0xd95a2a, emissive: 0xc54a1a, emissiveIntensity: 0.85, metalness: 0.2, roughness: 0.3 });
        const innerGlowRing = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.085, 160, 320), coreGlowMat);
        innerGlowRing.position.y = 0.24;
        scene.add(innerGlowRing);
        
        // --------------------------------------------------------------
        // 3D PARTICLES — Full Space, No Cutout
        // --------------------------------------------------------------
        // Rising embers (organic motion)
        const emberCount = 2400;
        const emberGeoP = new THREE.BufferGeometry();
        const emberPosArr = new Float32Array(emberCount * 3);
        const emberData = [];
        for (let i = 0; i < emberCount; i++) {
            const rad = 0.7 + Math.random() * 1.5;
            const ang = Math.random() * Math.PI * 2;
            emberPosArr[i*3] = Math.cos(ang) * rad;
            emberPosArr[i*3+2] = Math.sin(ang) * rad;
            emberPosArr[i*3+1] = 0.12 + Math.random() * 1.5;
            emberData.push({ speed: 0.25 + Math.random() * 0.75, rad, ang });
        }
        emberGeoP.setAttribute('position', new THREE.BufferAttribute(emberPosArr, 3));
        const emberPointsMat = new THREE.PointsMaterial({ color: 0xea7a3a, size: 0.018, blending: THREE.AdditiveBlending, transparent: true });
        const embersSys = new THREE.Points(emberGeoP, emberPointsMat);
        scene.add(embersSys);
        
        // Floating ash (darker, drifting)
        const ashCount = 1800;
        const ashGeo = new THREE.BufferGeometry();
        const ashPos = new Float32Array(ashCount * 3);
        for (let i = 0; i < ashCount; i++) {
            const rad = 0.8 + Math.random() * 1.9;
            const ang = Math.random() * Math.PI * 2;
            ashPos[i*3] = Math.cos(ang) * rad;
            ashPos[i*3+2] = Math.sin(ang) * rad;
            ashPos[i*3+1] = 0.2 + Math.random() * 1.7;
        }
        ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3));
        const ashMat = new THREE.PointsMaterial({ color: 0x886a52, size: 0.022, transparent: true, opacity: 0.35 });
        const ashSys = new THREE.Points(ashGeo, ashMat);
        scene.add(ashSys);
        
        // Spark particles (tiny, fast)
        const sparkCount = 3500;
        const sparkGeoP = new THREE.BufferGeometry();
        const sparkPosArr = new Float32Array(sparkCount * 3);
        for (let i = 0; i < sparkCount; i++) {
            const rad = 0.6 + Math.random() * 1.65;
            const ang = Math.random() * Math.PI * 2;
            sparkPosArr[i*3] = Math.cos(ang) * rad;
            sparkPosArr[i*3+2] = Math.sin(ang) * rad;
            sparkPosArr[i*3+1] = 0.15 + Math.random() * 1.45;
        }
        sparkGeoP.setAttribute('position', new THREE.BufferAttribute(sparkPosArr, 3));
        const sparkMatP = new THREE.PointsMaterial({ color: 0xff8855, size: 0.007, blending: THREE.AdditiveBlending });
        const sparksSys = new THREE.Points(sparkGeoP, sparkMatP);
        scene.add(sparksSys);
        
        // --------------------------------------------------------------
        // LIGHTING — Dark, Moody, Fire-Centric
        // --------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0x111522, 0.38);
        scene.add(ambientLight);
        
        // Dusk directional light (cool, subtle)
        const duskLight = new THREE.DirectionalLight(0x6a7c9a, 0.42);
        duskLight.position.set(3, 2.5, -2);
        duskLight.castShadow = false;
        scene.add(duskLight);
        
        // 🔥 MAIN FIRE LIGHT (darker intensity)
        const fireLight = new THREE.PointLight(0xc55a2a, 3.8, 11, 1.4);
        fireLight.position.set(0, 0.65, 0);
        fireLight.castShadow = true;
        fireLight.shadow.mapSize.width = 1024;
        fireLight.shadow.mapSize.height = 1024;
        fireLight.shadow.bias = -0.0002;
        scene.add(fireLight);
        
        // Flicker secondary
        const flickerLight = new THREE.PointLight(0xd96a32, 1.8, 9);
        flickerLight.position.set(0.22, 0.85, 0.28);
        scene.add(flickerLight);
        
        // Back rim (subtle)
        const backRim = new THREE.PointLight(0xb54a1a, 0.95);
        backRim.position.set(-0.45, 0.78, -1.05);
        scene.add(backRim);
        
        // Ground bounce (very subtle)
        const groundBounce = new THREE.PointLight(0x334466, 0.32);
        groundBounce.position.set(0, -0.35, 0);
        scene.add(groundBounce);
        
        // Volumetric heat haze (very subtle sphere)
        const hazeSphereMat = new THREE.MeshStandardMaterial({ color: 0xc55a2a, emissive: 0xa5421a, emissiveIntensity: 0.18, transparent: true, opacity: 0.05 });
        const heatHaze = new THREE.Mesh(new THREE.SphereGeometry(2.05, 48, 48), hazeSphereMat);
        heatHaze.position.y = 0.58;
        scene.add(heatHaze);
        
        // --------------------------------------------------------------
        // ANIMATION
        // --------------------------------------------------------------
        let clock = new THREE.Clock();
        
        function animate() {
            const elapsed = performance.now() / 1000;
            
            // Fire shader
            fireUniforms.uTime.value = elapsed;
            fireUniforms.uIntensity.value = 1.12 + Math.sin(elapsed * 6.0) * 0.18;
            
            // Fire light flicker
            fireLight.intensity = 3.6 + Math.sin(elapsed * 11.5) * 1.1;
            flickerLight.intensity = 1.65 + Math.sin(elapsed * 13.2) * 0.75;
            backRim.intensity = 0.88 + Math.sin(elapsed * 8.0) * 0.35;
            groundBounce.intensity = 0.32 + Math.sin(elapsed * 1.6) * 0.08;
            
            // Inner core pulse
            innerGlowRing.material.emissiveIntensity = 0.78 + Math.sin(elapsed * 8.2) * 0.45;
            
            // Ember animation (rising)
            const emberPosAttr = embersSys.geometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                let y = emberPosAttr[i*3+1];
                y += 0.007 * emberData[i].speed;
                if (y > 1.75) {
                    y = 0.08;
                    const newRad = 0.65 + Math.random() * 1.55;
                    const newAng = Math.random() * Math.PI * 2;
                    emberPosAttr[i*3] = Math.cos(newAng) * newRad;
                    emberPosAttr[i*3+2] = Math.sin(newAng) * newRad;
                    emberData[i].rad = newRad;
                }
                emberPosAttr[i*3+1] = y;
            }
            embersSys.geometry.attributes.position.needsUpdate = true;
            
            // Rotate ash and sparks
            ashSys.rotation.y = elapsed * 0.04;
            sparksSys.rotation.y = elapsed * 0.07;
            
            // Water uniforms
            waterUniforms.uTime.value = elapsed;
            waterUniforms.uCameraPosition.value.copy(camera.position);
            
            // Gentle camera drift
            camera.position.x = Math.sin(elapsed * 0.06) * 0.04;
            camera.position.y = 1.63 + Math.sin(elapsed * 0.1) * 0.012;
            camera.lookAt(0, 0.78, 0);
            
            // Distant sun subtle pulsation
            distantSun.material.emissiveIntensity = 0.62 + Math.sin(elapsed * 0.2) * 0.08;
            
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('⛤ Ring of Fire | Obsidian Altar | Dark Dusk Atmosphere | Realistic Details');
