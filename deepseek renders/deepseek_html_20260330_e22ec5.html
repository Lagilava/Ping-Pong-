<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ring of Fire</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        
        // --------------------------------------------------------------
        // SCENE — Dark, Moody, Infinite Horizon
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        scene.fog = new THREE.FogExp2(0x020210, 0.0032);
        
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, 1.72, 6.8);
        camera.lookAt(0, 0.85, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 0.95;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // --------------------------------------------------------------
        // ZACK SNYDER COLOR GRADE — Custom LUT-style shader
        // --------------------------------------------------------------
        const colorGradeShader = {
            uniforms: {
                tDiffuse: { value: null },
                uTime: { value: 0 },
                uContrast: { value: 1.15 },
                uSaturation: { value: 0.75 },
                uDesaturateBlues: { value: 0.65 },
                uWarmShadows: { value: 0.22 },
                uCoolHighlights: { value: 0.35 },
                uVignette: { value: 0.65 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                uniform float uContrast;
                uniform float uSaturation;
                uniform float uDesaturateBlues;
                uniform float uWarmShadows;
                uniform float uCoolHighlights;
                uniform float uVignette;
                varying vec2 vUv;
                
                vec3 liftGammaGain(vec3 color, vec3 lift, vec3 gamma, vec3 gain) {
                    vec3 c = color;
                    c = c * (1.0 - lift) + lift;
                    c = pow(c, 1.0 / gamma);
                    c = c * gain;
                    return c;
                }
                
                void main() {
                    vec4 color = texture2D(tDiffuse, vUv);
                    vec3 c = color.rgb;
                    
                    // Zack Snyder style: desaturated blues, warm shadows, cool highlights
                    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
                    vec3 desat = vec3(lum);
                    
                    // Desaturate blues specifically
                    float blueBoost = max(0.0, c.b - max(c.r, c.g)) * uDesaturateBlues;
                    c = mix(c, desat, 0.35 + blueBoost * 0.4);
                    
                    // Adjust saturation
                    c = mix(desat, c, uSaturation);
                    
                    // Contrast
                    c = (c - 0.5) * uContrast + 0.5;
                    
                    // Warm shadows (orange/brown tint in dark areas)
                    vec3 warmTint = vec3(0.28, 0.18, 0.08);
                    vec3 coolTint = vec3(0.12, 0.15, 0.28);
                    float shadowFactor = 1.0 - smoothstep(0.0, 0.45, lum);
                    float highlightFactor = smoothstep(0.55, 1.0, lum);
                    c += warmTint * shadowFactor * uWarmShadows;
                    c += coolTint * highlightFactor * uCoolHighlights;
                    
                    // Crush blacks slightly (Snyder look)
                    c = max(c, vec3(0.04));
                    c = pow(c, vec3(0.98));
                    
                    // Vignette
                    float dist = length(vUv - 0.5);
                    float vignette = 1.0 - dist * uVignette;
                    vignette = clamp(vignette, 0.55, 1.0);
                    c *= vignette;
                    
                    // Subtle film grain
                    float grain = fract(sin(dot(vUv, vec2(12.9898, 78.233))) * 43758.5453 + uTime) * 0.025;
                    c += grain * 0.12;
                    
                    gl_FragColor = vec4(c, color.a);
                }
            `
        };
        
        // Render passes
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.78, 0.32, 0.58);
        bloomPass.threshold = 0.22;
        bloomPass.strength = 0.58;
        bloomPass.radius = 0.62;
        
        const colorGradePass = new ShaderPass(colorGradeShader);
        colorGradePass.renderToScreen = true;
        
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        effectComposer.addPass(colorGradePass);
        
        // --------------------------------------------------------------
        // INFINITE WATER — Seamless, No Rectangle Cutout
        // --------------------------------------------------------------
        const waterUniforms = {
            uTime: { value: 0 },
            uCameraPosition: { value: camera.position.clone() }
        };
        
        const waterVS = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float wave1 = sin(pos.x * 1.1 + uTime * 0.8) * 0.014;
                float wave2 = cos(pos.z * 1.3 + uTime * 0.65) * 0.012;
                pos.y += wave1 + wave2;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const waterFS = `
            uniform vec3 uCameraPosition;
            uniform float uTime;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            
            void main() {
                vec3 viewDir = normalize(uCameraPosition - vWorldPosition);
                vec3 normal = vec3(0.0, 1.0, 0.0);
                normal.x += sin(vWorldPosition.x * 2.2 + uTime) * 0.06;
                normal.z += cos(vWorldPosition.z * 2.4 + uTime * 0.7) * 0.05;
                normal = normalize(normal);
                
                float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 3.0);
                
                // Deep, dark infinite water
                vec3 deepColor = vec3(0.01, 0.02, 0.06);
                vec3 midColor = vec3(0.03, 0.05, 0.12);
                float depthFactor = clamp(length(vWorldPosition.xz) * 0.025, 0.0, 0.5);
                vec3 waterColor = mix(deepColor, midColor, depthFactor);
                
                // Fire reflection (muted)
                vec3 fireReflect = vec3(0.75, 0.28, 0.12) * fresnel * 0.48;
                vec3 finalColor = waterColor + fireReflect;
                
                // Subtle ripple highlights
                float ripple = sin(vWorldPosition.x * 8.0 + uTime) * cos(vWorldPosition.z * 7.0 - uTime);
                ripple = max(0.0, ripple * 0.08);
                finalColor += vec3(0.45, 0.28, 0.18) * ripple;
                
                gl_FragColor = vec4(finalColor, 0.96);
            }
        `;
        
        // Massive water plane — extends to infinity visually
        const waterPlaneGeo = new THREE.PlaneGeometry(85, 85, 420, 420);
        const waterMaterial = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            vertexShader: waterVS,
            fragmentShader: waterFS,
            transparent: true,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterPlaneGeo, waterMaterial);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.72;
        scene.add(waterPlane);
        
        // Distant horizon ring (barely visible, soft edge)
        const horizonRingGeo = new THREE.RingGeometry(32, 52, 96);
        const horizonMat = new THREE.MeshStandardMaterial({ color: 0x0a1022, roughness: 0.9, metalness: 0.02, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
        const horizonRing = new THREE.Mesh(horizonRingGeo, horizonMat);
        horizonRing.rotation.x = -Math.PI / 2;
        horizonRing.position.y = -0.78;
        scene.add(horizonRing);
        
        // --------------------------------------------------------------
        // DETAILED ALTAR — Ancient Obsidian with Carvings
        // --------------------------------------------------------------
        const darkStone = new THREE.MeshStandardMaterial({ color: 0x221e1a, roughness: 0.65, metalness: 0.08, emissive: 0x060404, emissiveIntensity: 0.03 });
        const darkStoneRough = new THREE.MeshStandardMaterial({ color: 0x2a241e, roughness: 0.78, metalness: 0.05 });
        const agedMetal = new THREE.MeshStandardMaterial({ color: 0x6a4a32, roughness: 0.48, metalness: 0.52, emissive: 0x2a1a0a, emissiveIntensity: 0.08 });
        
        // Main base
        const baseMain = new THREE.Mesh(new THREE.CylinderGeometry(2.22, 2.52, 0.58, 80), darkStone);
        baseMain.position.y = -0.65;
        baseMain.castShadow = true;
        baseMain.receiveShadow = true;
        scene.add(baseMain);
        
        // Middle tier
        const middleTier = new THREE.Mesh(new THREE.CylinderGeometry(1.92, 2.12, 0.44, 80), darkStone);
        middleTier.position.y = -0.29;
        middleTier.castShadow = true;
        middleTier.receiveShadow = true;
        scene.add(middleTier);
        
        // Upper platform
        const upperTier = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.82, 0.32, 80), darkStoneRough);
        upperTier.position.y = 0.02;
        upperTier.castShadow = true;
        upperTier.receiveShadow = true;
        scene.add(upperTier);
        
        // Altar crown (where fire sits)
        const altarCrown = new THREE.Mesh(new THREE.CylinderGeometry(1.52, 1.58, 0.16, 80), new THREE.MeshStandardMaterial({ color: 0x2a221c, roughness: 0.52, metalness: 0.12 }));
        altarCrown.position.y = 0.18;
        altarCrown.castShadow = true;
        scene.add(altarCrown);
        
        // Carved bronze ring
        const bronzeRing = new THREE.Mesh(new THREE.TorusGeometry(1.48, 0.052, 160, 320), agedMetal);
        bronzeRing.position.y = 0.26;
        bronzeRing.rotation.x = Math.PI / 2;
        scene.add(bronzeRing);
        
        // Inner decorative ring
        const innerRingDeco = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.038, 128, 280), new THREE.MeshStandardMaterial({ color: 0xb87a4a, metalness: 0.68, roughness: 0.35 }));
        innerRingDeco.position.y = 0.24;
        innerRingDeco.rotation.x = Math.PI / 2;
        scene.add(innerRingDeco);
        
        // Stone pillars around altar
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3a3228, roughness: 0.72 });
        const pillarPos = [
            [-1.65, -0.52, -1.65], [1.65, -0.52, -1.65], [1.65, -0.52, 1.65], [-1.65, -0.52, 1.65],
            [-1.52, -0.52, 1.52], [1.52, -0.52, 1.52], [1.52, -0.52, -1.52], [-1.52, -0.52, -1.52]
        ];
        pillarPos.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.55, 0.32), pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });
        
        // Scattered ritual stones
        const debrisMat = new THREE.MeshStandardMaterial({ color: 0x4a3a32, roughness: 0.85 });
        for (let i = 0; i < 85; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.042 + Math.random() * 0.058), debrisMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 2.15 + Math.random() * 1.1;
            rock.position.x = Math.cos(angle) * rad;
            rock.position.z = Math.sin(angle) * rad;
            rock.position.y = -0.56 + Math.random() * 0.14;
            rock.scale.set(1, Math.random() * 0.5 + 0.4, 1);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        }
        
        // Crack details on altar surface
        const crackMat = new THREE.MeshStandardMaterial({ color: 0x18120c });
        for (let i = 0; i < 42; i++) {
            const crack = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.015, 0.07 + Math.random() * 0.12), crackMat);
            const angle = Math.random() * Math.PI * 2;
            const rad = 0.7 + Math.random() * 0.95;
            crack.position.x = Math.cos(angle) * rad;
            crack.position.z = Math.sin(angle) * rad;
            crack.position.y = 0.235;
            crack.rotation.z = Math.random() * Math.PI;
            crack.rotation.x = Math.random() * Math.PI;
            scene.add(crack);
        }
        
        // --------------------------------------------------------------
        // RING OF FIRE — Volumetric, Darker Ember Core
        // --------------------------------------------------------------
        const fireUniforms = {
            uTime: { value: 0 },
            uIntensity: { value: 1.08 },
            uColorCore: { value: new THREE.Color(0xb5421a) },
            uColorMid: { value: new THREE.Color(0xc95a2a) },
            uColorTip: { value: new THREE.Color(0xe07a42) }
        };
        
        const fireVS = `
            varying vec3 vPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vPosition = mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fireFS = `
            uniform float uTime;
            uniform vec3 uColorCore;
            uniform vec3 uColorMid;
            uniform vec3 uColorTip;
            uniform float uIntensity;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }
            
            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float n = mix(
                    mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
                    f.z);
                return n * 2.0 - 1.0;
            }
            
            void main() {
                vec3 pos = vPosition;
                float majorR = 1.02;
                float minorR = 0.165;
                float rho = length(pos.xz);
                float torusDist = abs(rho - majorR) - minorR;
                float distToSurface = abs(torusDist);
                float core = 1.0 - smoothstep(0.0, 0.25, distToSurface);
                
                float angle = atan(pos.z, pos.x);
                float flicker = 0.62 + 0.42 * sin(uTime * 10.5) + 0.18 * sin(uTime * 24.0);
                float turbulence = sin(angle * 6.5 + uTime * 8.0) * 0.18;
                float flow = noise3D(vec3(angle * 2.2, pos.y * 3.8, uTime * 1.8)) * 0.48;
                
                float density = core * (0.58 + flow * 0.52) * flicker + turbulence;
                float edgeGlow = 1.0 - smoothstep(0.02, 0.34, distToSurface);
                density *= (edgeGlow + 0.22);
                density = clamp(density * uIntensity, 0.0, 1.02);
                
                vec3 col = mix(uColorCore, uColorMid, density * 1.15);
                col = mix(col, uColorTip, pow(density, 1.35));
                float hotness = pow(core, 1.4) * (0.65 + flicker * 0.48);
                col += vec3(0.95, 0.42, 0.18) * hotness * 0.42;
                
                float alpha = density * (0.78 + flicker * 0.22);
                alpha = clamp(alpha, 0.0, 0.92);
                gl_FragColor = vec4(col, alpha);
            }
        `;
        
        const fireRingGeo = new THREE.TorusGeometry(1.02, 0.165, 260, 460);
        const fireMaterialShader = new THREE.ShaderMaterial({
            uniforms: fireUniforms,
            vertexShader: fireVS,
            fragmentShader: fireFS,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const fireRing = new THREE.Mesh(fireRingGeo, fireMaterialShader);
        fireRing.position.y = 0.27;
        scene.add(fireRing);
        
        // Inner molten core
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xc5522a, emissive: 0xb5421a, emissiveIntensity: 0.72, metalness: 0.18, roughness: 0.28 });
        const innerCore = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.082, 180, 380), coreMat);
        innerCore.position.y = 0.27;
        scene.add(innerCore);
        
        // --------------------------------------------------------------
        // 3D PARTICLES — Full Volumetric Space
        // --------------------------------------------------------------
        // Rising embers
        const emberCount = 3200;
        const emberGeo = new THREE.BufferGeometry();
        const emberPositions = new Float32Array(emberCount * 3);
        const emberVel = [];
        for (let i = 0; i < emberCount; i++) {
            const rad = 0.65 + Math.random() * 1.62;
            const ang = Math.random() * Math.PI * 2;
            emberPositions[i*3] = Math.cos(ang) * rad;
            emberPositions[i*3+2] = Math.sin(ang) * rad;
            emberPositions[i*3+1] = 0.1 + Math.random() * 1.55;
            emberVel.push({ speed: 0.22 + Math.random() * 0.82, rad, ang });
        }
        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
        const emberMat = new THREE.PointsMaterial({ color: 0xe57a3a, size: 0.019, blending: THREE.AdditiveBlending, transparent: true });
        const embers = new THREE.Points(emberGeo, emberMat);
        scene.add(embers);
        
        // Floating ash particles (drifting outward)
        const ashCount = 2600;
        const ashGeo = new THREE.BufferGeometry();
        const ashPositions = new Float32Array(ashCount * 3);
        for (let i = 0; i < ashCount; i++) {
            const rad = 0.8 + Math.random() * 2.2;
            const ang = Math.random() * Math.PI * 2;
            ashPositions[i*3] = Math.cos(ang) * rad;
            ashPositions[i*3+2] = Math.sin(ang) * rad;
            ashPositions[i*3+1] = 0.2 + Math.random() * 1.85;
        }
        ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPositions, 3));
        const ashMat = new THREE.PointsMaterial({ color: 0x7a5a42, size: 0.021, transparent: true, opacity: 0.32 });
        const ashSys = new THREE.Points(ashGeo, ashMat);
        scene.add(ashSys);
        
        // Spark particles
        const sparkCount = 4800;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPositions = new Float32Array(sparkCount * 3);
        for (let i = 0; i < sparkCount; i++) {
            const rad = 0.55 + Math.random() * 1.75;
            const ang = Math.random() * Math.PI * 2;
            sparkPositions[i*3] = Math.cos(ang) * rad;
            sparkPositions[i*3+2] = Math.sin(ang) * rad;
            sparkPositions[i*3+1] = 0.12 + Math.random() * 1.6;
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
        const sparkMat = new THREE.PointsMaterial({ color: 0xff8855, size: 0.008, blending: THREE.AdditiveBlending });
        const sparks = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparks);
        
        // Distant star particles (atmosphere)
        const distantStars = new THREE.BufferGeometry();
        const starPositions = new Float32Array(1800 * 3);
        for (let i = 0; i < 1800; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 180;
            starPositions[i*3+1] = (Math.random() - 0.5) * 60 + 15;
            starPositions[i*3+2] = (Math.random() - 0.5) * 90 - 45;
        }
        distantStars.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starPointsMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.07, transparent: true, opacity: 0.45 });
        const starField = new THREE.Points(distantStars, starPointsMat);
        scene.add(starField);
        
        // --------------------------------------------------------------
        // LIGHTING — Dramatic, Fire-Centric
        // --------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0x10141f, 0.32);
        scene.add(ambientLight);
        
        const backFillLight = new THREE.DirectionalLight(0x5a6c8a, 0.28);
        backFillLight.position.set(-2, 2.5, -3);
        scene.add(backFillLight);
        
        // Main fire light
        const fireLight = new THREE.PointLight(0xc5522a, 3.4, 12, 1.3);
        fireLight.position.set(0, 0.72, 0);
        fireLight.castShadow = true;
        fireLight.shadow.mapSize.width = 1024;
        fireLight.shadow.mapSize.height = 1024;
        fireLight.shadow.bias = -0.0002;
        scene.add(fireLight);
        
        // Flicker light
        const flickerLight = new THREE.PointLight(0xd96a32, 1.55, 9);
        flickerLight.position.set(0.24, 0.92, 0.32);
        scene.add(flickerLight);
        
        // Rim light
        const rimLight = new THREE.PointLight(0xa5421a, 0.85);
        rimLight.position.set(-0.55, 0.82, -1.15);
        scene.add(rimLight);
        
        // Under altar glow
        const underGlow = new THREE.PointLight(0x883322, 0.38);
        underGlow.position.set(0, -0.28, 0);
        scene.add(underGlow);
        
        // Volumetric heat haze
        const hazeSphere = new THREE.Mesh(new THREE.SphereGeometry(2.12, 56, 56), new THREE.MeshStandardMaterial({ color: 0xb5421a, emissive: 0x942a0a, emissiveIntensity: 0.12, transparent: true, opacity: 0.045 }));
        hazeSphere.position.y = 0.65;
        scene.add(hazeSphere);
        
        // --------------------------------------------------------------
        // ANIMATION
        // --------------------------------------------------------------
        let time = 0;
        
        function animate() {
            const elapsed = performance.now() / 1000;
            time = elapsed;
            
            // Fire shader
            fireUniforms.uTime.value = elapsed;
            fireUniforms.uIntensity.value = 1.05 + Math.sin(elapsed * 5.8) * 0.16;
            
            // Light flicker
            fireLight.intensity = 3.2 + Math.sin(elapsed * 10.5) * 1.0;
            flickerLight.intensity = 1.42 + Math.sin(elapsed * 12.8) * 0.68;
            rimLight.intensity = 0.78 + Math.sin(elapsed * 7.5) * 0.32;
            underGlow.intensity = 0.36 + Math.sin(elapsed * 2.2) * 0.08;
            
            // Inner core pulse
            innerCore.material.emissiveIntensity = 0.68 + Math.sin(elapsed * 7.8) * 0.42;
            
            // Ember animation (rising)
            const emberPosAttr = embers.geometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                let y = emberPosAttr[i*3+1];
                y += 0.0065 * emberVel[i].speed;
                if (y > 1.82) {
                    y = 0.08;
                    const newRad = 0.62 + Math.random() * 1.65;
                    const newAng = Math.random() * Math.PI * 2;
                    emberPosAttr[i*3] = Math.cos(newAng) * newRad;
                    emberPosAttr[i*3+2] = Math.sin(newAng) * newRad;
                    emberVel[i].rad = newRad;
                }
                emberPosAttr[i*3+1] = y;
            }
            embers.geometry.attributes.position.needsUpdate = true;
            
            // Rotating ash and sparks
            ashSys.rotation.y = elapsed * 0.035;
            sparks.rotation.y = elapsed * 0.065;
            starField.rotation.y = elapsed * 0.008;
            
            // Water uniforms
            waterUniforms.uTime.value = elapsed;
            waterUniforms.uCameraPosition.value.copy(camera.position);
            
            // Color grade time (for grain)
            colorGradePass.uniforms.uTime.value = elapsed;
            
            // Cinematic camera drift
            camera.position.x = Math.sin(elapsed * 0.045) * 0.035;
            camera.position.y = 1.70 + Math.sin(elapsed * 0.09) * 0.01;
            camera.lookAt(0, 0.88, 0);
            
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
