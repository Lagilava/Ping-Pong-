<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring of Water — Film VFX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
#hud {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(200,140,70,0.4); font: 10px/1 'Courier New', monospace;
    letter-spacing: 0.4em; text-transform: uppercase; pointer-events: none; white-space: nowrap;
}
#loader {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 99;
    transition: opacity 1s ease 0.4s;
}
#loader span { color: #c87840; font: 11px/1 'Courier New', monospace; letter-spacing: 0.5em; }
#loader .bar { width: 140px; height: 1px; background: rgba(200,120,60,0.2); }
#loader .fill { height: 1px; background: #c87840; width: 0; transition: width 0.3s; }
</style>
</head>
<body>
<div id="loader">
    <span>RING OF WATER &nbsp;·&nbsp; FILM VFX</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<div id="hud">✦ &nbsp; HYDRO WAVE RING &nbsp;·&nbsp; FILM VFX &nbsp; ✦</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function waitForThree() {
    if (typeof THREE === 'undefined') { setTimeout(waitForThree, 50); return; }
    main();
})();

// ─── ORIGINAL PADDLE HELPERS ──────────────────────────────────────────────────
function createAIPaddleCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
}

function drawRoundRect(ctx, x, y, width, height, radius) {
    let left = x, top = y, w = width, h = height;
    if (w < 0) { left += w; w = Math.abs(w); }
    if (h < 0) { top += h; h = Math.abs(h); }
    radius = Math.max(0, radius || 0);
    radius = Math.min(radius, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(left + radius, top);
    ctx.lineTo(left + w - radius, top);
    ctx.arcTo(left + w, top, left + w, top + radius, radius);
    ctx.lineTo(left + w, top + h - radius);
    ctx.arcTo(left + w, top + h, left + w - radius, top + h, radius);
    ctx.lineTo(left + radius, top + h);
    ctx.arcTo(left, top + h, left, top + h - radius, radius);
    ctx.lineTo(left, top + radius);
    ctx.arcTo(left, top, left + radius, top, radius);
    ctx.closePath();
}

function drawHex(ctx, x, y, size) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i + 0.1;
        const hx = x + Math.cos(angle) * size;
        const hy = y + Math.sin(angle) * size * 0.9;
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.stroke();
}

function drawAllSpark(ctx, x, y, size, primaryColor, secondaryColor) {
    const time = Date.now() * 0.001;
    const points = 8;
    const pulsate = Math.sin(time * 6) * 0.5 + 0.5;
    const animatedSize = size * (0.9 + pulsate * 0.1);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(time);
    ctx.beginPath();
    for (let i = 0; i < points; i++) {
        const angle1 = (i * 2) * Math.PI / points;
        const angle2 = (i * 2 + 1) * Math.PI / points;
        const x1 = Math.cos(angle1) * animatedSize;
        const y1 = Math.sin(angle1) * animatedSize * 1.2;
        const x2 = Math.cos(angle2) * animatedSize * 0.6;
        const y2 = Math.sin(angle2) * animatedSize * 0.6 * 1.2;
        ctx.lineTo(x1, y1);
        const controlX = Math.cos((angle1 + Math.PI / points)) * animatedSize * 0.8;
        const controlY = Math.sin((angle1 + Math.PI / points)) * animatedSize * 0.8 * 1.2;
        ctx.quadraticCurveTo(controlX, controlY, x2, y2);
    }
    ctx.closePath();
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, animatedSize);
    gradient.addColorStop(0, '#FFFFFF');
    gradient.addColorStop(0.1, '#FFD700');
    gradient.addColorStop(0.3, secondaryColor);
    gradient.addColorStop(0.6, primaryColor + 'AA');
    gradient.addColorStop(1, primaryColor + '00');
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < 4; i++) {
        const sparkAngle = time * 2 + i * Math.PI / 2;
        const sparkLength = animatedSize * (0.3 + Math.random() * 0.2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(sparkAngle) * sparkLength, Math.sin(sparkAngle) * sparkLength);
        ctx.stroke();
    }
    ctx.restore();
}

function hexToRgb(hex) {
    const color = hex.replace('#', '');
    const r = parseInt(color.substr(0, 2), 16);
    const g = parseInt(color.substr(2, 2), 16);
    const b = parseInt(color.substr(4, 2), 16);
    return { r, g, b };
}

function colorWithAlpha(color, alpha) {
    if (!color) return `rgba(255,255,255,${alpha})`;
    if (typeof color !== 'string') return color;
    if (color.startsWith('rgba(')) return color.replace(/rgba\(([^)]+),\s*[\d.]+\)/, `rgba($1, ${alpha})`);
    if (color.startsWith('rgb(')) return color.replace(/^rgb\(([^)]+)\)$/, `rgba($1, ${alpha})`);
    if (color.startsWith('#')) {
        const rgb = hexToRgb(color);
        return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    }
    return color;
}

function renderPlayerPaddleToCanvas(canvas, time) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const w = W, h = H;
    const halfW = w / 2, halfH = h / 2;
    const pulse = Math.sin(time * 6) * 0.5 + 0.5;
    const pulseIntensity = Math.sin(time * 10) * 0.3 + 0.7;
    const transformPulse = Math.sin(time * 4) * 0.15 + 0.5;
    const primaryColor = '#00ffd6';
    const secondaryColor = 'rgb(0, 255, 255)';
    ctx.save();
    ctx.translate(halfW, halfH);
    ctx.fillStyle = '#0D0D14';
    drawRoundRect(ctx, -w / 2, -h / 2, w, h, 3);
    ctx.fill();
    ctx.fillStyle = '#1C1C26';
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h / 2);
    ctx.lineTo(w / 2 * 0.9, -h / 2 + h * 0.25);
    ctx.lineTo(w / 2 * 0.9, h / 2 - h * 0.25);
    ctx.lineTo(-w / 2, h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w / 2, -h / 2);
    ctx.lineTo(-w / 2 * 0.9, -h / 2 + h * 0.25);
    ctx.lineTo(-w / 2 * 0.9, h / 2 - h * 0.25);
    ctx.lineTo(w / 2, h / 2);
    ctx.closePath();
    ctx.fill();
    const hexAlpha = Math.floor(pulse * 128 + 64).toString(16).padStart(2, '0');
    ctx.strokeStyle = primaryColor + hexAlpha;
    ctx.lineWidth = 1.5;
    const hexSize = 16 + Math.sin(time * 3) * 2;
    for (let y = -h / 2 + hexSize; y < h / 2; y += hexSize * 1.5) {
        for (let x = -w / 2 + hexSize; x < w / 2; x += hexSize * 2) {
            const offset = (Math.floor((y + hexSize) / (hexSize * 1.5)) % 2) * hexSize;
            drawHex(ctx, x + offset, y, hexSize * 0.85);
        }
    }
    const coreScale = 1 + transformPulse * 0.6 + Math.sin(time * 8) * 0.1;
    drawAllSpark(ctx, 0, 0, w * 0.35 * coreScale, primaryColor, secondaryColor);
    ctx.strokeStyle = secondaryColor;
    ctx.lineWidth = 3 + transformPulse * 12;
    ctx.globalAlpha = 0.7 + pulse * 0.3;
    ctx.strokeRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12);
    ctx.globalAlpha = 1;
    const topLight = ctx.createLinearGradient(0, -h / 2, 0, -h / 2 + 30);
    topLight.addColorStop(0, colorWithAlpha(secondaryColor, 1));
    topLight.addColorStop(1, colorWithAlpha(secondaryColor, 0));
    ctx.fillStyle = topLight;
    ctx.fillRect(-w / 2, -h / 2, w, 30);
    const bottomLight = ctx.createLinearGradient(0, h / 2, 0, h / 2 - 30);
    bottomLight.addColorStop(0, colorWithAlpha(secondaryColor, 1));
    bottomLight.addColorStop(1, colorWithAlpha(secondaryColor, 0));
    ctx.fillStyle = bottomLight;
    ctx.fillRect(-w / 2, h / 2 - 30, w, 30);
    ctx.restore();
}

// ─── GEOMETRY HELPERS ─────────────────────────────────────────────────────────
function deformOrganicGeometry(geometry, strength, seed) {
    const position = geometry.attributes.position;
    if (!position) return geometry;
    const offset = seed || 0;
    for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const y = position.getY(i);
        const z = position.getZ(i);
        const ripple = (
            Math.sin(x * 7.1 + offset) +
            Math.cos(y * 5.7 - offset * 1.3) +
            Math.sin(z * 6.4 + offset * 0.7)
        ) / 3;
        const taper = 1.0 + ripple * strength;
        position.setX(i, x * taper);
        position.setY(i, y * (1.0 + ripple * strength * 0.55));
        position.setZ(i, z * taper);
    }
    geometry.computeVertexNormals();
    return geometry;
}

// ─── OCTOPUS SURFACE SHADERS (ORIGINAL) ──────────────────────────────────────
function applyOctopusSurfaceDetail(material, config) {
    const detail = Object.assign({
        scale: 7.5, contrast: 0.08,
        tintA: new THREE.Color(0x584235), tintB: new THREE.Color(0xb18a6e), lift: 0.03
    }, config || {});
    material.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOctopusLocalPos;')
            .replace('#include <begin_vertex>','#include <begin_vertex>\nvOctopusLocalPos = transformed;');
        shader.fragmentShader = shader.fragmentShader.replace('#include <common>',
            `#include <common>\nvarying vec3 vOctopusLocalPos;\nfloat octopusHash(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }\nfloat octopusNoise(vec3 p){ vec3 i=floor(p); vec3 f=fract(p); f=f*f*(3.0-2.0*f); float n000=octopusHash(i); float n100=octopusHash(i+vec3(1.0,0.0,0.0)); float n010=octopusHash(i+vec3(0.0,1.0,0.0)); float n110=octopusHash(i+vec3(1.0,1.0,0.0)); float n001=octopusHash(i+vec3(0.0,0.0,1.0)); float n101=octopusHash(i+vec3(1.0,0.0,1.0)); float n011=octopusHash(i+vec3(0.0,1.0,1.0)); float n111=octopusHash(i+vec3(1.0,1.0,1.0)); float nx00=mix(n000,n100,f.x); float nx10=mix(n010,n110,f.x); float nx01=mix(n001,n101,f.x); float nx11=mix(n011,n111,f.x); float nxy0=mix(nx00,nx10,f.y); float nxy1=mix(nx01,nx11,f.y); return mix(nxy0,nxy1,f.z); }`)
            .replace('#include <dithering_fragment>',
            `#include <dithering_fragment>\nfloat octMottle = octopusNoise(vOctopusLocalPos * ${detail.scale.toFixed(2)}) * 0.5 + 0.5;\noctMottle = smoothstep(0.18, 0.86, octMottle);\nvec3 octTint = mix(vec3(${detail.tintA.r.toFixed(3)}, ${detail.tintA.g.toFixed(3)}, ${detail.tintA.b.toFixed(3)}), vec3(${detail.tintB.r.toFixed(3)}, ${detail.tintB.g.toFixed(3)}, ${detail.tintB.b.toFixed(3)}), octMottle);\ngl_FragColor.rgb *= mix(vec3(1.0), octTint, ${detail.contrast.toFixed(3)});\ngl_FragColor.rgb += octMottle * ${detail.lift.toFixed(3)};`);
    };
    material.customProgramCacheKey = () => 'octopus-surface-detail:' + detail.scale + ':' + detail.contrast + ':' + detail.lift;
    material.needsUpdate = true;
    return material;
}

function applyOctopusCupDetail(material) {
    material.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOctopusCupPos;')
            .replace('#include <begin_vertex>','#include <begin_vertex>\nvOctopusCupPos = transformed;');
        shader.fragmentShader = shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vOctopusCupPos;')
            .replace('#include <dithering_fragment>',
            `#include <dithering_fragment>\nfloat cupR = length(vOctopusCupPos.xz);\nfloat cupCenter = 1.0 - smoothstep(0.0, 0.018, cupR);\nfloat cupRing = smoothstep(0.010, 0.017, cupR) - smoothstep(0.017, 0.024, cupR);\nfloat cupBelly = smoothstep(-0.018, 0.010, -vOctopusCupPos.y);\ngl_FragColor.rgb *= mix(vec3(1.0), vec3(0.78, 0.70, 0.62), cupCenter * 0.65 + cupBelly * 0.10);\ngl_FragColor.rgb += vec3(0.05, 0.03, 0.02) * cupRing * 0.8;`);
    };
    material.customProgramCacheKey = () => 'octopus-cup-shading';
    material.needsUpdate = true;
    return material;
}

// ─── OCTOPUS (ORIGINAL FULL QUALITY) ─────────────────────────────────────────
function buildOctopus(scene, index) {
    const root = new THREE.Group();
    const eyeGroups = [];

    const skinMat = new THREE.MeshPhysicalMaterial({
        color: 0x7a5c4c, roughness: 0.82, metalness: 0.0,
        clearcoat: 0.14, clearcoatRoughness: 0.78, reflectivity: 0.18,
        emissive: 0x050403, emissiveIntensity: 0.02, fog: true, flatShading: false
    });
    skinMat.userData.aoIntensity = 0.70;
    applyOctopusSurfaceDetail(skinMat, { scale: 8.4, contrast: 0.10, tintA: new THREE.Color(0x5a4337), tintB: new THREE.Color(0x9d7a64), lift: 0.018 });

    const papillaMat = new THREE.MeshPhysicalMaterial({
        color: 0x6d4a3d, roughness: 0.92, metalness: 0.0,
        clearcoat: 0.04, clearcoatRoughness: 0.92, reflectivity: 0.12,
        emissive: 0x040302, emissiveIntensity: 0.01, fog: true, flatShading: false
    });
    applyOctopusSurfaceDetail(papillaMat, { scale: 12.0, contrast: 0.08, tintA: new THREE.Color(0x51372d), tintB: new THREE.Color(0x8c6952), lift: 0.010 });

    const mantleInnerMat = new THREE.MeshPhysicalMaterial({
        color: 0x3d231c, roughness: 0.96, metalness: 0.0, clearcoat: 0.0, reflectivity: 0.08,
        transparent: true, opacity: 0.22, emissive: 0x000000, emissiveIntensity: 0.0,
        side: THREE.BackSide, fog: true, flatShading: false
    });

    const suctionMat = new THREE.MeshPhysicalMaterial({
        color: 0xe5d3b8, roughness: 0.74, metalness: 0.0,
        clearcoat: 0.05, clearcoatRoughness: 0.9, reflectivity: 0.12,
        emissive: 0x000000, emissiveIntensity: 0.0, fog: true, flatShading: false
    });
    applyOctopusSurfaceDetail(suctionMat, { scale: 10.0, contrast: 0.05, tintA: new THREE.Color(0xcbb89f), tintB: new THREE.Color(0xe7d8c6), lift: 0.006 });
    applyOctopusCupDetail(suctionMat);

    const eyeMat = new THREE.MeshPhysicalMaterial({
        color: 0x1d150f, roughness: 0.22, metalness: 0.0,
        clearcoat: 0.16, clearcoatRoughness: 0.12, reflectivity: 0.38,
        emissive: 0x000000, emissiveIntensity: 0.0, flatShading: false, fog: true
    });
    eyeMat.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOctopusEyePos;')
            .replace('#include <begin_vertex>','#include <begin_vertex>\nvOctopusEyePos = transformed;');
        shader.fragmentShader = shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vOctopusEyePos;')
            .replace('#include <dithering_fragment>',
            `#include <dithering_fragment>\nfloat eyeUpperShadow = smoothstep(-0.015, 0.055, vOctopusEyePos.y);\nfloat eyeLimbal = smoothstep(0.015, 0.040, length(vOctopusEyePos.xy));\nfloat eyeCore = 1.0 - smoothstep(0.0, 0.028, length(vOctopusEyePos.xy));\ngl_FragColor.rgb *= mix(vec3(1.0), vec3(0.72, 0.78, 0.80), eyeUpperShadow * 0.45);\ngl_FragColor.rgb *= mix(vec3(1.06), vec3(0.84), eyeLimbal * 0.55);\ngl_FragColor.rgb += vec3(0.028, 0.020, 0.014) * eyeCore * (1.0 - eyeUpperShadow * 0.8);`);
    };
    eyeMat.customProgramCacheKey = () => 'octopus-eye-shading';
    eyeMat.needsUpdate = true;

    const pupilMat = new THREE.MeshPhysicalMaterial({
        color: 0x050505, roughness: 0.06, metalness: 0.0, clearcoat: 0.0,
        reflectivity: 0.08, emissive: 0x000000, emissiveIntensity: 0.0, flatShading: false, fog: true
    });

    // Mantle
    const mantleGeo = new THREE.SphereGeometry(0.32, 32, 24);
    const mantlePos = mantleGeo.attributes.position;
    for (let i = 0; i < mantlePos.count; i++) {
        const x = mantlePos.getX(i), y = mantlePos.getY(i), z = mantlePos.getZ(i);
        const taper = 1.15 + Math.max(0, y) * 0.72 - Math.pow(Math.max(0, -y), 1.5) * 0.2;
        const width = 0.92 + Math.max(0, -y) * 0.22 + Math.sin(y*4) * 0.05;
        mantlePos.setY(i, y * taper); mantlePos.setX(i, x * width); mantlePos.setZ(i, z * width);
    }
    mantleGeo.computeVertexNormals();
    const mantle = new THREE.Mesh(mantleGeo, skinMat);
    mantle.position.y = 0.28; root.add(mantle);

    const mantleInner = new THREE.Mesh(new THREE.SphereGeometry(0.27, 28, 20), mantleInnerMat);
    mantleInner.position.y = 0.26; mantleInner.scale.set(0.94, 0.88, 0.94); root.add(mantleInner);

    const mantleRimMat = new THREE.MeshStandardMaterial({
        color: 0x6c3420, roughness: 0.50, metalness: 0.05, transparent: true, opacity: 0.68,
        emissive: 0x5a3a1a, emissiveIntensity: 0.12, fog: true
    });
    const mantleRim = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.016, 12, 30), mantleRimMat);
    mantleRim.rotation.x = Math.PI / 2; mantleRim.position.y = 0.12; root.add(mantleRim);

    // Papillae (instanced)
    const papillaGeo = new THREE.SphereGeometry(0.008, 6, 4);
    const papillaCount = 120;
    const papillaInstances = new THREE.InstancedMesh(papillaGeo, papillaMat, papillaCount);
    const papillaData = [];
    for (let i = 0; i < papillaCount; i++) {
        const a = Math.random() * Math.PI * 2, e = (Math.random() - 0.45) * Math.PI, r = 0.28 + Math.random() * 0.02;
        const x = Math.cos(e) * Math.cos(a) * r * 1.05, y = 0.26 + Math.sin(e) * 0.42, z = Math.cos(e) * Math.sin(a) * r * 1.05;
        const sx = 1.0 + Math.random() * 0.18, sy = 0.5 + Math.random() * 0.12, sz = 1.0 + Math.random() * 0.16;
        const matrix = new THREE.Matrix4();
        matrix.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz));
        papillaInstances.setMatrixAt(i, matrix);
        papillaData.push({ x, y, z, sx, sy, sz, hueShift: Math.random() * 0.12 });
    }
    papillaInstances.instanceMatrix.needsUpdate = true;
    root.add(papillaInstances);

    // Chromatophores (instanced)
    const chromGeo = new THREE.SphereGeometry(0.005, 5, 4);
    const chromCount = 60;
    const chromMat = new THREE.MeshStandardMaterial({
        color: 0x8a6a2a, roughness: 0.75, metalness: 0.04,
        emissive: 0x5a4518, emissiveIntensity: 0.10, transparent: true, opacity: 0.88, fog: true
    });
    const chromInstances = new THREE.InstancedMesh(chromGeo, chromMat, chromCount);
    const chromData = [];
    for (let i = 0; i < chromCount; i++) {
        const angle = Math.random() * Math.PI * 2, radius = 0.12 + Math.random() * 0.24;
        const height = 0.08 + Math.random() * 0.44, scale = 0.9 + Math.random() * 1.5;
        const matrix = new THREE.Matrix4();
        matrix.compose(new THREE.Vector3(Math.cos(angle)*radius, height, Math.sin(angle)*radius), new THREE.Quaternion(), new THREE.Vector3(scale,scale,scale));
        chromInstances.setMatrixAt(i, matrix);
        chromData.push({ angle, radius, height, scale, phase: Math.random()*Math.PI*2, pulse: 0.8+Math.random()*0.8, hueShift: Math.random()*0.12, lift: 0.7+Math.random()*0.5 });
    }
    chromInstances.instanceMatrix.needsUpdate = true;
    root.add(chromInstances);

    // Webbing
    const webSegments = 32;
    const webGeo = new THREE.CylinderGeometry(0.18, 0.42, 0.22, webSegments, 6, true);
    const webColors = [];
    const webPos = webGeo.attributes.position;
    for (let i = 0; i < webPos.count; i++) {
        const x = webPos.getX(i), z = webPos.getZ(i);
        const angle = Math.atan2(z, x);
        const armInfluence = Math.abs(Math.sin(angle * 4));
        const sag = 1.0 + Math.pow(armInfluence, 2) * 0.15;
        webPos.setX(i, x * sag); webPos.setZ(i, z * sag);
        if (webPos.getY(i) < 0) webPos.setY(i, webPos.getY(i) * 1.15);
        const normalizedRadius = Math.sqrt(x*x + z*z);
        const aoFalloff = 0.3 + normalizedRadius * 0.6;
        const valleyOcclusion = (1.0 - armInfluence) * 0.2;
        const aoValue = Math.max(0.35, Math.min(0.95, aoFalloff - valleyOcclusion));
        webColors.push(aoValue, aoValue, aoValue);
    }
    webGeo.setAttribute('color', new THREE.Float32BufferAttribute(webColors, 3));
    webGeo.computeVertexNormals();
    const webMat = new THREE.MeshStandardMaterial({
        color: 0x8a4a2a, roughness: 0.42, metalness: 0.05,
        emissive: 0x5a3a1a, emissiveIntensity: 0.18, vertexColors: true, fog: true
    });
    applyOctopusSurfaceDetail(webMat, { scale: 6.8, contrast: 0.06, tintA: new THREE.Color(0x52352b), tintB: new THREE.Color(0x9c7357), lift: 0.012 });
    const webMesh = new THREE.Mesh(webGeo, webMat);
    webMesh.position.y = 0.08; root.add(webMesh);

    // Eyes
    [-1, 1].forEach(side => {
        const eyeGroup = new THREE.Group();
        eyeGroup.position.set(side * 0.17, 0.26, 0.22); root.add(eyeGroup);
        const socket = new THREE.Mesh(new THREE.SphereGeometry(0.065, 20, 14), skinMat);
        socket.scale.set(1.1, 0.8, 1); eyeGroup.add(socket);
        const lid = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.005, 8, 18), papillaMat);
        lid.rotation.x = Math.PI / 2; lid.position.z = 0.006; eyeGroup.add(lid);
        const eyeball = new THREE.Mesh(new THREE.SphereGeometry(0.048, 20, 14), eyeMat);
        eyeball.position.z = 0.01; eyeGroup.add(eyeball);
        const irisRing = new THREE.Mesh(new THREE.RingGeometry(0.020, 0.033, 24, 1),
            new THREE.MeshPhysicalMaterial({ color: 0x715539, roughness: 0.52, metalness: 0.0, clearcoat: 0.05, clearcoatRoughness: 0.28, reflectivity: 0.22, fog: true, side: THREE.DoubleSide }));
        irisRing.position.z = 0.014; eyeGroup.add(irisRing);
        const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.054, 20, 14),
            new THREE.MeshPhysicalMaterial({ color: 0xf8f6f2, transparent: true, opacity: 0.14, roughness: 0.04, metalness: 0.0, clearcoat: 0.65, clearcoatRoughness: 0.08, reflectivity: 0.9, fog: true }));
        cornea.position.z = 0.008; eyeGroup.add(cornea);
        const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.014, 0.01), pupilMat);
        pupil.position.z = 0.045; eyeGroup.add(pupil);
        eyeGroup.userData = { pupil }; eyeGroups.push(eyeGroup);
    });

    // Siphon
    const siphonGroup = new THREE.Group();
    siphonGroup.position.set(0.14, 0.12, 0.18);
    siphonGroup.rotation.set(0.2, 0.4, 0.1); root.add(siphonGroup);
    const siphon = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 0.16, 16, 1, true), skinMat);
    siphonGroup.add(siphon);

    // 8 Arms
    const arms = [];
    for (let a = 0; a < 8; a++) {
        const armAngle = (a / 8) * Math.PI * 2;
        const armSegments = 14;
        const thicknessBias = 0.86 + Math.random() * 0.20;
        const surfaceBias = Math.random() * 0.08;
        const armGroup = new THREE.Group();
        armGroup.position.y = 0.02; root.add(armGroup);
        const segments = [];
        let prevSeg = armGroup;
        for (let s = 0; s < armSegments; s++) {
            const segGroup = new THREE.Group();
            const progress = s / armSegments;
            const segLen = 0.095 * (1 - progress * 0.42) * (0.98 + surfaceBias * 0.12);
            const segR = 0.038 * Math.pow(1 - progress, 0.82 + surfaceBias * 0.9) * thicknessBias;
            const segMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(Math.max(0.005, segR*0.9), Math.max(0.006, segR), segLen, 12), skinMat);
            segMesh.rotation.z = Math.PI / 2; segMesh.position.x = segLen * 0.5;
            segMesh.scale.y = 0.95 + progress * 0.08; segGroup.add(segMesh);
            if (s < armSegments - 1) {
                const sSize = Math.max(0.0032, segR * (0.34 + (1.0 - progress) * 0.10));
                [-1, 0, 1].forEach(row => {
                    const sucker = new THREE.Mesh(
                        new THREE.SphereGeometry(row === 0 ? sSize * 0.8 : sSize, 8, 6), suctionMat);
                    sucker.scale.y = 0.28;
                    sucker.position.set(segLen * 0.4, -segR * 0.94, row * segR * (0.30 + progress * 0.08));
                    segGroup.add(sucker);
                });
            }
            segGroup.position.x = s === 0 ? 0.18 : (segments[s-1].children[0].geometry.parameters.height || 0.08);
            prevSeg.add(segGroup); prevSeg = segGroup; segments.push(segGroup);
        }
        const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.009, 0.04, 6, 1, false), skinMat);
        tip.rotation.z = Math.PI / 2; tip.position.x = 0.04; prevSeg.add(tip);
        const tipCap = new THREE.Mesh(new THREE.SphereGeometry(0.0042, 8, 6),
            new THREE.MeshPhysicalMaterial({ color: 0x341f19, roughness: 0.88, metalness: 0.0, fog: true }));
        tipCap.position.x = 0.062; prevSeg.add(tipCap);
        armGroup.rotation.y = armAngle; armGroup.rotation.x = 0.35;
        arms.push({ group: armGroup, segments, angle: armAngle, motionSeed: Math.random()*Math.PI*2,
            waveRate: 0.72+Math.random()*0.55, curlRate: 0.88+Math.random()*0.42,
            probeBias: 0.15+Math.random()*0.85, retractBias: 0.12+Math.random()*0.6,
            thicknessBias, tipBias: 0.82+Math.random()*0.18, surfaceBias });
    }

    const spawnAngle = (index / 5) * Math.PI * 2 + Math.random() * 0.34;
    const spawnRadius = 4.8 + Math.random() * 0.95;
    root.position.set(Math.cos(spawnAngle)*spawnRadius, -0.25+Math.sin(spawnAngle*0.5)*0.05, Math.sin(spawnAngle)*spawnRadius);
    root.rotation.y = Math.random() * Math.PI * 2;
    scene.add(root);

    return {
        root, mantle, mantleInner, webMesh, arms, siphon, chromatophores: chromData, eyeGroups,
        phase: Math.random()*Math.PI*2, skinMat, eyeMat, siphonGroup, mantleRim,
        papillaMat, chromMat, papillaInstances, chromInstances, papillaData,
        colorPhase: 0,
        crawlOffset: { x: root.position.x, y: root.position.y, z: root.position.z },
        crawlAngle: Math.random()*Math.PI*2, crawlSpeed: 0.018+Math.random()*0.01,
        crawlRadius: 1.45+Math.random()*0.55, altarCenterX: 0, altarCenterZ: 0, altarRadius: 2.95,
        behavior: index % 4, armPhaseOffset: Math.random()*Math.PI*2,
        pulseRate: 1.15+Math.random()*0.6, swimBias: 0.18+Math.random()*0.22,
        hoverBias: 0.04+Math.random()*0.06, gaitScale: 0.82+Math.random()*0.42,
        bodyLag: 0.08+Math.random()*0.08, armLead: 0.55+Math.random()*0.55,
        tentacleSpread: 0.85+Math.random()*0.28, mantleRipple: 0.6+Math.random()*0.45,
        eyeBlinkRate: 1.8+Math.random()*0.9, papillaPhase: Math.random()*Math.PI*2,
        chromatophorePhase: Math.random()*Math.PI*2, collisionRadius: 1.15+Math.random()*0.18,
    };
}

function animateOctopus(oct, t, dt) {
    const d = oct;
    const style = d.behavior || 0;
    const motionSeed = d.armPhaseOffset + d.phase * 0.37;
    d.crawlAngle += dt * d.crawlSpeed * d.gaitScale;
    const orbit = d.crawlAngle + d.phase;
    const crawlR = d.crawlRadius;
    const wanderX = Math.sin(orbit * 0.72 + motionSeed) * (0.05 + d.swimBias * 0.16);
    const wanderZ = Math.cos(orbit * 0.66 - motionSeed) * (0.04 + d.swimBias * 0.12);
    const leadPulse = Math.sin(orbit * 0.52 + d.phase) * (0.018 + d.hoverBias * 0.10);
    d.root.position.x = d.crawlOffset.x + Math.cos(orbit) * crawlR + wanderX;
    d.root.position.z = d.crawlOffset.z + Math.sin(orbit) * crawlR + wanderZ;
    d.root.position.y = d.crawlOffset.y + Math.sin(orbit * 0.46 + d.phase) * (0.02 + d.hoverBias * 0.08) + leadPulse * 0.12;
    const dx = d.root.position.x - d.altarCenterX, dz = d.root.position.z - d.altarCenterZ;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < d.altarRadius) {
        const safeDist = d.altarRadius + 0.12, inv = dist > 0.0001 ? 1/dist : 0;
        d.root.position.x = d.altarCenterX + (dist > 0.0001 ? dx*inv*safeDist : safeDist);
        d.root.position.z = d.altarCenterZ + (dist > 0.0001 ? dz*inv*safeDist : 0);
        d.crawlAngle += dt * 0.85;
    }
    d.root.rotation.y = d.crawlAngle + Math.PI;
    d.root.rotation.x = Math.sin(orbit * 0.33 + d.phase) * (0.01 + d.bodyLag * 0.07);

    const breathPhase = t * d.pulseRate + d.phase;
    const breathe = 1.0 + Math.sin(breathPhase) * (0.028 + style * 0.004) * d.gaitScale;
    d.mantle.scale.set(1+(breathe-1)*0.65, 1+(breathe-1)*0.5, 1+(breathe-1)*0.65);
    d.mantle.rotation.x = Math.sin(breathPhase * 0.28) * (0.008 + d.bodyLag * 0.04);
    d.mantleInner.scale.set(0.92+(breathe-1)*0.35, 0.90+(breathe-1)*0.28, 0.92+(breathe-1)*0.35);
    d.mantleRim.rotation.z = Math.sin(breathPhase * 0.34 + motionSeed) * 0.05;

    d.arms.forEach((arm, a) => {
        const armSeed = arm.motionSeed || 0;
        const armPhase = t * (arm.waveRate * 0.72) + a * (Math.PI*2/8) + d.phase + d.armPhaseOffset + armSeed;
        const armProbe = Math.max(0, Math.sin(armPhase * 0.24 + armSeed + d.phase)) * (arm.probeBias || 0.5) * 0.55;
        const armRetract = Math.max(0, Math.sin(armPhase * 0.16 + armSeed * 0.7 + 1.2)) * (arm.retractBias || 0.3) * 0.45;
        const armSplay = 0.14 + Math.sin(armPhase * 0.11 + a + armSeed) * 0.014 + d.tentacleSpread * 0.02;
        arm.group.rotation.x = armSplay + Math.sin(armPhase * 0.22) * 0.03;
        arm.group.rotation.z = Math.cos(armPhase * 0.20) * (0.025 + d.tentacleSpread * 0.02);
        arm.segments.forEach((seg, s) => {
            const reach = s / Math.max(1, arm.segments.length - 1);
            const wavePhase = armPhase * (arm.waveRate || 1) - s * 0.18;
            const curl = Math.sin(wavePhase) * (0.05 + reach * 0.08) * d.tentacleSpread;
            const twist = Math.cos(wavePhase * 0.48) * (0.04 + reach * 0.04);
            const lift = Math.sin(wavePhase * 0.34 + armSeed) * (0.012 + reach * 0.020);
            const probeCurl = armProbe * (0.02 + reach * 0.02);
            seg.rotation.z = curl; seg.rotation.y = twist; seg.rotation.x = lift + probeCurl;
        });
    });

    d.siphonGroup.rotation.x = 0.18 + Math.sin(t * 0.9 + d.phase) * 0.02;
    d.siphonGroup.rotation.y = 0.35 + Math.cos(t * 0.8 + d.phase) * 0.03;

    d.colorPhase += dt * 0.22;
    const colorPulse = Math.sin(d.colorPhase + motionSeed);
    const contrastPulse = Math.max(0, Math.sin(breathPhase * 1.7 + d.chromatophorePhase));
    const skinHue = 0.055 + colorPulse * 0.003;
    const skinSat = 0.28 + contrastPulse * 0.10;
    const skinLit = 0.18 + Math.sin(breathPhase * 0.24 + d.phase) * 0.03;
    d.skinMat.color.setHSL(skinHue, skinSat, skinLit);
    d.skinMat.emissive.setHSL(skinHue + 0.02, skinSat * 0.45, 0.03);
    d.skinMat.emissiveIntensity = 0.02 + contrastPulse * 0.015;

    if (d.papillaInstances && d.papillaData) {
        const pm = new THREE.Matrix4(), pp = new THREE.Vector3(), ps = new THREE.Vector3(), pq = new THREE.Quaternion();
        d.papillaData.forEach((p, i) => {
            const localPulse = Math.sin(breathPhase * 0.72 + p.x * 4.0 + p.z * 3.5 + i * 0.05 + d.papillaPhase);
            const lift = 1.0 + localPulse * 0.02;
            pp.set(p.x, p.y + localPulse * 0.008, p.z);
            ps.set(p.sx * lift, p.sy * 0.96, p.sz * lift);
            pm.compose(pp, pq, ps);
            d.papillaInstances.setMatrixAt(i, pm);
        });
        d.papillaInstances.instanceMatrix.needsUpdate = true;
    }

    if (d.chromInstances && d.chromatophores) {
        const cm = new THREE.Matrix4(), cp = new THREE.Vector3(), cs = new THREE.Vector3(), cq = new THREE.Quaternion();
        d.chromatophores.forEach((ch, i) => {
            const ringWave = Math.sin(breathPhase * ch.pulse * 0.62 + ch.phase + d.chromatophorePhase + i * 0.05);
            const ripple = Math.sin(d.colorPhase * 1.0 + ch.angle * 2.0 + ch.height * 3.0);
            const textureDrive = 0.55 + 0.45 * Math.max(0, ringWave);
            const radius = ch.radius * (1.0 + ripple * 0.02);
            cp.set(Math.cos(ch.angle)*radius, ch.height + Math.sin(ripple+ch.phase)*0.010*ch.lift, Math.sin(ch.angle)*radius);
            cs.setScalar(ch.scale * (0.84 + textureDrive * 0.22));
            cm.compose(cp, cq, cs);
            d.chromInstances.setMatrixAt(i, cm);
        });
        d.chromInstances.instanceMatrix.needsUpdate = true;
        d.chromMat.color.setHSL(skinHue + 0.02, skinSat * 0.85, 0.28 + contrastPulse * 0.12);
        d.chromMat.emissive.setHSL(skinHue + 0.06, 0.75, 0.12);
        d.chromMat.emissiveIntensity = 0.02 + contrastPulse * 0.04;
    }

    if (d.webMesh && d.webMesh.material) {
        d.webMesh.material.emissiveIntensity = 0.04 + contrastPulse * 0.02;
        d.webMesh.rotation.z = Math.sin(t * 0.9 + d.phase) * 0.02;
    }

    d.eyeGroups.forEach((eyeGroup, i) => {
        eyeGroup.position.y = 0.26 + Math.sin(t * 0.8 + d.phase + i) * 0.003;
        const pupil = eyeGroup.userData && eyeGroup.userData.pupil;
        if (pupil) pupil.position.z = 0.045 + Math.sin(t * 1.2 + d.phase + i) * 0.0015;
    });
}

function resolveOctopusConstraints(octopuses) {
    const centerX = 0, centerZ = 0, altarRadius = 2.95;
    octopuses.forEach(oct => {
        const dx = oct.root.position.x - centerX, dz = oct.root.position.z - centerZ;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const safeDist = altarRadius + oct.collisionRadius;
        if (dist < safeDist) {
            const inv = dist > 0.0001 ? 1/dist : 0;
            const push = safeDist - dist + 0.01;
            oct.root.position.x += dist > 0.0001 ? dx*inv*push : push;
            oct.root.position.z += dist > 0.0001 ? dz*inv*push : 0;
            oct.crawlOffset.x += (dist > 0.0001 ? dx*inv*push : push) * 0.35;
            oct.crawlOffset.z += (dist > 0.0001 ? dz*inv*push : 0) * 0.35;
        }
    });
    for (let i = 0; i < octopuses.length; i++) {
        for (let j = i + 1; j < octopuses.length; j++) {
            const a = octopuses[i], b = octopuses[j];
            const dx = b.root.position.x - a.root.position.x;
            const dy = b.root.position.y - a.root.position.y;
            const dz = b.root.position.z - a.root.position.z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            const minDist = (a.collisionRadius||1.2) + (b.collisionRadius||1.2);
            if (dist < minDist) {
                const inv = dist > 0.0001 ? 1/dist : 0;
                const ov = (minDist - dist) * 0.5 + 0.01;
                const px = dist > 0.0001 ? dx*inv*ov : ov, pz = dist > 0.0001 ? dz*inv*ov : 0;
                a.root.position.x -= px; a.root.position.z -= pz;
                b.root.position.x += px; b.root.position.z += pz;
                a.crawlOffset.x -= px*0.28; a.crawlOffset.z -= pz*0.28;
                b.crawlOffset.x += px*0.28; b.crawlOffset.z += pz*0.28;
            }
        }
    }
}

// ─── MAIN ─────────────────────────────────────────────────────────────────────
function main() {
    const fill = document.getElementById('fill');
    let pct = 0;
    const loadTick = setInterval(() => { pct = Math.min(pct + 4, 88); fill.style.width = pct + '%'; }, 35);

    // ── Renderer: UnsignedByte (not HalfFloat) ────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.autoClear = false;
    renderer.sortObjects = true;
    const pixelRatio = Math.min(window.devicePixelRatio, 1.0); // cap at 1× not 1.2×
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020f1a);
    scene.fog = new THREE.FogExp2(0x051f2a, 0.068);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.15, 80);
    camera.position.set(0, 0.6, 7.8);
    camera.lookAt(0, 0.2, 0);

    // ── Render targets: UnsignedByteType (was HalfFloat — ~2× memory, slower) ─
    const rtW = Math.round(window.innerWidth * pixelRatio);
    const rtH = Math.round(window.innerHeight * pixelRatio);
    const rtOpts = {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat,
        type: THREE.UnsignedByteType   // was HalfFloatType
    };
    const rt1 = new THREE.WebGLRenderTarget(rtW, rtH, rtOpts);
    // Depth texture for Beer-Lambert reconstruction
    rt1.depthTexture = new THREE.DepthTexture();
    rt1.depthTexture.type = THREE.UnsignedShortType;
    const rt2 = new THREE.WebGLRenderTarget(rtW, rtH, rtOpts);

    function makeQuad(frag, extraU) {
        const uniforms = Object.assign({ tDiffuse: { value: null }, uTime: { value: 0 } }, extraU || {});
        const mat = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
            fragmentShader: frag
        });
        const sc = new THREE.Scene();
        sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
        return { uniforms, sc, cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1) };
    }

    // ── Combined bloom + underwater pass ─────────────────────────────────────
    // Beer-Lambert: physically-measured clear ocean absorption coefficients (m⁻¹):
    //   R: 0.38  G: 0.055  B: 0.011
    // We scale to world units (camera near=0.15, far=80). Scene is ~10m across,
    // so 1 world unit ≈ 1 metre.
    // Depth is reconstructed from the depth texture via the standard linearisation:
    //   z_ndc = 2*depth - 1
    //   z_eye = 2*near*far / (far+near - z_ndc*(far-near))
    // We use z_eye as the path-length through water from the surface (y=2.8) to
    // the fragment. In-scattering adds the characteristic blue-green glow that
    // would otherwise be absent from a pure absorption model.
    const underwaterQ = makeQuad(`
precision highp float;
uniform sampler2D tDiffuse;
uniform sampler2D tDepth;
uniform float uTime;
uniform vec2 uRes;
uniform float uNear;
uniform float uFar;
varying vec2 vUv;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){
    vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

// Beer-Lambert: physically-based clear seawater absorption (m^-1).
// Red attenuates ~35× faster than blue — the signature underwater look.
// sigma_a = (0.38, 0.055, 0.011)  [R, G, B]
// Backscattering adds the characteristic blue-green in-scattered glow.
// sigma_s = (0.002, 0.005, 0.010)  (Rayleigh-like, stronger for short lambda)
vec3 beerLambert(float dist){
    vec3 sigma_a = vec3(0.38, 0.055, 0.011);
    vec3 sigma_s = vec3(0.002, 0.005, 0.010);
    vec3 sigma_t = sigma_a + sigma_s;
    // Transmittance T = exp(-sigma_t * d)
    return exp(-sigma_t * dist);
}

// In-scattered ambient light accumulated along path length d.
// L_scat = L_ambient * sigma_s/sigma_t * (1 - T)
vec3 inScatter(float dist){
    vec3 sigma_a = vec3(0.38, 0.055, 0.011);
    vec3 sigma_s = vec3(0.002, 0.005, 0.010);
    vec3 sigma_t = sigma_a + sigma_s;
    vec3 T = exp(-sigma_t * dist);
    vec3 albedo = sigma_s / sigma_t;
    // Ambient underwater is teal-biased (skylight filtered through surface)
    vec3 L_ambient = vec3(0.04, 0.22, 0.38);
    return L_ambient * albedo * (1.0 - T);
}

// Linearise depth texture value -> eye-space depth
float linearDepth(float d){
    float z_ndc = 2.0 * d - 1.0;
    return 2.0 * uNear * uFar / (uFar + uNear - z_ndc * (uFar - uNear));
}

// Lightweight god-ray: 8 samples (was 16)
float godRay(vec2 uv, vec2 lightPos, float t){
    vec2 delta = (uv - lightPos) / 8.0;
    vec2 pos = uv;
    float illum = 0.0;
    for(int i=0;i<8;i++){
        pos -= delta;
        float s = texture2D(tDiffuse, clamp(pos,0.,1.)).g;
        float wb = noise(pos*10.+vec2(t*.10,t*.15));
        illum += s * wb * 0.9;
    }
    return illum / 8.0;
}

// Bloom: 3x3 kernel (was 5x5 — 9 samples vs 25)
vec3 bloom(vec2 uv, vec2 px){
    vec3 b = vec3(0.); float w = 0.;
    for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++){
        float wt = exp(-float(x*x+y*y)*0.5);
        vec3 s = texture2D(tDiffuse, uv+vec2(float(x),float(y))*px*2.5).rgb;
        float bri = dot(s, vec3(.5,.8,.2));
        s *= max(0., bri - .32) * 2.2;
        b += s*wt; w += wt;
    }
    return b/w;
}

void main(){
    vec4 base = texture2D(tDiffuse, vUv);
    vec3 col = base.rgb;

    // ── Beer-Lambert from reconstructed eye depth ─────────────────────────
    float rawDepth = texture2D(tDepth, vUv).r;
    float eyeDepth = linearDepth(rawDepth);

    // Water-column depth: camera is ~6-8m away, surface at y=2.8.
    // eyeDepth is view-space, which is the distance from camera to fragment.
    // We approximate the vertical water column (from surface to fragment y) as
    // a fraction of eyeDepth scaled by the view elevation angle.
    // This is far more accurate than the old "1-vUv.y" proxy.
    float waterColumnDepth = clamp(eyeDepth * 0.65, 0.0, 25.0);

    vec3 T = beerLambert(waterColumnDepth);
    vec3 L_scat = inScatter(waterColumnDepth);

    // Apply: fragment colour * transmittance + in-scattered ambient
    col = col * T + L_scat;

    // ── Caustic shimmer (surface-projected) ──────────────────────────────
    float caus = noise(vUv*4.2 + vec2(uTime*.22, uTime*.14));
    caus = pow(abs(sin(caus * 6.28)), 2.5) * 0.18;
    // Caustics are strongest near surface (top of screen at typical camera)
    float surfaceProx = smoothstep(0.0, 1.0, vUv.y);
    col += vec3(.12,.45,.68) * caus * surfaceProx * T;

    // ── Screen-space water warp (gentle) ─────────────────────────────────
    vec2 waterWarp = vec2(
        sin((vUv.y + uTime*.55)*14.) * 0.0014,
        cos((vUv.x - uTime*.45)*17.) * 0.0012
    ) * (1.2 - vUv.y);
    vec3 warped = texture2D(tDiffuse, clamp(vUv+waterWarp,0.,1.)).rgb;
    col = mix(col, warped * T + L_scat, 0.18);

    // ── God rays ─────────────────────────────────────────────────────────
    vec2 lightScreenPos = vec2(.52, .88 + sin(uTime*.12)*.04);
    float ray = godRay(vUv, lightScreenPos, uTime);
    float rayFade = smoothstep(1., 0., vUv.y) * 0.7 + 0.3;
    col += vec3(.28,.70,.95) * ray * 0.16 * rayFade * T;

    // ── Bloom (merged — was a separate full pass) ─────────────────────────
    vec2 px = 1.0 / uRes;
    col += bloom(vUv, px) * 0.18 * vec3(.5,.85,1.);

    // ── Chromatic aberration ──────────────────────────────────────────────
    float edge = length(vUv - vec2(.5)) * 1.8;
    float caStr = 0.0018 * edge;
    vec2 caDir = normalize(vUv - vec2(.5) + .001) * caStr;
    float r2 = texture2D(tDiffuse,clamp(vUv+caDir,0.,1.)).r;
    float b2 = texture2D(tDiffuse,clamp(vUv-caDir*.5,0.,1.)).b;
    // Apply Beer-Lambert to the aberrated samples too
    col.r = col.r * 0.7 + (r2 * T.r + L_scat.r) * 0.3;
    col.b = col.b * 0.7 + (b2 * T.b + L_scat.b) * 0.3;

    // ── Vignette ─────────────────────────────────────────────────────────
    float vig = smoothstep(.82,.28,length(vUv-vec2(.5))*1.3);
    col *= mix(.5, 1., vig);

    // ── Grain ────────────────────────────────────────────────────────────
    float frame = floor(uTime * 24.);
    float grain = (hash(vUv*0.9+frame*.01)-.5)*0.018;
    col += grain;

    col = clamp(col * 0.94 + vec3(0.006,0.014,0.026), 0., 1.);
    gl_FragColor = vec4(col, 1.);
}
`, {
        tDepth: { value: null },
        uRes: { value: new THREE.Vector2(rtW, rtH) },
        uNear: { value: 0.15 },
        uFar:  { value: 80.0 }
    });

    // ── Lighting ─────────────────────────────────────────────────────────────
    const hemi = new THREE.HemisphereLight(0x42b8d6, 0x010305, 1.4);
    scene.add(hemi);
    const ambient = new THREE.AmbientLight(0x1a3a4a, 0.35);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0x5ce8ff, 0.72);
    sunLight.position.set(1.5, 16, -6); scene.add(sunLight);
    const causticLights = [];
    for (let i = 0; i < 4; i++) {
        const pl = new THREE.PointLight(0x52e0ff, 0.65, 12, 1.4);
        pl.position.set(Math.cos(i/4*Math.PI*2)*3.2, 2.4+Math.random()*0.4, Math.sin(i/4*Math.PI*2)*3.2-2);
        scene.add(pl);
        causticLights.push({ light: pl, phase: Math.random()*Math.PI*2, radius: 3+Math.random(), baseY: pl.position.y });
    }
    const altarGlowLight = new THREE.PointLight(0x2a9fd8, 1.5, 6, 1.8);
    altarGlowLight.position.set(0, 0.5, 0); scene.add(altarGlowLight);

    // ── Sky dome ─────────────────────────────────────────────────────────────
    const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide, uniforms: { uTime: { value: 0 } },
        vertexShader: 'varying vec3 vWP;void main(){vWP=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
        fragmentShader: `precision highp float;uniform float uTime;varying vec3 vWP;
void main(){
vec3 dir=normalize(vWP);float up=clamp(dir.y,0.,1.);
vec3 zenith=vec3(.04,.18,.38),midWater=vec3(.01,.08,.18),deep=vec3(.005,.02,.06);
vec3 col=mix(deep,midWater,pow(up,.5));col=mix(col,zenith,pow(up,2.2));
float c=sin(dir.x*22.+uTime*1.2)*cos(dir.z*18.+uTime*.9);
col+=vec3(.12,.28,.45)*smoothstep(.4,1.,c*.5+.5)*pow(up,3.)*0.5;
gl_FragColor=vec4(col,1.);}`
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(65, 36, 18), skyMat));

    // ── Ground / seafloor ────────────────────────────────────────────────────
    const floorMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: 'varying vec3 vWP;void main(){vWP=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
        fragmentShader: `precision highp float;uniform float uTime;varying vec3 vWP;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){
float dist=length(vWP.xz);
float n=noise(vWP.xz*.8),n2=noise(vWP.xz*3.+.5);
float caus=pow(noise(vWP.xz*4.2+vec2(uTime*.22,uTime*.15))*.5+.5,3.8)*0.48;
float crack=pow(max(0.,noise(vWP.xz*5.)-0.7)*3.,2.);
vec3 col=mix(vec3(.02,.012,.006),vec3(.05,.028,.012),n);
col=mix(col,vec3(.08,.04,.01),n2*.5);
col+=vec3(.12,.38,.55)*caus*(1.-dist*.03);
col+=vec3(.08,.18,.32)*exp(-dist*.28)*.18;
gl_FragColor=vec4(col,1.);}`
    });
    const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(100, 100, 1, 1), floorMat);
    floorMesh.rotation.x = -Math.PI/2; floorMesh.position.y = -0.72; scene.add(floorMesh);

    // ── Water surface ─────────────────────────────────────────────────────────
    const waterSurfaceMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } }, side: THREE.DoubleSide, transparent: true, depthWrite: false,
        vertexShader: `uniform float uTime;varying vec3 vWP;varying vec3 vN;
void main(){vec3 p=position;
p.y+=sin(p.x*.72+uTime*.6)*.018+cos(p.z*.88+uTime*.5)*.015+sin((p.x+p.z)*.55+uTime*.85)*.01;
vWP=(modelMatrix*vec4(p,1.)).xyz;
float dx=cos(p.x*.72+uTime*.6)*.018;float dz=-sin(p.z*.88+uTime*.5)*.015;
vN=normalize(vec3(-dx,1.,-dz));gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
        fragmentShader: `precision highp float;uniform float uTime;varying vec3 vWP;varying vec3 vN;
float noise(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){
float fresnel=pow(1.-max(0.,dot(vN,vec3(0,1,0))),2.);
vec3 baseCol=vec3(.04,.22,.42);
float caus=noise(vWP.xz*4.+uTime*.6)*.5+.5;caus=pow(caus,3.)*.25;
vec3 col=baseCol+vec3(.1,.4,.7)*caus;
float brightSpot=max(0.,dot(vN,normalize(vec3(2,1,-2))));
col+=vec3(.4,.8,1.)*pow(brightSpot,12.)*.6;
col=mix(col,vec3(.55,.88,1.),fresnel*.3);
float dist=length(vWP.xz);
gl_FragColor=vec4(col,mix(.35,.85,fresnel)*exp(-dist*.04));}`
    });
    const waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 80, 40, 40), waterSurfaceMat);
    waterMesh.rotation.x = -Math.PI/2; waterMesh.position.y = 2.8; scene.add(waterMesh);

    // ── Altar ────────────────────────────────────────────────────────────────
    const stoneA = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, roughness: 0.55, metalness: 0.08, emissive: 0x0a2030, emissiveIntensity: 0.12, polygonOffset: true, polygonOffsetFactor: 1.0, polygonOffsetUnits: 1.0 });
    const stoneB = new THREE.MeshStandardMaterial({ color: 0x1f3248, roughness: 0.58, metalness: 0.06, emissive: 0x102840, emissiveIntensity: 0.10, polygonOffset: true, polygonOffsetFactor: 1.0, polygonOffsetUnits: 1.0 });
    const bronze = new THREE.MeshStandardMaterial({ color: 0x2a4a5a, roughness: 0.28, metalness: 0.82, emissive: 0x1a5870, emissiveIntensity: 0.14, polygonOffset: true, polygonOffsetFactor: 1.0, polygonOffsetUnits: 1.0 });
    [[2.38,2.62,0.62,-0.68,stoneA],[2.08,2.28,0.48,-0.32,stoneA],[1.78,1.95,0.36,-0.04,stoneB],[1.62,1.70,0.18,0.20,stoneB]].forEach(([top,bot,h,y,mat]) => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(top, bot, h, 32), mat);
        m.position.y = y; scene.add(m);
    });
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x22283a, roughness: 0.68, emissive: 0x08122a, emissiveIntensity: 0.15, polygonOffset: true, polygonOffsetFactor: 1.0, polygonOffsetUnits: 1.0 });
    for (let i = 0; i < 8; i++) {
        const ang = (i/8)*Math.PI*2, r = 1.62;
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.28), pillarMat);
        p.position.set(Math.cos(ang)*r, -0.5, Math.sin(ang)*r); scene.add(p);
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.32), bronze);
        cap.position.set(Math.cos(ang)*r, -0.18, Math.sin(ang)*r); scene.add(cap);
    }
    const iron = new THREE.MeshStandardMaterial({ color: 0x32516d, roughness: 0.45, metalness: 0.80, emissive: 0x1f6b9a, emissiveIntensity: 0.05, polygonOffset: true, polygonOffsetFactor: 1.0, polygonOffsetUnits: 1.0 });
    for (let i = 0; i < 24; i += 2) {
        const ang = (i/24)*Math.PI*2;
        const link = new THREE.Mesh(new THREE.TorusGeometry(0.038, 0.012, 4, 8), iron);
        link.position.set(Math.cos(ang)*2.22, -0.55, Math.sin(ang)*2.22);
        link.rotation.y = ang; link.rotation.x = Math.PI/2; scene.add(link);
    }
    const debrisMat = new THREE.MeshStandardMaterial({ color: 0x1a1828, roughness: 0.92, emissive: 0x060820, emissiveIntensity: 0.08 });
    for (let i = 0; i < 22; i++) {
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.025+Math.random()*0.055, 0), debrisMat);
        const ang = Math.random()*Math.PI*2, rad = 2.0+Math.random()*1.5;
        m.position.set(Math.cos(ang)*rad, -0.58+Math.random()*0.18, Math.sin(ang)*rad);
        m.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
        m.scale.set(1, 0.3+Math.random()*0.6, 1); scene.add(m);
    }

    // ── Mountains / rocks ────────────────────────────────────────────────────
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x0d1a28, roughness: 0.85, metalness: 0.05, emissive: 0x051020, emissiveIntensity: 0.05 });
    [[12,14,18,-0.8,2.8],[8,9,13,-0.7,1.8],[5,6,10,-0.6,1.2]].forEach(([cnt,rMin,rMax,yBase,h]) => {
        for (let i = 0; i < cnt; i++) {
            const ang = (i/cnt)*Math.PI*2+Math.random()*.4, dist = rMin+Math.random()*(rMax-rMin);
            const ht = h*(0.5+Math.random()*.9);
            const m = new THREE.Mesh(new THREE.ConeGeometry(0.35+Math.random()*.7, ht, 6), rockMat);
            m.position.set(Math.cos(ang)*dist, yBase+ht*.5, Math.sin(ang)*dist); scene.add(m);
        }
    });

    // ── Particles — reduced counts, throttled updates ─────────────────────────
    function makePts(cnt, rMin, rMax, hMin, hMax, color, size, opacity) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(cnt*3), spd = new Float32Array(cnt);
        for (let i = 0; i < cnt; i++) {
            const r = rMin+Math.random()*(rMax-rMin), a = Math.random()*Math.PI*2;
            pos[i*3]=Math.cos(a)*r; pos[i*3+1]=hMin+Math.random()*(hMax-hMin); pos[i*3+2]=Math.sin(a)*r;
            spd[i]=0.12+Math.random()*0.6;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));
        scene.add(pts);
        return { pts, pos, spd, cnt, hMin, hMax, rMin, rMax };
    }
    // Reduced counts: 500→280, 250→140, 350→200
    const plankton = makePts(280, 0.4, 8.0, -0.5, 3.5, 0x50e8ff, 0.012, 0.70);
    const sparkle  = makePts(140, 0.3, 5.0, -0.3, 2.8, 0xa0ffee, 0.006, 0.80);
    const motes    = makePts(200, 0.5, 6.5, -0.2, 3.0, 0x30c8e8, 0.016, 0.45);

    // ── Bubble columns ────────────────────────────────────────────────────────
    const bubbleMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } }, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
        vertexShader: `uniform float uTime;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;float t=uv.y;p.x+=sin(uTime*.85+t*4.)*.12*t;p.x*=1.+t*1.2;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
        fragmentShader: `precision highp float;uniform float uTime;varying vec2 vUv;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){float t=vUv.y;float edge=pow(1.-abs(vUv.x-.5)*2.,1.4);float n=noise(vUv*vec2(2.5,4.)-vec2(0.,uTime*.52));float d=edge*(0.5+n*.5)*(1.-t);vec3 c=mix(vec3(.04,.18,.32),vec3(.15,.55,.82),n);gl_FragColor=vec4(c,clamp(d*.38*(1.-t*.8),0.,1.));}`
    });
    const bubbleMeshes = [];
    for (let i = 0; i < 10; i++) {
        const ang = (i/10)*Math.PI*2;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 2.4, 1, 14), bubbleMat);
        m.position.set(Math.cos(ang)*1.0, 0.6, Math.sin(ang)*1.0);
        m.lookAt(0, 0.6, 0); scene.add(m); bubbleMeshes.push(m);
    }

    // ── Original paddle ───────────────────────────────────────────────────────
    const PADDLE_W_WORLD = 2.2, PADDLE_H_WORLD = 0.55, PADDLE_Y = 0.90, PADDLE_TEX_W = 880, PADDLE_TEX_H = 220;
    const playerPaddleCanvas = createAIPaddleCanvas(PADDLE_TEX_W, PADDLE_TEX_H);
    const playerPaddleTexture = new THREE.CanvasTexture(playerPaddleCanvas);
    playerPaddleTexture.minFilter = THREE.LinearFilter; playerPaddleTexture.magFilter = THREE.LinearFilter;
    const playerPaddleMat = new THREE.MeshBasicMaterial({
        map: playerPaddleTexture, transparent: true,
        blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
        depthWrite: false, side: THREE.DoubleSide, toneMapped: false
    });
    const playerPaddleAnchor = new THREE.Group();
    playerPaddleAnchor.position.set(0, PADDLE_Y, 0); playerPaddleAnchor.frustumCulled = false; scene.add(playerPaddleAnchor);
    const playerPaddleRig = new THREE.Group(); playerPaddleRig.frustumCulled = false; playerPaddleAnchor.add(playerPaddleRig);
    const playerPaddlePlane = new THREE.Mesh(new THREE.PlaneGeometry(PADDLE_W_WORLD, PADDLE_H_WORLD), playerPaddleMat);
    playerPaddlePlane.frustumCulled = false; playerPaddleRig.add(playerPaddlePlane);

    // ── Octopuses ─────────────────────────────────────────────────────────────
    const octopuses = [];
    for (let i = 0; i < 3; i++) octopuses.push(buildOctopus(scene, i));

    // ── Animation ─────────────────────────────────────────────────────────────
    let t = 0, lastMs = performance.now(), tick = 0, preRenderDone = false;
    const orbitState = { angle: 0 };
    const camState = {
        basePos: new THREE.Vector3(0, 0.6, 7.8),
        baseTarget: new THREE.Vector3(0, 0.2, 0),
        tempTarget: new THREE.Vector3(0, 0.2, 0),
        prevPos: new THREE.Vector3(0, 0.6, 7.8),
    };

    function updPts(sys, dtScl) {
        const pos = sys.pos, spd = sys.spd, cnt = sys.cnt;
        for (let i = 0; i < cnt; i++) {
            pos[i*3+1] += dtScl * spd[i] * 0.4;
            pos[i*3]   += Math.sin(t*0.9+i*0.5) * dtScl * 0.008;
            pos[i*3+2] += Math.cos(t*0.7+i*0.4) * dtScl * 0.006;
            if (pos[i*3+1] > sys.hMax) {
                pos[i*3+1] = sys.hMin + Math.random() * 0.3;
                const r = sys.rMin+Math.random()*(sys.rMax-sys.rMin), a = Math.random()*Math.PI*2;
                pos[i*3] = Math.cos(a)*r; pos[i*3+2] = Math.sin(a)*r;
            }
        }
        sys.pts.geometry.attributes.position.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min((now - lastMs) / 1000, 0.033);
        lastMs = now; t += dt; tick++;

        skyMat.uniforms.uTime.value = t;
        floorMat.uniforms.uTime.value = t;
        waterSurfaceMat.uniforms.uTime.value = t;
        bubbleMat.uniforms.uTime.value = t;

        // Caustic lights — every 2nd frame
        if (tick % 2 === 0) {
            causticLights.forEach((cl) => {
                const ph = t * 0.8 + cl.phase;
                cl.light.position.x = Math.cos(ph) * cl.radius + Math.sin(ph*1.3) * 0.8;
                cl.light.position.y = cl.baseY + Math.sin(ph*1.7) * 0.3;
                cl.light.position.z = Math.sin(ph) * cl.radius * 0.8 - 2;
                cl.light.intensity = 0.28 + Math.abs(Math.sin(ph*2.2+cl.phase)) * 0.28;
                cl.light.color.setHSL(0.54+Math.sin(ph*.5)*.03, 0.82, 0.72);
            });
        }

        altarGlowLight.intensity = 0.8 + Math.sin(t*1.8)*.4 + Math.sin(t*3.1)*.2;
        altarGlowLight.color.setHSL(0.56+Math.sin(t*.4)*.04, 0.85, 0.68);
        hemi.intensity = 1.2 + Math.sin(t*.18) * 0.12;
        hemi.color.setHSL(0.54+Math.sin(t*.22)*.02, 0.65, 0.55);
        if (tick%4===0) scene.fog.density = 0.055 + Math.sin(t*.08) * 0.008;

        // Particles — every 3rd frame (was every 2nd)
        if (tick % 3 === 0) {
            updPts(plankton, dt * 3); updPts(sparkle, dt * 3 * 1.4); updPts(motes, dt * 3 * 0.5);
        }
        if (tick % 4 === 0) sparkle.pts.material.opacity = 0.6 + Math.sin(t*4.2) * 0.25;

        // Octopuses
        octopuses.forEach(oct => animateOctopus(oct, t, dt));
        if (tick%5===0) resolveOctopusConstraints(octopuses);

        // Paddle — every 2nd frame
        if (tick%2===0) { renderPlayerPaddleToCanvas(playerPaddleCanvas, t); playerPaddleTexture.needsUpdate = true; }
        playerPaddleAnchor.position.y = PADDLE_Y + Math.sin(t*1.55) * 0.02;
        playerPaddleAnchor.lookAt(camera.position.x, playerPaddleAnchor.position.y, camera.position.z);
        playerPaddleRig.rotation.z = 0.08 + Math.sin(t*1.9) * 0.024;

        bubbleMeshes.forEach(m => m.lookAt(camera.position));

        // Camera
        if (preRenderDone) {
            orbitState.angle += 0.055 * dt;
            const orbitCycle = orbitState.angle * 0.4;
            const dynamicR = 6.8 + Math.sin(orbitCycle*1.6) * 2.2;
            const dynamicH = 0.45 + Math.sin(orbitCycle*2.0) * 0.65 + Math.sin(t*.55) * 0.12;
            const idealPos = new THREE.Vector3(Math.cos(orbitState.angle)*dynamicR, dynamicH, Math.sin(orbitState.angle)*dynamicR);
            camera.position.lerp(idealPos, 0.045);
            camera.rotation.z = Math.sin(t*.42) * 0.018 + Math.cos(orbitState.angle*1.8) * 0.008;
            const lookAheadAngle = orbitState.angle + 0.5 + Math.sin(t*.18) * 0.12;
            const lookAheadR = 1.0 + Math.cos(t*.28) * 0.3;
            const idealTarget = new THREE.Vector3(
                camState.baseTarget.x + Math.cos(lookAheadAngle)*lookAheadR,
                camState.baseTarget.y + Math.sin(t*.38) * 0.08,
                camState.baseTarget.z + Math.sin(lookAheadAngle)*lookAheadR
            );
            camState.tempTarget.lerp(idealTarget, 0.06);
            const drift = new THREE.Vector3(Math.sin(t*.22)*.035, Math.cos(t*.17)*.018, Math.sin(t*.3)*.028);
            camera.lookAt(camState.tempTarget.clone().add(drift));
        } else {
            camera.position.copy(camState.basePos);
            camera.lookAt(camState.baseTarget);
            camState.tempTarget.copy(camState.baseTarget);
        }

        underwaterQ.uniforms.uTime.value = t;

        // ── Render chain: 2 passes (was 3) ───────────────────────────────────
        // Pass 1: scene → rt1 (colour + depth)
        renderer.setRenderTarget(rt1); renderer.clear(); renderer.render(scene, camera);
        // Pass 2: bloom + Beer-Lambert + god rays → screen  (merged from two passes)
        underwaterQ.uniforms.tDiffuse.value = rt1.texture;
        underwaterQ.uniforms.tDepth.value   = rt1.depthTexture;
        renderer.setRenderTarget(null); renderer.clear(); renderer.render(underwaterQ.sc, underwaterQ.cam);
    }

    clearInterval(loadTick); fill.style.width = '100%';
    setTimeout(() => {
        const l = document.getElementById('loader');
        if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 1200); }
    }, 500);

    function preRender() {
        return new Promise(resolve => {
            for (let i = 0; i < 6; i++) {
                const a = i/6*Math.PI*2;
                camera.position.set(Math.cos(a)*7, 0.5, Math.sin(a)*7);
                camera.lookAt(0, 0.2, 0);
                renderer.setRenderTarget(rt1); renderer.clear(); renderer.render(scene, camera);
                underwaterQ.uniforms.tDiffuse.value = rt1.texture;
                underwaterQ.uniforms.tDepth.value   = rt1.depthTexture;
                underwaterQ.uniforms.uTime.value = 0;
                renderer.setRenderTarget(null); renderer.clear(); renderer.render(underwaterQ.sc, underwaterQ.cam);
            }
            camera.position.copy(camState.basePos); camera.lookAt(camState.baseTarget);
            renderer.setRenderTarget(null); resolve();
        });
    }

    preRender().then(() => { preRenderDone = true; animate(); });

    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w/h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        const dpr = renderer.getPixelRatio();
        const nW = Math.round(w*dpr), nH = Math.round(h*dpr);
        rt1.setSize(nW, nH); rt2.setSize(nW, nH);
        underwaterQ.uniforms.uRes.value.set(nW, nH);
    });
}
</script>
</body>
