<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring of Fire — Film VFX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
#hud {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(200,140,70,0.4); font: 10px/1 'Courier New', monospace;
    letter-spacing: 0.4em; text-transform: uppercase; pointer-events: none; white-space: nowrap;
}
#loader {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 99;
    transition: opacity 1s ease 0.4s;
}
#loader span { color: #c87840; font: 11px/1 'Courier New', monospace; letter-spacing: 0.5em; }
#loader .bar { width: 140px; height: 1px; background: rgba(200,120,60,0.2); }
#loader .fill { height: 1px; background: #c87840; width: 0; transition: width 0.3s; }
</style>
</head>
<body>
<div id="loader">
    <span>RING OF FIRE &nbsp;·&nbsp; FILM VFX</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<div id="hud">✦ &nbsp; RING OF FIRE &nbsp;·&nbsp; FILM VFX &nbsp; ✦</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function waitForThree() {
    if (typeof THREE === 'undefined') { setTimeout(waitForThree, 50); return; }
    main();
})();

function createAIPaddleCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
}

function renderAIPaddleToCanvas(canvas, time) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const halfW = W / 2, halfH = H / 2;
    const transformPulse = 0.12;
    const shoulder = Math.max(3, Math.min(7, W * 0.22));
    const crown    = Math.max(10, Math.min(18, H * 0.12));
    const waist    = Math.max(2, Math.min(6, W * 0.18));

    ctx.save();
    ctx.translate(halfW, halfH);

    const traceHull = (w = W, h = H, waistMul = 1) => {
        const hw = w / 2, hh = h / 2;
        const ls = Math.max(2, Math.min(hw-1, shoulder*(w/W)));
        const lc = Math.max(6, Math.min(hh-6, crown*(h/H)));
        const lw = Math.max(1.5, Math.min(hw-1.5, waist*waistMul*(w/W)));
        ctx.beginPath();
        ctx.moveTo(-hw+ls,-hh); ctx.lineTo(hw-ls,-hh);
        ctx.lineTo(hw,-hh+lc); ctx.lineTo(hw-lw,-hh*0.18);
        ctx.lineTo(hw-lw*0.7,hh*0.18); ctx.lineTo(hw,hh-lc);
        ctx.lineTo(hw-ls,hh); ctx.lineTo(-hw+ls,hh);
        ctx.lineTo(-hw,hh-lc); ctx.lineTo(-hw+lw*0.7,hh*0.18);
        ctx.lineTo(-hw+lw,-hh*0.18); ctx.lineTo(-hw,-hh+lc);
        ctx.closePath();
    };

    ctx.save();
    traceHull(W+10+transformPulse*8, H+12+transformPulse*14, 0.9);
    const sg = ctx.createLinearGradient(0,-halfH,0,halfH);
    sg.addColorStop(0,'rgba(255,160,96,0.24)');
    sg.addColorStop(0.5,`rgba(255,110,70,${(0.42+transformPulse*0.18).toFixed(2)})`);
    sg.addColorStop(1,'rgba(140,30,12,0.12)');
    ctx.fillStyle=sg; ctx.fill(); ctx.restore();

    traceHull();
    const hg=ctx.createLinearGradient(-halfW,-halfH,halfW,halfH);
    hg.addColorStop(0,'#1a1b21'); hg.addColorStop(0.45,'#323844');
    hg.addColorStop(0.7,'#171b22'); hg.addColorStop(1,'#09090b');
    ctx.fillStyle=hg; ctx.fill();

    ctx.save(); traceHull();
    ctx.lineWidth=3; ctx.strokeStyle='rgba(220,30,30,0.95)';
    ctx.shadowColor='rgba(255,60,40,0.9)'; ctx.shadowBlur=12+transformPulse*30;
    ctx.stroke(); ctx.restore();

    traceHull(W*0.7, H*0.82, 1.25);
    const ag=ctx.createLinearGradient(0,-halfH*0.82,0,halfH*0.82);
    ag.addColorStop(0,'#4a5360'); ag.addColorStop(0.48,'#1d232c');
    ag.addColorStop(0.52,'#3a1e18'); ag.addColorStop(1,'#0a0c10');
    ctx.fillStyle=ag; ctx.fill();

    const spg=ctx.createLinearGradient(0,-halfH*0.42,0,halfH*0.42);
    spg.addColorStop(0,'rgba(255,220,140,1)'); spg.addColorStop(0.2,'rgba(255,120,96,0.98)');
    spg.addColorStop(0.5,'rgba(255,248,196,1)'); spg.addColorStop(0.8,'rgba(255,120,96,0.98)');
    spg.addColorStop(1,'rgba(255,220,140,1)');
    ctx.fillStyle=spg;
    ctx.beginPath();
    ctx.moveTo(-W*0.10,-H*0.40); ctx.lineTo(W*0.08,-H*0.46);
    ctx.lineTo(W*0.14,0); ctx.lineTo(W*0.08,H*0.46);
    ctx.lineTo(-W*0.10,H*0.40); ctx.lineTo(-W*0.02,0);
    ctx.closePath(); ctx.fill();

    const coreScale=1+transformPulse*0.6+Math.sin(time*10)*0.07;
    const coreR=W*0.26*coreScale;
    const core=ctx.createRadialGradient(0,0,0,0,0,coreR*1.6);
    core.addColorStop(0,'rgba(255,255,255,1)'); core.addColorStop(0.12,'rgba(255,245,170,1)');
    core.addColorStop(0.38,'rgba(255,125,78,0.98)'); core.addColorStop(0.72,'rgba(180,42,18,0.30)');
    core.addColorStop(1,'transparent');
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.fill();

    ctx.lineWidth=1.6;
    const ca=0.45+Math.sin(time*6)*0.25;
    ctx.strokeStyle=`rgba(0,255,120,${ca.toFixed(2)})`;
    const nb=Math.max(3,Math.floor(H/24));
    for(let i=0;i<nb;i++){
        const tt=nb===1?0.5:i/(nb-1);
        const y=-H/2+12+tt*(H-24);
        const xO=W/2-Math.max(3,shoulder*0.9);
        ctx.beginPath(); ctx.moveTo(xO,y);
        ctx.quadraticCurveTo(xO-W*0.35,y+Math.sin(time*2+i)*6,Math.cos(i+time)*4,Math.sin(i*1.2+time)*3);
        ctx.stroke();
        ctx.fillStyle=`rgba(255,255,180,${(0.50+Math.abs(Math.sin(time*6+i))*0.45).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(xO-6,y+Math.sin(time*3+i)*2,2.2,0,Math.PI*2); ctx.fill();
    }
    ctx.lineWidth=2;
    for(let a=0;a<3;a++){
        const ph=time*(3+a)+a*1.37;
        const ax=Math.cos(ph)*(W*0.55),ay=Math.sin(ph*0.9)*(H*0.35);
        const bx=Math.cos(ph+1.2)*(W*0.2),by=Math.sin(ph+0.8)*(H*0.15);
        ctx.beginPath();
        ctx.strokeStyle=`rgba(255,240,160,${(0.72+Math.sin(ph*4)*0.16).toFixed(2)})`;
        ctx.moveTo(ax,ay); ctx.bezierCurveTo(ax*0.6,ay*0.4,bx*1.2,by*1.4,bx,by);
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle=`rgba(255,130,70,${(0.24+Math.abs(Math.sin(ph*2))*0.12).toFixed(2)})`;
        ctx.lineWidth=6; ctx.stroke(); ctx.lineWidth=2;
    }
    ctx.save(); ctx.globalCompositeOperation='lighter';
    traceHull(W+14+transformPulse*10,H+18+transformPulse*16,0.85);
    const aur=ctx.createRadialGradient(0,0,coreR*0.1,0,0,Math.max(W,H)*0.7);
    aur.addColorStop(0,`rgba(255,180,92,${(0.34+transformPulse*0.18).toFixed(2)})`);
    aur.addColorStop(0.5,`rgba(255,110,48,${(0.16+transformPulse*0.08).toFixed(2)})`);
    aur.addColorStop(1,'transparent');
    ctx.fillStyle=aur; ctx.fill(); ctx.restore();

    ctx.save();
    const wp=Math.sin(time*8)*0.15+0.85;
    ctx.rotate(Math.sin(time*12)*0.06); ctx.scale(wp,wp);
    const wy=-halfH-40;
    ctx.shadowColor='#FF0033'; ctx.shadowBlur=40; ctx.globalAlpha=0.7;
    ctx.font='bold 24px "Arial Black",sans-serif';
    ctx.fillStyle='#AA0022'; ctx.strokeStyle='#FF0033'; ctx.lineWidth=4;
    ctx.textAlign='center'; ctx.strokeText('TARGET',0,wy);
    ctx.globalAlpha=1; ctx.shadowBlur=20; ctx.fillStyle='#FF0033'; ctx.fillText('TARGET',0,wy);
    ctx.shadowColor='#FF0033'; ctx.shadowBlur=15; ctx.fillStyle='#FFFFFF'; ctx.fillText('LOCKED',0,wy+22);
    ctx.restore();
    ctx.restore();
}

function main() {
    const fill = document.getElementById('fill');
    let pct = 0;
    const loadTick = setInterval(() => { pct = Math.min(pct + 4, 88); fill.style.width = pct + '%'; }, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.autoClear = false;
    renderer.sortObjects = true;
    const pixelRatio = Math.min(window.devicePixelRatio, 2.0);
    const scaleFactor = 0.85;
    const effectivePixelRatio = Math.max(1.0, pixelRatio * scaleFactor);
    renderer.setPixelRatio(effectivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.physicallyCorrectLights = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x5a3a22, 0.0022);

    const sunPos = new THREE.Vector3(14, 8.2, -32);

    const skyTexture = createSkyEnvironmentTexture(sunPos);
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const skyEnvironment = pmremGenerator.fromEquirectangular(skyTexture).texture;
    scene.environment = skyEnvironment;
    scene.background = skyTexture;
    pmremGenerator.dispose();

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.2, 180);
    camera.position.set(0, 1.85, 8.2);
    camera.lookAt(0, 0.88, 0);
    camera.updateProjectionMatrix();

    // ── Cinematic camera state ─────────────────────────────────────
    // Slow crane orbit: wide arc, gentle elevation changes, never dizzying
    const camState = {
        orbitAngle: 0,
        orbitRadius: 8.5,
        orbitHeight: 2.2,
        targetX: 0,
        targetY: 0.6,
        targetZ: 0,
        smoothPos: new THREE.Vector3(0, 2.2, 8.5),
        smoothTarget: new THREE.Vector3(0, 0.6, 0),
        prevPos: new THREE.Vector3(0, 2.2, 8.5),
        prevTarget: new THREE.Vector3(0, 0.6, 0),
        camVel: new THREE.Vector3(),
        targetVel: new THREE.Vector3()
    };

    const rtWidth  = window.innerWidth  * effectivePixelRatio;
    const rtHeight = window.innerHeight * effectivePixelRatio;
    const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.HalfFloatType };
    const rt1 = new THREE.WebGLRenderTarget(rtWidth, rtHeight, rtOpts);
    const rt2 = rt1.clone();
    const rt3 = rt1.clone();

    function makeQuad(fragSrc, extraU) {
        const uniforms = Object.assign({ tDiffuse: { value: null }, uTime: { value: 0 } }, extraU || {});
        const mat = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
            fragmentShader: fragSrc
        });
        const sc = new THREE.Scene();
        sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
        const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        return { uniforms, sc, cam };
    }

    function createSkyEnvironmentTexture(sunPosition) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const sunDir = sunPosition.clone().normalize();
        const sunX = (0.5 + Math.atan2(sunDir.z, sunDir.x) / (Math.PI * 2)) * W;
        const sunY = (0.5 - Math.asin(sunDir.y) / Math.PI) * H;

        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0.00, '#010100');
        skyGrad.addColorStop(0.08, '#070503');
        skyGrad.addColorStop(0.20, '#14100b');
        skyGrad.addColorStop(0.36, '#281a12');
        skyGrad.addColorStop(0.52, '#3c2418');
        skyGrad.addColorStop(0.68, '#5a321f');
        skyGrad.addColorStop(0.84, '#5c2d1a');
        skyGrad.addColorStop(1.00, '#0a0402');
        ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

        const sunCore = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 50);
        sunCore.addColorStop(0.00, 'rgba(255, 255, 252, 0.99)');
        sunCore.addColorStop(0.20, 'rgba(255, 245, 230, 0.90)');
        sunCore.addColorStop(0.70, 'rgba(255, 225, 165, 0.28)');
        sunCore.addColorStop(1, 'rgba(255, 200, 140, 0)');
        ctx.fillStyle = sunCore; ctx.fillRect(0, 0, W, H);

        const coronaMid = ctx.createRadialGradient(sunX, sunY, 50, sunX, sunY, 240);
        coronaMid.addColorStop(0.0, 'rgba(255, 240, 200, 0.0)');
        coronaMid.addColorStop(0.12, 'rgba(255, 225, 160, 0.16)');
        coronaMid.addColorStop(0.65, 'rgba(210, 140, 60, 0.06)');
        coronaMid.addColorStop(1.0, 'rgba(140, 80, 30, 0)');
        ctx.fillStyle = coronaMid; ctx.fillRect(0, 0, W, H);

        ctx.save(); ctx.globalCompositeOperation = 'screen';
        const rayCount = 48;
        for (let r = 0; r < rayCount; r++) {
            const angle = (r / rayCount) * Math.PI * 2;
            const rayDist = 480 + Math.sin(angle * 3.0) * 60;
            const rayGrad = ctx.createLinearGradient(sunX, sunY, sunX + Math.cos(angle) * rayDist, sunY + Math.sin(angle) * rayDist);
            rayGrad.addColorStop(0.0, 'rgba(255, 235, 180, 0.08)');
            rayGrad.addColorStop(0.55, 'rgba(230, 180, 100, 0.03)');
            rayGrad.addColorStop(1.0, 'rgba(180, 120, 60, 0)');
            ctx.strokeStyle = rayGrad;
            ctx.lineWidth = 2.5 + (Math.sin(r * 0.3 + angle) * 1.2);
            ctx.beginPath(); ctx.moveTo(sunX, sunY);
            ctx.lineTo(sunX + Math.cos(angle) * rayDist, sunY + Math.sin(angle) * rayDist);
            ctx.stroke();
        }
        ctx.restore();

        ctx.save(); ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 24; i++) {
            const bandY = H * (0.40 + i * 0.022);
            const progress = i / 24;
            const bandAlpha = Math.max(0, 0.035 + (1 - progress) * 0.070);
            const rVal = Math.floor(225 - progress * 45);
            const gVal = Math.floor(138 - progress * 32);
            const bVal = Math.floor(78 - progress * 22);
            ctx.fillStyle = `rgba(${rVal}, ${gVal}, ${bVal}, ${bandAlpha.toFixed(3)})`;
            ctx.fillRect(0, bandY, W, 2.2 + progress * 0.8);
        }
        ctx.restore();

        ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.070;
        for (let y = 0; y < H; y += 2) {
            for (let x = 0; x < W; x += 2) {
                const n1 = ((x * 173 + y * 137) % 31) / 30;
                const n2 = ((x * 251 + y * 187) % 29) / 28;
                const noise = (n1 * 0.6 + n2 * 0.4);
                const tint = Math.floor(26 + noise * 28);
                ctx.fillStyle = `rgb(${tint}, ${Math.max(0, tint - 1)}, ${Math.max(0, tint - 5)})`;
                ctx.fillRect(x, y, 1, 1);
            }
        }
        ctx.restore();

        ctx.save(); ctx.globalCompositeOperation = 'screen';
        const starBands = [0.06, 0.12, 0.18, 0.26, 0.34];
        for (let b = 0; b < starBands.length; b++) {
            const bandY = H * starBands[b];
            const bandStrength = 1.0 - (b / starBands.length) * 0.4;
            for (let i = 0; i < 320; i++) {
                const x = ((i * 127 + b * 251) % W) + ((i * 23 + b * 41) % 13) * 0.2;
                const y = bandY + (((i * 67 + b * 43) % 19) - 9) * 0.85;
                const mag = (((i * 19 + b * 17) % 100) / 100);
                const brightness = 0.28 + mag * 0.62;
                const twinkle = brightness * (0.55 + Math.sin(i * 0.4 + b * 100) * 0.45);
                const r = 255, g = Math.floor(238 - mag * 25), bv = Math.floor(210 - mag * 35);
                ctx.fillStyle = `rgba(${r}, ${g}, ${bv}, ${(twinkle * bandStrength).toFixed(2)})`;
                ctx.beginPath(); ctx.arc(x, y, (0.4 + mag * mag * 1.0) * 0.5, 0, Math.PI * 2); ctx.fill();
            }
        }
        ctx.restore();

        const discSharp = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 26);
        discSharp.addColorStop(0.00, 'rgba(255, 252, 248, 0.95)');
        discSharp.addColorStop(0.70, 'rgba(255, 220, 160, 0.55)');
        discSharp.addColorStop(1.0, 'rgba(255, 200, 120, 0.0)');
        ctx.fillStyle = discSharp;
        ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, Math.PI * 2); ctx.fill();

        const texture = new THREE.CanvasTexture(canvas);
        texture.mapping = THREE.EquirectangularReflectionMapping;
        texture.encoding = THREE.sRGBEncoding;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;
        return texture;
    }

    // ── Film grade + corrected lens flare ─────────────────────────
    // Key fix: lens flare uses uSunNDC (proper NDC from GPU projection),
    // gated by dot(camForward, sunDir) so it ONLY fires when actually facing sun.
    const gradeQ = makeQuad(`
        uniform sampler2D tDiffuse; uniform float uTime;
        uniform vec2 uResolution;
        uniform vec2 uSunNDC;          // Sun in 0..1 screen UV (set from JS projection)
        uniform float uSunFacing;      // dot(camForward, sunDirNorm), clamped 0..1
        uniform float uSunInFrustum;   // 1 if sun NDC inside 0..1, else 0
        uniform vec3 uCamVel; uniform vec3 uTargetVel;
        uniform float uHdrMix; uniform float uThermalNoise;
        uniform float uSonicDistortion;
        varying vec2 vUv;

        float blueNoise(vec2 uv, float t){
            vec2 p=uv*800.0;
            return fract(sin(dot(floor(p),vec2(127.1,311.7))+t*47.3)*43758.5)*2.0-1.0;
        }

        void main(){
            vec2 px = 1.0 / uResolution;
            vec2 center = vUv - 0.5;

            // Heat haze
            float cx = center.x;
            float hazeMask = exp(-(1.0-vUv.y)*2.0) * exp(-cx*cx*12.0);
            float n1 = fract(sin(dot(vec2(vUv.x*6.0+uTime*0.15,vUv.y*14.0-uTime*1.4),vec2(127.1,311.7)))*43758.5);
            vec2 disp = vec2(n1-0.5,0.0)*0.004*hazeMask;
            float sonicWarp = uSonicDistortion * exp(-length(center)*2.0);
            vec2 warpUv = vUv + disp + center * sonicWarp * 0.12;
            vec3 col = texture2D(tDiffuse, warpUv).rgb;

            // Bloom
            vec3 blur = (
                texture2D(tDiffuse, warpUv + vec2( px.x, px.y)*2.0).rgb +
                texture2D(tDiffuse, warpUv + vec2(-px.x, px.y)*2.0).rgb +
                texture2D(tDiffuse, warpUv + vec2( px.x,-px.y)*2.0).rgb +
                texture2D(tDiffuse, warpUv + vec2(-px.x,-px.y)*2.0).rgb
            ) * 0.25;
            float blurLum = dot(blur, vec3(0.299, 0.587, 0.114));
            col += blur * smoothstep(0.38, 0.58, blurLum) * 0.16;

            // HDR compression
            vec3 hdrCurve = col / (col + vec3(1.0));
            col = mix(col, hdrCurve, uHdrMix);

            // Anamorphic streak
            vec3 streak = vec3(0.0);
            for(int i=-16;i<=16;i++){
                vec3 s = texture2D(tDiffuse, vec2(warpUv.x+float(i)*px.x*5.0, warpUv.y)).rgb;
                float bright = dot(s, vec3(0.8,0.5,0.2));
                streak += s * max(0.0, bright-0.55) * exp(-abs(float(i))*0.2);
            }
            col += streak * vec3(1.0, 0.72, 0.30) * 0.025;

            float lum = dot(col, vec3(0.299, 0.587, 0.114));
            col.r += lum * max(0.0, lum - 0.70) * 0.04;
            col = mix(col, vec3(lum), 0.025);
            col = (col - 0.5) * 1.12 + 0.5;
            vec3 shadowTint    = vec3(0.92, 0.86, 0.78);
            vec3 highlightTint = vec3(1.08, 1.02, 0.91);
            col *= mix(shadowTint, highlightTint, smoothstep(0.0, 1.0, lum));
            col += vec3(0.022, 0.012, 0.002) * (1.0 - lum * lum);

            // ── CORRECTED LENS FLARE ──────────────────────────────
            // Gate: only fire when sun is in frustum AND camera is facing toward it
            // uSunFacing: smoothstepped dot(camFwd, sunDir), must be > threshold
            // uSunInFrustum: 1 if uSunNDC is in [0.05,0.95] range
            float flareStrength = uSunFacing * uSunInFrustum;
            // Additional edge fade: reduce flare near screen borders
            vec2 sunUv = uSunNDC;
            float edgeFade = smoothstep(0.0, 0.12, sunUv.x) * smoothstep(1.0, 0.88, sunUv.x)
                           * smoothstep(0.0, 0.12, sunUv.y) * smoothstep(1.0, 0.88, sunUv.y);
            flareStrength *= edgeFade;

            if(flareStrength > 0.005){
                vec2 sunDelta  = vUv - sunUv;
                float sunDist  = length(sunDelta);
                // Direction from screen center through sun (for ghost placement)
                vec2 screenCenter = vec2(0.5);
                vec2 ghostDir = normalize(sunUv - screenCenter + vec2(0.00001));

                // Core glow — tight radial at sun position
                float coreFlare = exp(-sunDist * sunDist * 280.0);

                // Halo ring at a fixed angular radius
                float haloFlare = exp(-pow((sunDist - 0.09) * 18.0, 2.0));

                // Anamorphic horizontal streak (physical optical artifact)
                // Only along the true horizontal axis in screen space
                vec2 sunDeltaAspect = sunDelta * vec2(uResolution.x/uResolution.y, 1.0);
                float streakAlong = dot(normalize(sunDeltaAspect+vec2(0.00001)), vec2(1.0,0.0));
                float streakPerp  = length(sunDeltaAspect - streakAlong * sunDeltaAspect * 1.0);
                float streakFlare = exp(-pow(abs(dot(sunDelta, vec2(0.0,1.0)))*70.0, 2.0))
                                  * exp(-sunDist * 1.4) * 0.8;

                // Lens ghosts — reflected along optical axis from sun through screen center
                vec2 ghost1Pos = sunUv - ghostDir * 0.18;
                vec2 ghost2Pos = sunUv - ghostDir * 0.38;
                vec2 ghost3Pos = sunUv - ghostDir * 0.62;
                vec2 ghost4Pos = sunUv + ghostDir * 0.22;
                float ghost1 = exp(-length(vUv - ghost1Pos) * 22.0);
                float ghost2 = exp(-length(vUv - ghost2Pos) * 30.0);
                float ghost3 = exp(-length(vUv - ghost3Pos) * 18.0);
                float ghost4 = exp(-length(vUv - ghost4Pos) * 28.0);

                col += vec3(1.0,0.88,0.55) * coreFlare  * 0.28 * flareStrength;
                col += vec3(1.0,0.80,0.40) * haloFlare  * 0.12 * flareStrength;
                col += vec3(1.0,0.60,0.20) * streakFlare* 0.18 * flareStrength;
                col += vec3(1.0,0.72,0.38) * ghost1     * 0.05 * flareStrength;
                col += vec3(0.7,0.85,1.0)  * ghost2     * 0.04 * flareStrength;
                col += vec3(1.0,0.90,0.70) * ghost3     * 0.03 * flareStrength;
                col += vec3(0.8,0.70,1.0)  * ghost4     * 0.025* flareStrength;
            }

            // Vignette
            vec2 vigUv = center * vec2(1.0, 1.22);
            float vig = mix(0.960, 1.0, smoothstep(0.90, 0.44, length(vigUv)));
            col *= vig;

            // Sensor noise
            float frame = floor(uTime*12.0);
            float thermal = blueNoise(vUv*0.9, frame*0.5);
            col += vec3(thermal) * uThermalNoise * 0.32;
            col += vec3(blueNoise(vUv*0.9, frame*0.5)*0.002);

            col = clamp(col, 0.0, 1.0);
            gl_FragColor = vec4(col, 1.0);
        }
    `, {
        uResolution:     { value: new THREE.Vector2(rtWidth, rtHeight) },
        uSunNDC:         { value: new THREE.Vector2(0.5, 0.5) },
        uSunFacing:      { value: 0.0 },
        uSunInFrustum:   { value: 0.0 },
        uCamVel:         { value: new THREE.Vector3() },
        uTargetVel:      { value: new THREE.Vector3() },
        uSonicDistortion:{ value: 0.0 },
        uHdrMix:         { value: 0.10 },
        uThermalNoise:   { value: 0.004 }
    });

    // ── Lens flare uniform update — physically correct projection ──
    function updateSunFlareUniforms() {
        // Project sun world pos into NDC, then to 0..1 UV
        const sunNdc = sunPos.clone().project(camera);
        // sunNdc.z > 1 means sun is behind camera
        const behindCamera = sunNdc.z > 1.0;
        const uvX = sunNdc.x * 0.5 + 0.5;
        const uvY = sunNdc.y * 0.5 + 0.5;  // note: Y flipped in screen space
        const uvYScreen = 1.0 - uvY;        // flip Y so 0=top in texture
        gradeQ.uniforms.uSunNDC.value.set(uvX, uvYScreen);

        // In-frustum check: NDC x,y must be in screen bounds and not behind cam
        const inFrustum = (!behindCamera &&
            uvX > 0.04 && uvX < 0.96 &&
            uvYScreen > 0.04 && uvYScreen < 0.96) ? 1.0 : 0.0;
        gradeQ.uniforms.uSunInFrustum.value = inFrustum;

        // Camera forward dot sun direction — must be positive to see flare
        const camFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const sunDirNorm = sunPos.clone().normalize();
        const facing = Math.max(0.0, camFwd.dot(sunDirNorm));
        // Smooth threshold: flare ramps in only when clearly facing sun
        const facingSmooth = THREE.MathUtils.smoothstep(0.35, 0.75, facing);
        gradeQ.uniforms.uSunFacing.value = facingSmooth;
    }

    // ── Sky dome ──────────────────────────────────────────────────
    const skyDomeMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
            uTime: { value: 0 },
            uWormholePos: { value: sunPos.clone() },
            uSceneIlluminance: { value: 1.0 }
        },
        vertexShader: `
            varying vec3 vWorldPos;
            void main(){
                vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime; uniform vec3 uWormholePos; uniform float uSceneIlluminance;
            varying vec3 vWorldPos;
            float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
            float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){v+=a*fract(sin(dot(floor(p),vec3(127.1,311.7,74.7)))*43758.5);p*=2.0;a*=0.5;} return v; }
            float noise31(vec3 p){ vec3 i=floor(p); vec3 f=fract(p); f=f*f*(3.0-2.0*f);
                return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
                           mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
            void main(){
                vec3 dir = normalize(vWorldPos);
                vec3 whDir = normalize(uWormholePos);
                float up = clamp(dir.y, -1.0, 1.0);
                vec3 zenithCol = vec3(0.002,0.002,0.0015);
                vec3 skyMidCol = vec3(0.040,0.025,0.012);
                vec3 horizonCol = vec3(0.125,0.070,0.038);
                float zenithCurve = smoothstep(-0.1, 0.6, up);
                vec3 col = mix(horizonCol, skyMidCol, zenithCurve);
                col = mix(col, zenithCol, pow(zenithCurve, 2.0) * 0.85);
                col += vec3(0.045,0.025,0.014)*uSceneIlluminance * smoothstep(-0.20, 0.60, up) * 0.88;
                col += vec3(0.110,0.062,0.032) * pow(1.0-abs(up), 2.8) * 1.65 * uSceneIlluminance;
                float whDot = max(0.0, dot(dir, whDir));
                float rayDistance = length(cross(dir, whDir));
                col += vec3(1.0,0.92,0.75) * exp(-rayDistance*rayDistance*10.0)*0.18 * uSceneIlluminance * 0.42;
                col += vec3(1.0,0.92,0.760)* exp(-rayDistance*rayDistance*3.0)*0.12 * uSceneIlluminance * 0.42;
                float pulse = 0.96+0.04*sin(uTime*0.32+1.57);
                col += vec3(1.0,0.995,0.960) * pow(whDot,200.0) * 22.0 * pulse * uSceneIlluminance;
                col += vec3(1.0,0.92,0.68)   * pow(whDot,100.0) * 3.2  * pulse * uSceneIlluminance;
                col += vec3(1.0,0.92,0.68)   * pow(whDot,14.0)  * 1.6  * uSceneIlluminance;
                col += vec3(0.98,0.80,0.45)  * pow(whDot,2.8)   * 0.55 * uSceneIlluminance;
                vec3 coronaPos = dir * mix(4.0, 7.0, sin(uTime*0.12)*0.5+0.5);
                float coronaNoise = fbm(coronaPos + uTime*0.025);
                col += mix(vec3(1.0,0.92,0.68),vec3(0.98,0.80,0.45),coronaNoise)
                       * coronaNoise * smoothstep(0.88,0.20,whDot) * uSceneIlluminance * 0.28;
                float bandFade = smoothstep(0.05, 0.35, abs(dir.y));
                vec3 starCell = floor(dir * 320.0);
                float starSeed = hash13(starCell);
                if(starSeed > 0.992 && bandFade > 0.2){
                    float mag = pow((starSeed-0.992)/0.008, 2.0)*0.8;
                    float twinkle = (sin(uTime*(2.0+starSeed*3.0)+starSeed*63.0)*0.5+0.5)*0.5
                                  + (sin(uTime*(0.8+starSeed*1.5)+starSeed*31.0)*0.3+0.7)*0.5;
                    col += mix(vec3(1.0,0.97,0.92),vec3(1.0,0.93,0.80),mag) * twinkle * (0.35+mag*0.55) * bandFade;
                }
                float nebulaMask = smoothstep(0.65,0.05,up)*(1.0-smoothstep(0.82,0.10,whDot));
                float nebulaNoise = fbm(dir*3.6+uTime*0.008);
                col += mix(vec3(0.14,0.07,0.03),vec3(0.28,0.16,0.08),nebulaNoise) * nebulaMask * nebulaNoise * 0.18;
                col *= mix(1.0, 0.90, smoothstep(0.7,-0.1,up));
                col = clamp(col, 0.0, 1.0);
                gl_FragColor = vec4(col, 1.0);
            }
        `
    });
    const skyDomeMesh = new THREE.Mesh(new THREE.SphereGeometry(85,64,32), skyDomeMat);
    scene.add(skyDomeMesh);

    // ── Solar core ────────────────────────────────────────────────
    let wormhole = null, eventHorizon = null;
    (function createGargantua(){
        const bhGroup = new THREE.Group();
        bhGroup.position.copy(sunPos);
        const sunCoreMat = new THREE.ShaderMaterial({
            uniforms: { uTime:{value:0}, uCameraPos:{value:new THREE.Vector3()} },
            side: THREE.DoubleSide, transparent: true, depthWrite: false,
            blending: THREE.NormalBlending,
            vertexShader:`varying vec2 vUv; varying vec3 vWorldPos; varying vec3 vLocalPos;
                void main(){ vUv=uv; vLocalPos=position; vWorldPos=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader:`uniform float uTime; uniform vec3 uCameraPos; varying vec3 vWorldPos; varying vec3 vLocalPos;
                float hash(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
                float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
                float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.0;a*=0.5;}return v;}
                void main(){
                    float body=length(vLocalPos); float pulse=0.5+0.5*sin(uTime*0.72);
                    float gran=fbm(normalize(vLocalPos)*12.0+uTime*0.03);
                    float edge=smoothstep(1.08,0.48,body); float corona=smoothstep(1.65,0.58,body)*(0.72+gran*0.28);
                    vec3 col=mix(vec3(0.98,0.56,0.16),vec3(1.0,0.84,0.48),edge);
                    col=mix(col,vec3(1.0,0.98,0.86),edge*edge);
                    col+=vec3(0.18,0.10,0.03)*corona;
                    col=clamp(col*(1.15+pulse*0.10),0.0,0.99);
                    float alpha=clamp(0.95-body*0.34+corona*0.22,0.0,1.0);
                    gl_FragColor=vec4(col,alpha);}`
        });
        sunCoreMat.toneMapped = false;
        const coronaMat = new THREE.ShaderMaterial({
            uniforms:{uTime:{value:0},uCameraPos:{value:new THREE.Vector3()}},
            transparent:true,depthWrite:false,blending:THREE.NormalBlending,
            vertexShader:`varying vec3 vNormal; varying vec3 vViewDir;
                void main(){ vNormal=normalize(normalMatrix*normal); vec4 mvp=modelViewMatrix*vec4(position,1.0);
                    vec3 wp=(modelMatrix*vec4(position,1.0)).xyz; vViewDir=normalize(wp-cameraPosition); gl_Position=projectionMatrix*mvp; }`,
            fragmentShader:`uniform float uTime; varying vec3 vNormal; varying vec3 vViewDir;
                void main(){
                    float dnv=dot(vNormal,-vViewDir);
                    float ring1=exp(-pow((dnv-0.08)*34.0,2.0));
                    float ring2=exp(-pow((dnv-0.18)*14.0,2.0))*0.36;
                    vec3 col=mix(vec3(1.0,0.82,0.44),vec3(1.0,0.98,0.88),smoothstep(0.1,0.0,dnv))*(ring1+ring2)*2.0;
                    gl_FragColor=vec4(clamp(col,0.0,0.98),(ring1+ring2)*0.86);}`
        });
        coronaMat.toneMapped = false;
        const sunCore = new THREE.Mesh(new THREE.SphereGeometry(1.28,64,64), sunCoreMat);
        sunCore.renderOrder = 40; bhGroup.add(sunCore);
        const corona = new THREE.Mesh(new THREE.SphereGeometry(1.95,64,64), coronaMat);
        corona.scale.set(1.06,1.06,0.44); corona.renderOrder = 39; bhGroup.add(corona);
        eventHorizon = sunCore; eventHorizon.renderOrder = 41;
        const glowShell = new THREE.Mesh(new THREE.SphereGeometry(2.4,48,32), new THREE.MeshBasicMaterial({
            color:0xffb45a,transparent:true,opacity:0.10,depthWrite:false,
            blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false
        }));
        glowShell.renderOrder = 38; bhGroup.add(glowShell);
        scene.add(bhGroup);
        wormhole = bhGroup;
        wormhole.userData.materials = [sunCoreMat, coronaMat];
    })();

    // ── GROUND — rich multi-layer procedural terrain ───────────────
    // Uses stacked noise layers for: rock strata, cracks, dried mud,
    // dust pooling in low spots, ember-lit crevices, and edge oxidation.
    const groundMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uHeroGroundPos: { value: new THREE.Vector2(0,0) },
            uHeroGroundIntensity: { value: 0 },
            uSunWorldPos: { value: sunPos.clone() },
            uSunGlow: { value: 0 },
            uWarmSpillIntensity: { value: 0.0 },
            uSceneIlluminance: { value: 1.0 },
            uBounceLightColor: { value: new THREE.Color(0xff9c5d) },
            uBounceLightIntensity: { value: 0.0 },
            uSkyLightColor: { value: new THREE.Color(0x86aee6) },
            uSkyLightIntensity: { value: 0.0 }
        },
        vertexShader:`
            varying vec3 vWP; varying vec3 vN; varying vec2 vUv2;
            void main(){
                vWP=(modelMatrix*vec4(position,1.0)).xyz;
                vN=normal; vUv2=uv;
                gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
            }
        `,
        fragmentShader:`
            uniform float uTime;
            uniform vec2 uHeroGroundPos; uniform float uHeroGroundIntensity;
            uniform vec3 uSunWorldPos; uniform float uSunGlow;
            uniform float uWarmSpillIntensity; uniform float uSceneIlluminance;
            uniform vec3 uBounceLightColor; uniform float uBounceLightIntensity;
            uniform vec3 uSkyLightColor;    uniform float uSkyLightIntensity;
            varying vec3 vWP; varying vec3 vN; varying vec2 vUv2;

            // ── Multi-frequency hash & noise ──────────────────────
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
            float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }

            float noise2(vec2 p){
                vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
                return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                           mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
            }
            float noise3(vec3 p){
                vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
                return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),
                               mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
                           mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),
                               mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);
            }

            // ── Layered FBM for terrain macro shape ───────────────
            float fbm(vec2 p){
                float v=0.0, a=0.5;
                for(int i=0;i<6;i++){ v+=a*noise2(p); p=p*2.1+vec2(1.7,9.2); a*=0.5; }
                return v;
            }

            // ── Ridge noise — creates rocky ridgeline edges ───────
            float ridgeNoise(vec2 p){
                float v=0.0, a=0.5;
                for(int i=0;i<4;i++){ float n=noise2(p); v+=a*(1.0-abs(n*2.0-1.0)); p=p*2.1+vec2(5.3,2.8); a*=0.5; }
                return v;
            }

            // ── Voronoi distance — dried mud crack pattern ─────────
            float voronoi(vec2 p){
                vec2 i=floor(p);
                float minDist=9.0;
                for(int dy=-1;dy<=1;dy++){
                    for(int dx=-1;dx<=1;dx++){
                        vec2 cell=i+vec2(dx,dy);
                        vec2 pt=cell + vec2(hash(cell)*0.8+0.1, hash(cell+vec2(17.0,31.0))*0.8+0.1);
                        float d=length(p-pt);
                        minDist=min(minDist,d);
                    }
                }
                return minDist;
            }

            // ── Crack pattern from voronoi edges ──────────────────
            float crackPattern(vec2 p, float scale){
                float v1=voronoi(p*scale);
                float v2=voronoi(p*scale*2.1+vec2(3.7,1.9));
                // Edge = distance to crack (small = crack)
                float crack=1.0-smoothstep(0.0, 0.04, v1);
                float crack2=1.0-smoothstep(0.0, 0.025, v2);
                return max(crack, crack2*0.6);
            }

            void main(){
                vec2 p = vWP.xz;
                float slopeFacing = clamp(vN.y, 0.0, 1.0);

                // ── Terrain height & structure layers ─────────────
                float macro   = fbm(p * 0.08 + vec2(3.7, -1.9));       // large rock formations
                float meso    = fbm(p * 0.32 + vec2(-4.2, 8.1));       // medium boulders
                float micro   = noise2(p * 1.65 + vec2(-7.8, 4.2));    // surface texture
                float micro2  = noise2(p * 4.8  + vec2(5.1, -3.3));    // fine grit
                float micro3  = noise2(p * 11.0 + vec2(-2.1, 6.4));    // grain detail
                float ridge   = ridgeNoise(p * 0.18 + vec2(8.2, 3.1)); // rock ridges
                float cracks  = crackPattern(p, 0.9);                   // mud/rock cracks
                float fineCrk = crackPattern(p, 3.2);                   // fine surface cracks
                float dustPool= fbm(p * 0.06 + vec2(12.0, -5.0));      // dust accumulation map

                // ── Derived terrain properties ─────────────────────
                float elevation = macro * 0.55 + meso * 0.30 + micro * 0.15;
                float roughness = micro2 * 0.6 + micro3 * 0.4;
                float ridgeMask = smoothstep(0.4, 0.8, ridge);
                float dustMask  = smoothstep(0.55, 0.85, dustPool) * (1.0 - ridgeMask * 0.7);

                // ── Rock color palette ─────────────────────────────
                // Strata: layered geological colours from deep basalt to oxidised surface
                vec3 basalt       = vec3(0.035, 0.028, 0.022);   // deep dark basalt
                vec3 rockDark     = vec3(0.060, 0.045, 0.032);   // dark terracotta rock
                vec3 rockMid      = vec3(0.145, 0.108, 0.074);   // mid sienna
                vec3 rockLight    = vec3(0.240, 0.185, 0.128);   // sun-bleached rock
                vec3 ironOxide    = vec3(0.310, 0.155, 0.055);   // rust-red iron oxide
                vec3 dustColour   = vec3(0.195, 0.165, 0.125);   // fine dust/silt
                vec3 crackGlow    = vec3(0.280, 0.105, 0.020);   // ember-lit crack interior
                vec3 ridgeLight   = vec3(0.285, 0.215, 0.148);   // sun-hit ridge tops
                vec3 sootDark     = vec3(0.018, 0.012, 0.008);   // soot-blackened zones

                // ── Base rock blend — macro elevation controls strata ─
                vec3 col = mix(basalt, rockDark, smoothstep(0.0, 0.3, elevation));
                col = mix(col, rockMid,  smoothstep(0.25, 0.60, elevation + meso * 0.2));
                col = mix(col, rockLight,smoothstep(0.55, 0.90, elevation + ridge * 0.15));

                // ── Iron oxide streaks — follows mid-elevation band ───
                float oxideMask = smoothstep(0.30, 0.55, meso) * (1.0 - smoothstep(0.65, 0.90, elevation));
                oxideMask *= (1.0 - ridgeMask * 0.5);
                col = mix(col, ironOxide, oxideMask * 0.60);

                // ── Ridge highlight — catch light on raised edges ─────
                col = mix(col, ridgeLight, ridgeMask * slopeFacing * 0.55);

                // ── Dust pools in low-lying areas ──────────────────────
                col = mix(col, dustColour, dustMask * (1.0 - slopeFacing * 0.4) * 0.72);

                // ── Crack darkening — cracks go deep, shadow inside ────
                float crackDepth = cracks * 0.85 + fineCrk * 0.45;
                col = mix(col, sootDark, crackDepth * 0.78);

                // ── Ember glow in cracks — orange sub-surface scatter ──
                float emberGlow = cracks * (0.35 + noise2(p * 2.2 + uTime * 0.08) * 0.65);
                emberGlow *= smoothstep(0.3, 0.8, 1.0 - dustMask); // cracks hidden under dust
                col += crackGlow * emberGlow * 0.14;

                // ── Fine surface detail — grain & micro-roughness ──────
                col += vec3(0.028, 0.018, 0.008) * (roughness - 0.5);
                col += vec3(0.010, 0.006, 0.002) * (micro3 - 0.5) * 0.5;

                // ── Pebble scatter — small specular from pebble tops ──
                float pebble = step(0.88, noise2(p * 8.5 + vec2(3.1, 7.2)));
                float pebbleLight = pebble * slopeFacing * 0.12;
                col += vec3(0.18, 0.14, 0.10) * pebbleLight;

                // ── Directional sun lighting ───────────────────────────
                vec3 sunDir = normalize(uSunWorldPos - vWP);
                float sunDiff = max(dot(vN, sunDir), 0.0);
                float bhFalloff = exp(-distance(vWP, uSunWorldPos) * 0.028);
                vec3 bhColor = vec3(1.05, 0.58, 0.18);
                col += bhColor * sunDiff * bhFalloff * uSunGlow * 0.22;

                // ── Warm omni spill ────────────────────────────────────
                float spill = exp(-distance(vWP, uSunWorldPos) * 0.045);
                col += bhColor * spill * uWarmSpillIntensity * 0.11;

                // ── Indirect bounce & sky ──────────────────────────────
                col += uBounceLightColor * uBounceLightIntensity * (0.45 + 0.55*slopeFacing);
                col += uSkyLightColor    * uSkyLightIntensity    * (0.50 + 0.50*slopeFacing);

                // ── Ambient fill ───────────────────────────────────────
                float illuminanceFill = uSceneIlluminance;
                col += vec3(0.16, 0.10, 0.06) * illuminanceFill * (0.55 + 0.45*slopeFacing);
                col += vec3(0.05, 0.06, 0.09) * illuminanceFill * (0.50 + 0.50*slopeFacing);

                // ── Hero proximity glow ────────────────────────────────

    function updPts(sys,dtScl,driftScl){
        const pos=sys.pos,spd=sys.spd,cnt=sys.cnt,hMax=sys.hMax;
        for(let i=0;i<cnt;i++){
            pos[i*3+1]+=dtScl*spd[i];
            pos[i*3]+=Math.sin(t*0.9+i*0.5)*dtScl*0.012*driftScl;
            if(pos[i*3+1]>hMax){
                pos[i*3+1]=0.05+Math.random()*0.3;
                const r=sys.rMin+Math.random()*(sys.rMax-sys.rMin),a=Math.random()*Math.PI*2;
                pos[i*3]=Math.cos(a)*r; pos[i*3+2]=Math.sin(a)*r;
            }
        }
        sys.pts.geometry.attributes.position.needsUpdate=true;
    }

    function applyWakeToSystem(sys,source,velocity,radius,strength,lift){
        const pos=sys.pos, r2=radius*radius;
        const velLen=velocity.length();
        const vn=velLen>0.001?velocity.clone().normalize():new THREE.Vector3(1,0,0);
        for(let i=0;i<sys.cnt;i++){
            const ix=i*3;
            const dx=pos[ix]-source.x, dy=pos[ix+1]-source.y, dz=pos[ix+2]-source.z;
            const d2=dx*dx+dy*dy+dz*dz;
            if(d2>r2) continue;
            const d=Math.sqrt(Math.max(d2,0.0001));
            const falloff=1.0-d/radius;
            const push=strength*falloff*falloff;
            pos[ix]   +=(dx/d)*push*0.010;
            pos[ix+1] +=lift*push*0.014;
            pos[ix+2] +=(dz/d)*push*0.010;
            pos[ix]   -=vn.x*push*0.008*velLen*0.04;
            pos[ix+2] -=vn.z*push*0.008*velLen*0.04;
        }
        sys.pts.geometry.attributes.position.needsUpdate=true;
    }

    function spawnDustFromShip(shipPos, shipVel, proximity, throttle, dt){
        const velLen=shipVel.length();
        if(proximity<0.08||velLen<0.5) return;
        const vn=shipVel.clone().normalize();
        const up=new THREE.Vector3(0,1,0);
        const perp=vn.clone().cross(up).normalize();
        const spawnStrength=proximity*throttle;
        for(let i=0;i<dustCount;i++){
            dustLife[i]-=dt;
            const ix=i*3;
            if(dustLife[i]>0){
                dustVel[ix]*=0.94; dustVel[ix+1]*=0.96; dustVel[ix+2]*=0.94;
                dustVel[ix+1]-=0.8*dt;
                dustPos[ix]+=dustVel[ix]*dt; dustPos[ix+1]+=dustVel[ix+1]*dt; dustPos[ix+2]+=dustVel[ix+2]*dt;
                if(dustPos[ix+1]<-0.70) dustLife[i]=0;
            } else if(spawnStrength>0.05 && Math.random()<spawnStrength*0.12){
                const behind=shipPos.clone().sub(vn.clone().multiplyScalar(1.5+Math.random()*3.0));
                dustPos[ix]  =behind.x+(Math.random()-0.5)*4.0;
                dustPos[ix+1]=Math.max(-0.65,-0.65+Math.random()*0.12);
                dustPos[ix+2]=behind.z+(Math.random()-0.5)*4.0;
                const spd2=velLen*0.14*spawnStrength;
                dustVel[ix]  =-vn.x*spd2+(Math.random()-0.5)*spd2*0.8+perp.x*(Math.random()-0.5)*spd2*1.2;
                dustVel[ix+1]=1.8*spawnStrength+Math.random()*1.4*spawnStrength;
                dustVel[ix+2]=-vn.z*spd2+(Math.random()-0.5)*spd2*0.8+perp.z*(Math.random()-0.5)*spd2*1.2;
                dustLife[i]=0.5+Math.random()*1.2;
            }
        }
        dustGeo.attributes.position.needsUpdate=true;
    }

    function animate(){

        const dt=Math.min((now-lastMs)/1000,0.033);
        lastMs=now; t+=dt;

        smokeU.uTime.value=t;

        if(skyDomeMat.uniforms.uWormholePos) skyDomeMat.uniforms.uWormholePos.value.copy(sunPos);

        groundMat.uniforms.uHeroGroundPos.value.set(heroFlightState.position.x,heroFlightState.position.z);
        groundMat.uniforms.uHeroGroundIntensity.value=heroFlightState.proximity*(1.2+heroFlightState.throttle*1.1);

        sunLight.intensity=1.68+Math.sin(t*0.12)*0.07+Math.sin(t*0.35)*0.03;
        wormholeSpillLight.intensity=0.62+Math.sin(t*0.22)*0.025;
        wormholeSpillLight.position.copy(sunPos);
        wormholeSpillLight.target.position.set(0,0,0);
        wormholeSpillLight.target.updateMatrixWorld();

        const sceneIlluminance=Math.max(0.82,Math.min(1.35,
            0.88 + sunLight.intensity*0.20 + wormholeSpillLight.intensity*0.22));
        skyDomeMat.uniforms.uSceneIlluminance.value=sceneIlluminance;
        groundMat.uniforms.uSunGlow.value=sunLight.intensity;
        groundMat.uniforms.uWarmSpillIntensity.value=wormholeSpillLight.intensity;
        groundMat.uniforms.uSceneIlluminance.value=sceneIlluminance;

        const bounceScale=sceneIlluminance/1.0;
        groundBounceLight.intensity=(0.54+Math.sin(t*0.55)*0.022)*bounceScale;
        skyBounceLight.intensity=(0.44+Math.sin(t*0.33)*0.015)*bounceScale;
        ambientLight.intensity=(0.24+Math.sin(t*1.1)*0.015)*bounceScale;
        hemiLight.intensity=(0.92+Math.sin(t*0.90)*0.020)*bounceScale;
        groundMat.uniforms.uBounceLightColor.value.set(0xff9c5d);
        groundMat.uniforms.uBounceLightIntensity.value=groundBounceLight.intensity;
        groundMat.uniforms.uSkyLightColor.value.set(0xd3a06a);
        groundMat.uniforms.uSkyLightIntensity.value=skyBounceLight.intensity;

        paddleHalo.intensity=0.85+Math.sin(t*5.7)*0.12;
        paddleHalo.position.set(paddleAnchor.position.x,paddleAnchor.position.y+0.1,paddleAnchor.position.z);

        if(wormhole){
            wormhole.rotation.y+=dt*0.05;
            const ps=1.0+Math.sin(t*0.4)*0.015;
            wormhole.scale.set(ps,ps,ps);
            if(eventHorizon){ const hp=1.0+Math.sin(t*0.82)*0.04; eventHorizon.scale.set(hp,hp,hp); eventHorizon.position.x=Math.sin(t*1.2)*0.02; }
            if(wormhole.userData.materials) wormhole.userData.materials.forEach(mat=>{ if(mat.uniforms&&mat.uniforms.uTime) mat.uniforms.uTime.value=t; if(mat.uniforms&&mat.uniforms.uCameraPos) mat.uniforms.uCameraPos.value.copy(camera.position); });
        }

        const whPA=accretionDebris.pos;
        for(let i=0;i<accretionDebris.cnt;i++){
            const ix=i*3;
            const x=whPA[ix],z=whPA[ix+2];
            const r=Math.sqrt(x*x+z*z);
            const os=2.2/Math.max(r,0.3);
            const a=Math.atan2(z,x)+os*dt;
            const nr=r*(1.0-0.015*dt);
            whPA[ix]=Math.cos(a)*nr; whPA[ix+2]=Math.sin(a)*nr;
            if(nr<0.5){ const na=Math.random()*Math.PI*2,nr2=3.0+Math.random()*0.8; whPA[ix]=Math.cos(na)*nr2; whPA[ix+2]=Math.sin(na)*nr2; whPA[ix+1]=(Math.random()-0.5)*0.3; }
        }
        accretionDebris.pts.geometry.attributes.position.needsUpdate=true;

        let dsCamShake=0,dsFOVKick=0;
        for(let i=0;i<ships.length;i++){
            const ship=ships[i],orb=ship.userData;
            const cp=t*orb.speed+orb.offset;
            const sx=(Math.sin(cp)*Math.cos(cp*0.5))*orb.radius*0.85;
            const sz=Math.sin(cp*0.5)*orb.radius*1.2;
            const sy=orb.height+Math.sin(cp*0.45)*4.2+Math.sin(t*orb.wobbleSpeed)*orb.wobbleAmp*0.5;
            const np=cp+0.035;
            const tx=(Math.sin(np)*Math.cos(np*0.5))*orb.radius*0.85;
            const tz=Math.sin(np*0.5)*orb.radius*1.2;
            const ty=orb.height+Math.sin(np*0.45)*4.2+Math.sin((t+0.035)*orb.wobbleSpeed)*orb.wobbleAmp*0.5;
            ship.position.set(sx,sy,sz); ship.lookAt(tx,ty,tz);
            const pp=0.55+Math.sin(t*38.0+i*0.8)*0.35;
            if(orb.engineCores&&orb.engineCores[0]) orb.engineCores[0].material.color.setHSL(0.58,0.95,0.35+pp*0.50);
            const sdC=ship.position.distanceTo(camera.position);
            const sprox=Math.max(0.0,1.0-sdC/28.0);
            if(sprox>0.05){ dsCamShake+=sprox*0.04; dsFOVKick+=sprox*2.5; }
            const fd=1.0-THREE.MathUtils.smoothstep(50,70,Math.sqrt(sx*sx+sz*sz));
            orb.fade=THREE.MathUtils.lerp(orb.fade,fd,0.08);
            if(orb.meshes) orb.meshes.forEach(m=>{ if(m.material&&m.material.opacity!==undefined) m.material.opacity=orb.fade; });
        }

        // ── Hero fly-past ─────────────────────────────────────────
        const cycleTime=t%heroFlightState.cycle;
        const cycleIndex=Math.floor(t/heroFlightState.cycle);
        const rawProgress=cycleTime/heroFlightState.cycle;
        const progress=easeInOutCubic(rawProgress);
        const motionSmooth=easeOutSine(rawProgress);
        const flybyWindow=1.0-THREE.MathUtils.smoothstep(Math.abs(rawProgress-0.5),0.0,0.20);
        const flybyImpact=flybyWindow*flybyWindow*(0.75+heroFlightState.throttle*0.55);
        heroFlightState.progress=progress;
        if(cycleIndex!==heroFlightState.lastCycle){
            heroFlightState.lastCycle=cycleIndex;
            const rp=heroFlightCurve.getPointAt(0);
            const rt=heroFlightCurve.getTangentAt(0).normalize();
            heroFlightState.position.copy(rp);
            heroFlightState.velocity.copy(rt).multiplyScalar(0.1);
            heroFlightState.bank=0;
        }
        const desiredPos=heroFlightCurve.getPointAt(progress);
        const tangent=heroFlightCurve.getTangentAt(progress).normalize();
        const speedBoost=16.0+(Math.sin(progress*Math.PI)*14.0+1.0)*(0.9+motionSmooth*1.1);
        heroFlightState.desiredVelocity.copy(tangent).multiplyScalar(speedBoost);
        const springForce=desiredPos.clone().sub(heroFlightState.position).multiplyScalar(7.5);
        const steeringForce=heroFlightState.desiredVelocity.clone().sub(heroFlightState.velocity).multiplyScalar(2.8);
        const accel=springForce.add(steeringForce);
        const proximityFactor=THREE.MathUtils.clamp(1.0-heroFlightState.position.distanceTo(camera.position)/18.0,0.0,1.0);
        const damping=0.92-proximityFactor*0.12;
        heroFlightState.velocity.addScaledVector(accel,dt);
        heroFlightState.velocity.multiplyScalar(Math.pow(damping,dt*30.0));
        heroFlightState.velocity.add(new THREE.Vector3().copy(tangent).multiplyScalar(0.12*proximityFactor));
        heroFlightState.position.addScaledVector(heroFlightState.velocity,dt);
        heroFlightState.position.lerp(desiredPos,0.092+motionSmooth*0.06+flybyImpact*0.04);

        const bankTarget=THREE.MathUtils.clamp(-heroFlightState.velocity.x*0.02+heroFlightState.velocity.z*0.011+accel.length()*0.006,-1.25,1.25);
        heroFlightState.bank=THREE.MathUtils.lerp(heroFlightState.bank,bankTarget,0.09+proximityFactor*0.07);
        heroFlightState.throttle=THREE.MathUtils.clamp(speedBoost/40.0,0.32,1.0);

        const nearCamera=heroFlightState.position.distanceTo(camera.position);
        const cameraProximity=Math.max(0.0,1.0-nearCamera/18.0);
        const skyFade=THREE.MathUtils.smoothstep(progress,0.01,0.16)*(1.0-THREE.MathUtils.smoothstep(progress,0.82,1.0));
        heroFlightState.fade=Math.max(0.0,Math.min(1.0,skyFade));
        heroFlightState.proximity=Math.pow(cameraProximity,1.85);
        heroFlightState.shake=heroFlightState.proximity*(0.11+heroFlightState.throttle*0.09)+flybyImpact*0.15;
        heroFlightState.distortion=heroFlightState.proximity*0.95+flybyImpact*0.34;
        heroFlightState.exhaustPulse=0.55+Math.sin(t*28.0)*0.22+heroFlightState.throttle*0.45+flybyImpact*0.32;
        heroFlightState.cameraKick=heroFlightState.proximity*0.15+flybyImpact*0.26;

        heroShip.visible=true;
        heroShip.position.copy(heroFlightState.position);
        heroShip.lookAt(heroFlightState.position.clone().add(heroFlightState.velocity));
        heroShip.rotateY(Math.PI); heroShip.rotateZ(heroFlightState.bank);
        heroShip.scale.setScalar(2.28+flybyImpact*0.20);

        const shipOpacity=THREE.MathUtils.clamp(heroFlightState.fade,0.0,1.0);
        heroHullMat.opacity=shipOpacity; heroTrimMat.opacity=shipOpacity;
        heroGlassMat.opacity=THREE.MathUtils.clamp(0.18+shipOpacity*0.58,0.0,1.0);
        heroHullMat.color.copy(heroHullBaseColor).lerp(heroSkyTint,1.0-shipOpacity*0.95);
        heroTrimMat.color.copy(heroTrimBaseColor).lerp(heroSkyTint,1.0-shipOpacity*0.85);
        heroGlassMat.color.copy(heroGlassBaseColor).lerp(heroSkyTint,1.0-shipOpacity*0.7);

        heroBoostLight.intensity=6.0*heroFlightState.throttle*(0.18+heroFlightState.proximity*0.58)*(1.0+flybyImpact*0.75);
        heroCoreLight.intensity=1.4*heroFlightState.throttle*(0.14+heroFlightState.proximity*0.36)*(1.0+flybyImpact*0.55);
        heroRimLight.intensity=0.22*(heroFlightState.proximity+flybyImpact*0.45);
        heroWakeLight.intensity=0.55*heroFlightState.throttle*(0.16+heroFlightState.proximity*0.38)*(1.0+flybyImpact*0.70);
        heroGroundLight.intensity=0.85*heroFlightState.throttle*(0.12+heroFlightState.proximity*0.36)*(1.0+flybyImpact*0.60);
        heroBoostLight.color.setHSL(0.07,1.0,0.55+heroFlightState.exhaustPulse*0.10);

        const flameScale=0.9+heroFlightState.throttle*2.2+heroFlightState.exhaustPulse*1.6+heroFlightState.proximity*0.8+flybyImpact*1.2;
        const flameOpacity=THREE.MathUtils.clamp(0.08+heroFlightState.throttle*0.92,0.0,1.0);
        heroFlameMat.opacity=flameOpacity;
        heroFlameCoreMat.opacity=THREE.MathUtils.clamp(0.12+heroFlightState.throttle*0.88,0.0,1.0);
        const sideFlameZ=THREE.MathUtils.clamp(0.26+heroFlightState.throttle*0.18,0.26,0.44);
        heroFlameLG.scale.set(0.92,0.92,sideFlameZ); heroFlameRG.scale.set(0.92,0.92,sideFlameZ);
        heroFlameCG.scale.set(0.84,0.84,THREE.MathUtils.clamp(0.30+heroFlightState.throttle*0.22,0.30,0.52));
        const csv=THREE.MathUtils.clamp(flameScale*0.18,0.14,0.30);
        if(heroFlameCoreL) heroFlameCoreL.scale.setScalar(csv);
        if(heroFlameCoreR) heroFlameCoreR.scale.setScalar(csv);
        if(heroFlameCoreC) heroFlameCoreC.scale.setScalar(csv*0.85);

        shockwaveMesh.position.x=heroFlightState.position.x;
        shockwaveMesh.position.z=heroFlightState.position.z;
        shockwaveMat.uniforms.uTime.value=t;
        shockwaveMat.uniforms.uIntensity.value=heroFlightState.proximity*heroFlightState.throttle+flybyImpact*0.55;

        vapourTrailMesh.visible=heroFlightState.proximity>0.05||flybyImpact>0.03;
        if(vapourTrailMesh.visible){
            const to=heroFlightState.velocity.clone().normalize().multiplyScalar(-6);
            vapourTrailMesh.position.copy(heroFlightState.position).add(to);
            vapourTrailMesh.lookAt(heroFlightState.position);
            vapourTrailMat.uniforms.uTime.value=t;
            vapourTrailMat.uniforms.uIntensity.value=heroFlightState.throttle*heroFlightState.proximity+flybyImpact*0.42;
        }

        const shipAltitude=heroFlightState.position.y-(-0.72);
        if(shipAltitude<12.0) spawnDustFromShip(heroFlightState.position,heroFlightState.velocity,heroFlightState.proximity,heroFlightState.throttle,dt);

        if(heroFlightState.proximity>0.1){
            applyWakeToSystem(embers,heroFlightState.position,heroFlightState.velocity,10.5,heroFlightState.proximity*5.0,heroFlightState.proximity*2.4);
            applyWakeToSystem(sparks,heroFlightState.position,heroFlightState.velocity,8.0, heroFlightState.proximity*4.0,heroFlightState.proximity*1.8);
            applyWakeToSystem(micro, heroFlightState.position,heroFlightState.velocity,6.5, heroFlightState.proximity*3.2,heroFlightState.proximity*1.3);
            applyWakeToSystem(ash,   heroFlightState.position,heroFlightState.velocity,12.0,heroFlightState.proximity*2.0,heroFlightState.proximity*0.8);

            for(let i=0;i<groundMeshes.length;i++){
                const mesh=groundMeshes[i];
                const dx=mesh.position.x-heroFlightState.position.x;
                const dz=mesh.position.z-heroFlightState.position.z;
                const d2=dx*dx+dz*dz;
                if(d2<144){
                    const d=Math.sqrt(d2);
                    const falloff=1.0-d/12.0;
                    const ps=falloff*heroFlightState.proximity*0.04;
                    mesh.position.x+=(dx/Math.max(d,0.1))*ps;
                    mesh.position.z+=(dz/Math.max(d,0.1))*ps;
                    const liftTarget=(mesh.userData.baseY||-0.68)+falloff*heroFlightState.proximity*0.14;
                    mesh.position.y=THREE.MathUtils.lerp(mesh.position.y,liftTarget,0.12);
                    mesh.rotation.x+=ps*2.0; mesh.rotation.z+=ps*1.5;
                    if(mesh.material&&mesh.userData.baseEmissiveIntensity!==undefined)
                        mesh.material.emissiveIntensity=mesh.userData.baseEmissiveIntensity+falloff*0.022;
                } else {
                    const baseY=mesh.userData.baseY||-0.68;
                    mesh.position.y=THREE.MathUtils.lerp(mesh.position.y,baseY,0.04);
                }
            }

            smokeMeshes.forEach((m,idx)=>{
                const dx=m.position.x-heroFlightState.position.x;
                const dz=m.position.z-heroFlightState.position.z;
                const d=Math.sqrt(dx*dx+dz*dz);
                if(d<5.0){
                    const push=(1.0-d/5.0)*heroFlightState.proximity;
                    m.position.x+=dx/Math.max(d,0.1)*push*0.08;
                    m.position.z+=dz/Math.max(d,0.1)*push*0.08;
                    m.scale.y=1.0+push*2.2;
                } else {
                    const ba=(idx/smokeMeshes.length)*Math.PI*2;
                    m.position.x=THREE.MathUtils.lerp(m.position.x,Math.cos(ba)*1.02,0.02);
                    m.position.z=THREE.MathUtils.lerp(m.position.z,Math.sin(ba)*1.02,0.02);
                    m.scale.y=THREE.MathUtils.lerp(m.scale.y,1.0,0.05);
                }
            });
        } else {
            shockwaveMat.uniforms.uIntensity.value*=0.9;
            for(let i=0;i<groundMeshes.length;i++){
                const mesh=groundMeshes[i];
                const baseY=mesh.userData.baseY||-0.68;
                mesh.position.y=THREE.MathUtils.lerp(mesh.position.y,baseY,0.03);
                if(mesh.material&&mesh.userData.baseEmissiveIntensity!==undefined)
                    mesh.material.emissiveIntensity=mesh.userData.baseEmissiveIntensity;
            }
        }

        updPts(embers,dt*(0.95+heroFlightState.proximity*2.2),1.0+heroFlightState.proximity*1.6);
        updPts(sparks,dt*(1.15+heroFlightState.proximity*2.8),1.2+heroFlightState.proximity*2.0);
        updPts(micro, dt*(1.8+heroFlightState.proximity*3.8),0.8+heroFlightState.proximity*2.6);
        updPts(ash,   dt*0.22,2.5);
        updPts(orbs,  dt*0.26,0.5);

        gradeQ.uniforms.uSonicDistortion.value=heroFlightState.distortion;

        const sceneKick=heroFlightState.proximity*0.22+flybyImpact*0.40;
        groundBounceLight.intensity=(0.54+Math.sin(t*0.55)*0.02)*(1.0+sceneKick*0.18);
        ambientLight.intensity=0.24+heroFlightState.proximity*0.038+flybyImpact*0.05;
        hemiLight.intensity=0.92+heroFlightState.proximity*0.055+flybyImpact*0.08;
        scene.fog.density=0.0018+heroFlightState.proximity*0.00018+flybyImpact*0.00012;
        scene.fog.color.setRGB(0.55,0.40,0.28);

        // ── PADDLE ────────────────────────────────────────────────
        renderAIPaddleToCanvas(paddleCanvas,t);
        paddleTexture.needsUpdate=true;
        const targetDir=new THREE.Vector3(camera.position.x-paddleAnchor.position.x,0,camera.position.z-paddleAnchor.position.z).normalize();
        paddleRig.rotation.set(0,Math.atan2(targetDir.x,targetDir.z),0);
        const bobY=Math.sin(t*1.8)*0.022;
        paddleAnchor.position.set(Math.sin(t*1.05)*0.045,PADDLE_Y+bobY,Math.cos(t*0.88)*0.038);
        paddleRig.scale.set(1+Math.sin(t*1.8)*0.014,1+Math.cos(t*2.1)*0.010,1);
        glowDisc.position.set(paddleAnchor.position.x,paddleAnchor.position.y-PADDLE_H_WORLD*0.56+0.01,paddleAnchor.position.z);
        glowDisc.material.opacity=0.82+Math.sin(t*4.5)*0.05;
        shadowSprite.position.set(paddleAnchor.position.x,0.31,paddleAnchor.position.z);

        waterU.uTime.value=t; waterU.uCamPos.value.copy(camera.position);

        // ── CINEMATIC CAMERA ─────────────────────────────────────
        // Slow, composed crane orbit. Stays at comfortable distances.
        // Three movement phases blended together:
        //   1. Slow base orbit around the scene (full 360 over ~90s)
        //   2. Gentle altitude breathing (crane up/down)
        //   3. Subtle radius pulse (breathes in/out)
        // The look target drifts between altar, sun, and passing ships.
        if(preRenderDone){
            const orbitPeriod = 90.0;  // full revolution in seconds — very slow
            const orbitAngle = (t / orbitPeriod) * Math.PI * 2;

            // Radius: breathes between 7 and 12, very slowly
            const radiusCycle = Math.sin(t * 0.04) * 2.5 + Math.sin(t * 0.07 + 1.0) * 1.5;
            const idealRadius = 9.5 + radiusCycle;

            // Height: crane up from 1.5 to 4.5, back down — dignified not hectic
            const heightCycle = Math.sin(t * 0.055) * 1.2 + Math.sin(t * 0.12 + 0.8) * 0.5;
            const idealHeight = 2.8 + heightCycle;

            // Add a very subtle reactive nudge during hero flyby — not disorienting
            const flybyNudgeRadius = flybyImpact * 0.8;
            const flybyNudgeHeight = flybyImpact * 0.3;

            const idealPos = new THREE.Vector3(
                Math.cos(orbitAngle) * (idealRadius + flybyNudgeRadius),
                idealHeight + flybyNudgeHeight,
                Math.sin(orbitAngle) * (idealRadius + flybyNudgeRadius)
            );

            // Very smooth lerp — camera never snaps or jolts
            camera.position.lerp(idealPos, 0.018);

            // Look target: mostly the altar/plinth at world center,
            // with a slow drift toward the sun direction and a slight downward tilt
            const sunDrift = Math.sin(t * 0.03) * 0.5;  // barely perceptible
            const heightDrift = Math.sin(t * 0.04) * 0.15;

            const idealTarget = new THREE.Vector3(
                Math.sin(orbitAngle * 0.3) * sunDrift,
                0.4 + heightDrift,
                Math.cos(orbitAngle * 0.3) * sunDrift * 0.5
            );
            camState.smoothTarget.lerp(idealTarget, 0.025);

            // Heat haze micro-jitter — very subtle, never nauseating
            const hazeJitter = new THREE.Vector3(
                Math.sin(t * 0.31) * 0.012,
                Math.sin(t * 0.22) * 0.008,
                Math.cos(t * 0.28) * 0.010
            );

            // Shake only during hero close flyby — brief, proportional
            if(heroFlightState.shake > 0.05 || flybyImpact > 0.05){
                const sf = t * 48.0;
                const totalShake = (heroFlightState.shake * 0.4 + flybyImpact * 0.5) * 0.6;
                hazeJitter.x += Math.sin(sf) * totalShake * 0.04;
                hazeJitter.y += Math.cos(sf * 1.1) * totalShake * 0.03;
                hazeJitter.z += Math.sin(sf * 0.9 + 1.0) * totalShake * 0.04;
            }

            camera.lookAt(camState.smoothTarget.clone().add(hazeJitter));

            // Very gentle roll — slight banking as if on a slow dolly
            camera.rotation.z = Math.sin(t * 0.06) * 0.008 + Math.cos(orbitAngle) * 0.006;
        } else {
            camera.position.set(0, 2.8, 9.5);
            camState.smoothTarget.set(0, 0.4, 0);
            camera.lookAt(camState.smoothTarget);
        }

        // FOV: stable, only slight widening during very close passes
        const desiredFov = 75 + flybyImpact * 4.0 + heroFlightState.proximity * 2.0;
        camera.fov = THREE.MathUtils.lerp(camera.fov, desiredFov, 0.06);
        camera.updateProjectionMatrix();

        const duskExposure = 1.18 + heroFlightState.proximity * 0.04 + flybyImpact * 0.06;
        renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, duskExposure, 0.05);

        smokeMeshes.forEach(m => m.lookAt(camera.position));
        depthCluster.children.forEach((p,idx)=>{
            if(p.material&&p.material.emissiveIntensity!==undefined) p.material.emissiveIntensity=0.06+0.05*Math.sin(t*3.2+idx*0.9);
        });

        // Update lens flare uniforms AFTER camera position is set
        updateSunFlareUniforms();

        // ── Render ────────────────────────────────────────────────
        renderer.setRenderTarget(rt1); renderer.clear(); renderer.render(scene,camera);
        gradeQ.uniforms.tDiffuse.value=rt1.texture; gradeQ.uniforms.uTime.value=t;
        renderer.setRenderTarget(null); renderer.clear(); renderer.render(gradeQ.sc,gradeQ.cam);
    }

    clearInterval(loadTick); fill.style.width='100%';
    setTimeout(()=>{
        const l=document.getElementById('loader');
        if(l){l.style.opacity='0'; setTimeout(()=>l.remove(),1200);}
    },500);

    disableFrustumCulling(scene);

    function preRender360(){
        return new Promise((resolve)=>{
            const backupPos=camera.position.clone();
            const steps=8;
            for(let i=0;i<steps;i++){
                const a=i/steps*Math.PI*2;
                camera.position.set(Math.cos(a)*9.5,2.8,Math.sin(a)*9.5);
                camera.lookAt(0,0.4,0);
                updateSunFlareUniforms();
                const preSceneIlluminance=0.92+sunLight.intensity*0.18+wormholeSpillLight.intensity*0.22;
                skyDomeMat.uniforms.uSceneIlluminance.value=preSceneIlluminance;
                groundMat.uniforms.uSceneIlluminance.value=preSceneIlluminance;
                renderer.setRenderTarget(rt1); renderer.clear(); renderer.render(scene,camera);
                gradeQ.uniforms.tDiffuse.value=rt1.texture; gradeQ.uniforms.uTime.value=0;
                renderer.setRenderTarget(null); renderer.clear(); renderer.render(gradeQ.sc,gradeQ.cam);
            }
            camera.position.copy(backupPos); camera.lookAt(0,0.4,0);
            renderer.setRenderTarget(null); resolve();
        });
    }
    preRender360().then(()=>{ preRenderDone=true; animate(); });

    window.addEventListener('resize',()=>{
        const w=window.innerWidth,h=window.innerHeight;
        camera.aspect=w/h; camera.updateProjectionMatrix();
        renderer.setSize(w,h);
        const dpr=renderer.getPixelRatio();
        const nW=w*dpr,nH=h*dpr;
        rt1.setSize(nW,nH); rt2.setSize(nW,nH); rt3.setSize(nW,nH);
        gradeQ.uniforms.uResolution.value.set(nW,nH);
    });
}
</script>
</body>
