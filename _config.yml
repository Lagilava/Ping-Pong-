# GitHub Pages Jekyll Configuration
exclude:
  - .venv
  - node_modules
  - package.json
  - package-lock.json
  - .git
  - .gitignore
  - README.md
  - "*.code-workspace"

# Exclude from processing
keep_files:
  - physics
  - assets
  - audio
  - exports
  - exported-comic
  - scripts
  - ads

# No processing for these extensions
safe: true

# Disable Jekyll processing entirely for these files
plugins_dir: .

# Allow WASM and other binary files to pass through unchanged
include:
  - _redirects
  - .well-known
